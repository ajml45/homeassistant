    - name: "Master Suite Lights On"
      unique_id: master_suite_lights_on
      default_entity_id: sensor.master_suite_lights_on
      icon: mdi:lightbulb-on
      state_class: measurement
      state: >
        {{ [
             'light.can_light',
             'light.master_bedroom_sconces',
             'light.shower_light',
             'light.tub_light_left',
             'light.tub_light_middle',
             'light.tub_light_right'
           ] | select('is_state', 'on') | list | count }}

    - name: "Mudroom Lights On"
      unique_id: mudroom_lights_on
      default_entity_id: sensor.mudroom_lights_on
      icon: mdi:lightbulb-on
      state_class: measurement
      state: >
        {{ [
             'light.mudroom_can_lights',
             'light.mudroom_pendants'
           ] | select('is_state', 'on') | list | count }}

    - name: "Foyer Offices Lights On"
      unique_id: foyer_offices_lights_on
      default_entity_id: sensor.foyer_offices_lights_on
      icon: mdi:lightbulb-on
      state_class: measurement
      state: >
        {{ [
             'light.front_foyer',
             'light.front_foyer_chandelier',
             'light.office_ceiling_light',
             'light.office_desk_lamp',
             'light.office_floor_lamp',
             'light.solarium_rope_light',
             'light.white_room_main_lights',
             'light.white_room_piano_light',
             'light.white_room_table_lamps'
