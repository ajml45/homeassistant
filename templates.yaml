    - name: "Upstairs Lights On"
      unique_id: upstairs_lights_on
      default_entity_id: sensor.upstairs_lights_on
      icon: mdi:lightbulb-on
      state_class: measurement
      state: >
        {{ [
             'light.charlotte_bedroom_table_lamp',
             'light.front_foyer_upstairs_hallway_lights',
             'light.henry_bedroom_table_lamp',
             'light.upstairs_bathroom_light'
           ] | select('is_state', 'on') | list | count }}

    - name: "Basement Lights On"
      unique_id: basement_lights_on
      default_entity_id: sensor.basement_lights_on
      icon: mdi:lightbulb-on
      state_class: measurement
      state: >
        {{ [
             'light.basement_sitting_area_main_lights',
