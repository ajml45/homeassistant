    sequence:
      - variables:
          t0: "{{ now().timestamp() + 0.2 }}"
          k: "{{ kind if kind in ['good', 'bad', 'neutral'] else 'neutral' }}"
          v: "{{ {'good': end_good, 'bad': end_bad}.get(kind, end_neutral) }}"
      - parallel:
          # ---- kitchen: ending effects ----
          - action: media_player.play_media
            target:
              entity_id: "{{ sonos_effects }}"
            data:
              media_content_id: "{{ base_url }}/end_{{ k }}_fx.mp3?v={{ media_version }}"
              media_content_type: music
            continue_on_error: true
          # ---- great room: ending music replaces Spotify (neutral: just fade) ----
          - if:
              - "{{ k != 'neutral' }}"
            then:
              - action: media_player.volume_set
                target:
                  entity_id: "{{ sonos_music }}"
                data:
                  volume_level: "{{ (end_music_volume | float / 100) | round(2) }}"
                continue_on_error: true
              - action: media_player.play_media
                target:
                  entity_id: "{{ sonos_music }}"
                data:
                  media_content_id: "{{ base_url }}/end_{{ k }}_music.mp3?v={{ media_version }}"
                  media_content_type: music
                continue_on_error: true
          # ---- screens ----
          - action: media_player.play_media
            target:
              entity_id: "{{ tvs | map(attribute='cast') | list }}"
            data:
              media_content_id: "{{ base_url }}/end_{{ k }}.mp4?v={{ media_version }}"
              media_content_type: video/mp4
            continue_on_error: true
          - repeat:
              for_each: "{{ tablets }}"
              sequence:
                - action: media_player.media_stop
                  target:
                    entity_id: "{{ repeat.item.player }}"
                  continue_on_error: true
                - action: fully_kiosk.load_url
                  target:
                    device_id: "{{ device_id('switch.' ~ repeat.item.prefix ~ '_screen') }}"
                  data:
                    url: "{{ base_url }}/index.html?v={{ media_version }}&end={{ k }}&t0={{ (t0 * 1000) | int }}"
                  continue_on_error: true
          # ---- Echos: applause / red alert / engines ----
          - action: media_player.play_media
            target:
              entity_id: "{{ echos | map(attribute='entity') | list }}"
            data:
              media_content_id: "{{ echo_end_sounds[k] }}"
              media_content_type: sound
            continue_on_error: true
          # ---- lights ----
          - sequence:
              - variables:
                  steps: "{{ v.wiz }}"
              - *star_battle_runner
          - sequence:
              - variables:
                  steps: "{{ v.white }}"
              - *star_battle_runner
          - sequence:
              - variables:
                  steps: "{{ v.hue }}"
              - *star_battle_runner
          - sequence:
              - variables:
                  steps: "{{ v.govee }}"
              - *star_battle_runner
      - delay:
          milliseconds: "{{ [0, ((t0 + end_restore[k] - now().timestamp()) * 1000) | int] | max }}"
      - action: script.turn_on
        target:
          entity_id: script.star_battle_restore
        data:
          variables:
            cancelled: false

  # -------------------------------------------------------------------
  #  SYNC TEST (~13 s): 8 beeps on the kitchen Sonos while the middle column
  #  of great room cans flashes on each beat.
  #     beep AFTER the flash → raise audio_lead;  BEFORE → lower it.
  #  Try values without editing: Developer Tools → Actions →
  #  script.star_battle_sync_test with data {lead: 0.8}
  # -------------------------------------------------------------------
  star_battle_sync_test:
    alias: "Star Battle – sync test"
    icon: mdi:metronome
    mode: single
    max_exceeded: silent
    fields:
      lead:
        description: "Audio lead to try, in seconds (default: audio_lead)"
        example: 0.8
    variables:
      <<: *star_battle_config
      flash_cans: [light.back_can_middle, light.middle_can_middle, light.front_can_middle]
      beats: [1, 2, 3, 4, 5, 6, 7, 8]
    sequence:
      - variables:
          a_lead: "{{ (lead | float(audio_lead)) if lead is defined else audio_lead }}"
      - action: scene.create
        data:
          scene_id: star_battle_sync_snapshot
          snapshot_entities: "{{ flash_cans }}"
      - action: sonos.snapshot
        data:
          entity_id: "{{ sonos_effects }}"
          with_group: true
        continue_on_error: true
      - action: media_player.unjoin
        target:
          entity_id: "{{ sonos_effects }}"
        continue_on_error: true
      - action: media_player.volume_set
        target:
          entity_id: "{{ sonos_effects }}"
        data:
          volume_level: "{{ (effects_volume | float / 100) | round(2) }}"
        continue_on_error: true
      - action: light.turn_on
        target:
          entity_id: "{{ flash_cans }}"
        data:
          rgb_color: [0, 40, 120]
          brightness: 40
      - variables:
          t0: "{{ now().timestamp() + 3.5 }}"
      - parallel:
          - sequence:
              - delay:
                  milliseconds: "{{ [0, ((t0 - a_lead - now().timestamp()) * 1000) | int] | max }}"
              - action: media_player.play_media
                target:
                  entity_id: "{{ sonos_effects }}"
                data:
                  media_content_id: "{{ base_url }}/sync.mp3?v={{ media_version }}"
                  media_content_type: music
                continue_on_error: true
          - repeat:
              for_each: "{{ beats }}"
              sequence:
                - delay:
                    milliseconds: "{{ [0, ((t0 + repeat.item - now().timestamp()) * 1000) | int] | max }}"
                - action: light.turn_on
                  target:
                    entity_id: "{{ flash_cans }}"
                  data:
                    rgb_color: [255, 255, 255]
                    brightness: 255
                - delay:
                    milliseconds: 250
                - action: light.turn_on
                  target:
                    entity_id: "{{ flash_cans }}"
                  data:
                    rgb_color: [0, 40, 120]
                    brightness: 40
      - delay:
          milliseconds: "{{ [0, ((t0 + 10 - now().timestamp()) * 1000) | int] | max }}"
      - action: scene.turn_on
        target:
          entity_id: scene.star_battle_sync_snapshot
        continue_on_error: true
      - action: sonos.restore
        data:
          entity_id: "{{ sonos_effects }}"
          with_group: true
        continue_on_error: true
      - delay:
          seconds: 3
      - action: scene.turn_on
        target:
          entity_id: scene.star_battle_sync_snapshot
        continue_on_error: true
      - action: persistent_notification.create
        data:
          title: "Star Battle sync test"
          message: >-
            Ran with audio lead {{ a_lead }} s. Beep after flash → raise it; beep before flash → lower it.
