# =====================================================================
#  STAR BATTLE  —  /config/packages/star_battle.yaml        (v1.1, 2026-11-14)
#  (replaces saber_duel.yaml — remove that package, it uses the same Pico)
#
#  A 2-minute battle across the great room + kitchen with no sides, then a
#  standoff that waits up to 5 minutes for the Pico to call the ending:
#
#     0:00  ALERT        klaxons, strips + lamps pulse red
#     0:08  FIRST WAVE   starfighter flybys sweep the cans (one comes through the arches)
#     0:30  FIREFIGHT    red & green blaster bolts streak across rows of cans
#     0:55  DUEL         two blades ignite, ten clashes
#     1:10  SECOND WAVE  alarms, ion cannon (blue flash), shield hits on the lamps
#     1:35  ATTACK RUN   rapid flybys → the cruiser explodes (whole room white→orange)
#     1:52  AFTERMATH    embers
#     2:00  STANDOFF     purple, heartbeat, screens ask WHO WINS? (▲ good / ▼ bad)
#     7:00  nobody called it → BOTH SIDES RETREAT
#
#  Pico (office_office_office_lights_pico, shared with The Dark Side):
#     middle = start / cancel     bottom = cancel     up = the heroes win     down = the villains win
#     (top starts The Dark Side; neither scene starts while the other one is running)
#  The ending can be called any time after the first few seconds.
#
#  Sound:  great room Sonos  = Spotify (and the ending music)
#          kitchen Sonos     = main effects, synced to the lights
#          kitchen tablet    = droids, radio chatter, close blaster pops
#          mudroom tablet    = the war in the distance
#          Echos             = random Amazon sci-fi sounds (they lag; that's fine)
#  Screens: both TVs (Cast MP4) + both tablets (live page synced to t0)
#
#  Media lives in /config/www/star_battle/ (served at /local/star_battle/).
#  Light timelines below are GENERATED from timeline.py — edit tunables, not steps.
# =====================================================================

input_text:
  star_battle_tvs:
    name: "Star Battle – saved TV state"
    max: 255
    initial: "[]"
  star_battle_volumes:
    name: "Star Battle – saved Echo/tablet volumes"
    max: 255
    initial: "{}"

automation:
  - id: star_battle_pico
    alias: "Star Battle – Pico"
    description: "Middle = start/cancel, up = heroes win, down = villains win"
    mode: queued
    max: 3
    triggers:
      - trigger: event
        event_type: lutron_caseta_button_event
        event_data:
          action: press
    variables:
      pico_device_ids: [cdf7071b0ed38a3d5ce144a3fe3de245]
      pico_slug: office_office_office_lights_pico
      start_button: stop
      cancel_button: "off"
      good_button: raise
      bad_button: lower
      running: >-
        {{ is_state('script.star_battle_show', 'on') or is_state('script.star_battle_ending', 'on') }}
      other_running: >-
        {{ is_state('script.dark_side_show', 'on') or is_state('script.dark_side_ending', 'on')
           or is_state('script.dark_side_restore', 'on') }}
    conditions:
      - condition: template
        value_template: >-
          {%- set did = trigger.event.data.device_id | default('') | string -%}
          {{ did in pico_device_ids
             or (device_attr(did, 'name_by_user') or device_attr(did, 'name') or '') | slugify == pico_slug
             or device_entities(did) | select('search', pico_slug) | list | count > 0 }}
    actions:
      - choose:
          - conditions:
              - "{{ trigger.event.data.button_type == start_button and not other_running }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.star_battle_button
          - conditions:
              - "{{ trigger.event.data.button_type == cancel_button and running }}"
            sequence:   # dedicated cancel button: no double-press guard
              - action: script.turn_off
                target:
                  entity_id: [script.star_battle_show, script.star_battle_ending]
              - action: script.turn_on
                target:
                  entity_id: script.star_battle_restore
                data:
                  variables:
                    cancelled: true
          - conditions:
              - "{{ trigger.event.data.button_type in [good_button, bad_button] }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.star_battle_winner
                data:
                  variables:
                    side: "{{ 'good' if trigger.event.data.button_type == good_button else 'bad' }}"

script:
  # -------------------------------------------------------------------
  #  RESTORE (end of an ending, or cancel). Holds the shared config.
  # -------------------------------------------------------------------
  star_battle_restore:
    alias: "Star Battle – restore"
    icon: mdi:restore
    mode: single
    max_exceeded: silent
    fields:
      cancelled:
        description: "True when called from a cancel"
        example: false
    variables: &star_battle_config
      # ===================== TUNABLES =====================
      pre_roll: 3.5            # s from press to t0 (TV wake-up)
      audio_lead: 0.6          # kitchen Sonos start latency (use script.star_battle_sync_test)
      video_lead: 1.5          # Cast start latency
      tablet_lead: 0.5         # tablet pages are clock-synced; this just loads them early
      tablet_audio_lead: 0.4   # tablet speakers (side sounds, timing is loose)
      show_end: 420.0           # 2:00 battle + 5:00 standoff → neutral ending
      winner_open: 5.0         # Pico up/down ignored for the first few seconds
      end_restore: {good: 12.5, bad: 12.5, neutral: 9.0}
      verify_after: [4, 4]
      cancel_settle: 2.5
      effects_volume: 55       # kitchen Sonos, 0-100
      music_volume: 35         # great room soundbar, 0-100 (Spotify)
      end_music_volume: 45     # great room soundbar for the ending music
      tablet_volume: 70        # both tablets, 0-100
      echo_volume: 0.5         # Echos, 0-1
      spotify_uri: "https://open.spotify.com/track/1ghlpxVfPbFH2jenrv9vVw?si=5e01001e46344d5f"
      music_seek: 0
      media_version: 1
      base_url: "http://192.168.68.21:8123/local/star_battle"
      fader_scripts: []        # e.g. [script.ashleys_light_fader]

      # ===================== DEVICES =====================
      sonos_effects: media_player.sonos_kitchen
      sonos_music: media_player.sonos_great_room_soundbar
      tvs:
        - {cast: media_player.great_room_tv, atv: media_player.google_tv_great_room, remote: remote.google_tv_great_room}
        - {cast: media_player.kitchen_tv, atv: media_player.google_tv_kitchen, remote: remote.google_tv_kitchen}
      tablets:
        - {prefix: kitchen_kitchen_ha_tablet, player: media_player.kitchen_kitchen_ha_tablet, audio: tablet_kitchen.mp3}
        - {prefix: mudroom_mudroom_ha_tablet, player: media_player.mudroom_mudroom_ha_tablet, audio: tablet_mudroom.mp3}
      echos:
        - {entity: media_player.echo_show}            # kitchen
        - {entity: media_player.andrew_s_echo_show}   # great room
      # when each Echo plays a random sound (s after t0); one merged list so the
      # parallel branch never reads a variable another branch has overwritten
      echo_schedule: [{t: 3.0, entity: media_player.echo_show}, {t: 15.0, entity: media_player.andrew_s_echo_show}, {t: 34.0, entity: media_player.echo_show}, {t: 47.0, entity: media_player.andrew_s_echo_show}, {t: 61.0, entity: media_player.echo_show}, {t: 72.0, entity: media_player.andrew_s_echo_show}, {t: 86.0, entity: media_player.echo_show}, {t: 97.0, entity: media_player.andrew_s_echo_show}, {t: 104.0, entity: media_player.echo_show}, {t: 110.0, entity: media_player.andrew_s_echo_show}]
      # Amazon sound-library IDs known to work with Alexa Media Player
      echo_sounds: [amzn_sfx_scifi_alarm_04, amzn_sfx_scifi_engines_on_02, amzn_sfx_scifi_sheilds_up_01, amzn_sfx_scifi_alarm_01]
      echo_end_sounds: {good: amzn_sfx_crowd_applause_01, bad: amzn_sfx_scifi_alarm_04, neutral: amzn_sfx_scifi_engines_on_02}

      neutral_lights:
        - light.back_can_left
        - light.back_can_middle
        - light.back_can_right
        - light.middle_can_left
        - light.middle_can_middle
        - light.middle_can_right
        - light.front_can_left
        - light.front_can_middle
        - light.front_can_right
        - light.great_room_back_lamp
        - light.left_couch_lamp
        - light.right_couch_lamp
        - light.great_room_front_lamp
        - light.soundbar_shelf_light
        - light.under_island
        - light.solarium_path_lights
        - light.slider_path_lights
        - light.stair_path_lights
        - light.solarium_spot_lights
        - light.island_pendant_left
        - light.island_pendant_right
        - light.sink_sconce_left
        - light.sink_sconce_right
        - light.stove_sconce_left
        - light.stove_sconce_right

      snapshot_entities:
        - light.back_can_left
        - light.back_can_middle
        - light.back_can_right
        - light.front_can_left
        - light.front_can_middle
        - light.front_can_right
        - light.great_room_back_lamp
        - light.great_room_bar_cabinet_lights
        - light.great_room_bar_lamp
        - light.great_room_fireplace_can
        - light.great_room_front_lamp
        - light.island_pendant_left
        - light.island_pendant_right
        - light.kitchen_above_cabinet
        - light.kitchen_cans_fridge
        - light.kitchen_cans_sink
        - light.kitchen_under_cabinet
        - light.left_couch_lamp
        - light.middle_can_left
        - light.middle_can_middle
        - light.middle_can_right
        - light.right_couch_lamp
        - light.sink_sconce_left
        - light.sink_sconce_right
        - light.sitting_area_left_1
        - light.sitting_area_left_2
        - light.sitting_area_left_3
        - light.sitting_area_left_4
        - light.sitting_area_right_1
        - light.sitting_area_right_2
        - light.sitting_area_right_3
        - light.sitting_area_right_4
        - light.slider_path_lights
        - light.solarium_couch
        - light.solarium_path_lights
        - light.solarium_sconces
        - light.solarium_spot_lights
        - light.soundbar_shelf_light
        - light.stair_path_lights
        - light.stove_sconce_right
        - light.stove_sconce_left
        - light.under_island
        - switch.kitchen_kitchen_ha_tablet_screen
        - switch.kitchen_kitchen_ha_tablet_screensaver
        - number.kitchen_kitchen_ha_tablet_screen_brightness
        - switch.mudroom_mudroom_ha_tablet_screen
        - switch.mudroom_mudroom_ha_tablet_screensaver
        - number.mudroom_mudroom_ha_tablet_screen_brightness
    sequence:
      - if:
          - "{{ cancelled | default(false) | bool }}"
        then:
          - delay:
              seconds: 1
          - action: light.turn_on
            target:
              entity_id: "{{ neutral_lights }}"
            data:
              color_temp_kelvin: 2700
              brightness: 180
            continue_on_error: true
          - delay:
              seconds: "{{ cancel_settle }}"
      - parallel:
          # ---- lights + tablet screens: restore, then verify twice ----
          - sequence:
              - action: scene.turn_on
                target:
                  entity_id: scene.star_battle_snapshot
                data:
                  transition: 2
                continue_on_error: true
              - repeat:
                  for_each: "{{ verify_after }}"
                  sequence:
                    - delay:
                        seconds: "{{ repeat.item }}"
                    - action: scene.turn_on
                      target:
                        entity_id: scene.star_battle_snapshot
                      continue_on_error: true

          # ---- Sonos: fade the great room out, then put both zones back ----
          - sequence:
              - variables:
                  vol_now: "{{ state_attr(sonos_music, 'volume_level') | float(0) }}"
              - if:
                  - "{{ vol_now > 0 }}"
                then:
                  - repeat:
                      for_each: [0.6, 0.35, 0.15, 0.0]
                      sequence:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ sonos_music }}"
                          data:
                            volume_level: "{{ (vol_now * repeat.item) | round(2) }}"
                          continue_on_error: true
                        - delay:
                            milliseconds: 400
              - action: media_player.media_pause
                target:
                  entity_id: ["{{ sonos_music }}", "{{ sonos_effects }}"]
                continue_on_error: true
              - action: sonos.restore
                data:
                  entity_id: ["{{ sonos_music }}", "{{ sonos_effects }}"]
                  with_group: true
                continue_on_error: true
              - delay:
                  seconds: 3
              - if:
                  - "{{ vol_now > 0 and state_attr(sonos_music, 'volume_level') | float(1) == 0 }}"
                then:
                  - action: media_player.volume_set
                    target:
                      entity_id: "{{ sonos_music }}"
                    data:
                      volume_level: "{{ vol_now | round(2) }}"
                    continue_on_error: true

          # ---- tablets: stop audio, volume back, dashboard back ----
          - sequence:
              - variables:
                  vols: >-
                    {%- set s = states('input_text.star_battle_volumes') -%}
                    {{ s | from_json if s.startswith('{') else {} }}
              - repeat:
                  for_each: "{{ tablets }}"
                  sequence:
                    - action: media_player.media_stop
                      target:
                        entity_id: "{{ repeat.item.player }}"
                      continue_on_error: true
                    - if:
                        - "{{ vols.get(repeat.item.player) is number }}"
                      then:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ repeat.item.player }}"
                          data:
                            volume_level: "{{ vols[repeat.item.player] }}"
                          continue_on_error: true
                    - action: button.press
                      target:
                        entity_id: "button.{{ repeat.item.prefix }}_load_start_url"
                      continue_on_error: true
              # ---- Echos: volume back (after any lagging sound has played) ----
              - delay:
                  seconds: 6
              - repeat:
                  for_each: "{{ echos }}"
                  sequence:
                    - action: media_player.volume_set
                      target:
                        entity_id: "{{ repeat.item.entity }}"
                      data:
                        volume_level: "{{ vols.get(repeat.item.entity, 0.4) if vols.get(repeat.item.entity) is number else 0.4 }}"
                      continue_on_error: true

          # ---- TVs: back to what they were doing ----
          - sequence:
              - variables:
                  saved: >-
                    {%- set s = states('input_text.star_battle_tvs') -%}
                    {{ s | from_json if s.startswith('[') else [] }}
              - repeat:
                  for_each: "{{ range(tvs | count) | list }}"
                  sequence:
                    - variables:
                        tv: "{{ tvs[repeat.item] }}"
                        was: "{{ saved[repeat.item] if saved | count > repeat.item else [1, ''] }}"
                    - choose:
                        - conditions:
                            - "{{ was[0] == 0 }}"
                          sequence:
                            - action: media_player.turn_off
                              target:
                                entity_id: "{{ tv.atv }}"
                              continue_on_error: true
                        - conditions:
                            - "{{ was[1] | length > 0 }}"
                          sequence:
                            - action: remote.turn_on
                              target:
                                entity_id: "{{ tv.remote }}"
                              data:
                                activity: "{{ was[1] }}"
                              continue_on_error: true
                      default:
                        - action: media_player.media_stop
                          target:
                            entity_id: "{{ tv.cast }}"
                          continue_on_error: true

  # -------------------------------------------------------------------
  #  BUTTON (Pico middle): start, or cancel if running
  # -------------------------------------------------------------------
  star_battle_button:
    alias: "Star Battle – start / cancel"
    icon: mdi:star-four-points
    mode: single
    max_exceeded: silent
    sequence:
      - choose:
          - conditions:
              - "{{ is_state('script.star_battle_show', 'on') or is_state('script.star_battle_ending', 'on') }}"
            sequence:
              - condition: template
                value_template: >-
                  {{ is_state('script.star_battle_ending', 'on') or
                     (now() - states.script.star_battle_show.last_changed).total_seconds() > 3 }}
              - action: script.turn_off
                target:
                  entity_id: [script.star_battle_show, script.star_battle_ending]
              - action: script.turn_on
                target:
                  entity_id: script.star_battle_restore
                data:
                  variables:
                    cancelled: true
          - conditions:
              - "{{ is_state('script.star_battle_restore', 'on') }}"
            sequence:
              - stop: "Restore in progress"
        default:
          - condition: template     # never on top of The Dark Side
            value_template: >-
              {{ not (is_state('script.dark_side_show', 'on') or is_state('script.dark_side_ending', 'on')
                      or is_state('script.dark_side_restore', 'on')) }}
          - action: script.turn_on
            target:
              entity_id: script.star_battle_show

  # -------------------------------------------------------------------
  #  WINNER (Pico up / down): call the ending while the battle is running
  # -------------------------------------------------------------------
  star_battle_winner:
    alias: "Star Battle – call the ending"
    icon: mdi:trophy
    mode: single
    max_exceeded: silent
    fields:
      side:
        description: "good or bad"
        example: good
    variables:
      pre_roll: 3.5          # keep in sync with the tunables above
      winner_open: 5.0
    sequence:
      - condition: template
        value_template: >-
          {{ side in ['good', 'bad'] and is_state('script.star_battle_show', 'on') and
             (now() - states.script.star_battle_show.last_changed).total_seconds() > pre_roll + winner_open }}
      - action: script.turn_off
        target:
          entity_id: script.star_battle_show
      - action: script.turn_on
        target:
          entity_id: script.star_battle_ending
        data:
          variables:
            kind: "{{ side }}"

  # -------------------------------------------------------------------
  #  SHOW: 2:00 battle + up to 5:00 standoff
  # -------------------------------------------------------------------
  star_battle_show:
    alias: "Star Battle – show"
    icon: mdi:star-four-points
    mode: single
    max_exceeded: silent
    variables:
      <<: *star_battle_config
      # ===================== LIGHT TIMELINE (generated) =====================
      # t = seconds after t0 (0-120 battle, 120-420 standoff). action defaults to light.turn_on.
      # WiZ RGB cans
      steps_wiz:
        - {t: 0.0, entities: [light.back_can_left, light.back_can_middle, light.back_can_right, light.middle_can_left, light.middle_can_middle, light.middle_can_right, light.front_can_left, light.front_can_middle, light.front_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 9.0, entities: [light.middle_can_right], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 9.09, entities: [light.middle_can_middle], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 9.11, entities: [light.middle_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 9.18, entities: [light.middle_can_left], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 9.2, entities: [light.middle_can_middle], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 9.29, entities: [light.middle_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 10.0, entities: [light.back_can_left], data: {rgb_color: [170, 200, 255], brightness: 255}}
        - {t: 10.13, entities: [light.back_can_middle], data: {rgb_color: [170, 200, 255], brightness: 255}}
        - {t: 10.15, entities: [light.back_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 10.26, entities: [light.back_can_right], data: {rgb_color: [170, 200, 255], brightness: 255}}
        - {t: 10.28, entities: [light.back_can_middle], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 10.41, entities: [light.back_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 10.68, entities: [light.back_can_right], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 10.77, entities: [light.back_can_middle], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 10.79, entities: [light.back_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 10.86, entities: [light.back_can_left], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 10.88, entities: [light.back_can_middle], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 10.97, entities: [light.back_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 11.96, entities: [light.back_can_left], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 12.05, entities: [light.back_can_middle], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 12.07, entities: [light.back_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 12.14, entities: [light.back_can_right], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 12.16, entities: [light.back_can_middle], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 12.25, entities: [light.back_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 13.72, entities: [light.back_can_right], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 13.81, entities: [light.back_can_middle], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 13.83, entities: [light.back_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 13.9, entities: [light.back_can_left], data: {rgb_color: [255, 0, 0], brightness: 255}}
        - {t: 13.92, entities: [light.back_can_middle], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 14.01, entities: [light.back_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 14.5, entities: [light.middle_can_right], data: {rgb_color: [170, 200, 255], brightness: 255}}
        - {t: 14.63, entities: [light.middle_can_middle], data: {rgb_color: [170, 200, 255], brightness: 255}}
        - {t: 14.65, entities: [light.middle_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 14.76, entities: [light.middle_can_left], data: {rgb_color: [170, 200, 255], brightness: 255}}
        - {t: 14.78, entities: [light.middle_can_middle], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 14.91, entities: [light.middle_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 15.81, entities: [light.middle_can_right], data: {rgb_color: [0, 255, 60], brightness: 255}}
        - {t: 15.92, entities: [light.middle_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 15.99, entities: [light.middle_can_left], data: {rgb_color: [0, 255, 60], brightness: 255}}
        - {t: 16, entities: [light.back_can_middle], data: {rgb_color: [255, 255, 255], brightness: 255}}
        - {t: 16.1, entities: [light.middle_can_left], data: {rgb_color: [10, 25, 70], brightness: 40}}
        - {t: 16.12, entities: [light.back_can_middle], data: {rgb_color: [255, 110, 0], brightness: 255}}
        - {t: 16.12, entities: [light.middle_can_middle, light.back_can_left, light.back_can_right], data: {rgb_color: [255, 110, 0], brightness: 150}}
        - {t: 16.5, entities: [light.middle_can_middle, light.back_can_left, light.back_can_right], data: {rgb_color: [10, 25, 70], brightness: 40}}
