    sequence:
      - if:
          - "{{ fader_scripts | count > 0 }}"
        then:
          - action: script.turn_off
            target:
              entity_id: "{{ fader_scripts }}"

      # 1. Snapshots: lights + tablet screens, Sonos zones, TVs, Echo/tablet volumes
      - action: scene.create
        data:
          scene_id: star_battle_snapshot
          snapshot_entities: "{{ snapshot_entities }}"
      - action: sonos.snapshot
        data:
          entity_id: ["{{ sonos_music }}", "{{ sonos_effects }}"]
          with_group: true
        continue_on_error: true
      - action: input_text.set_value
        target:
          entity_id: input_text.star_battle_tvs
        data:
          value: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for tv in tvs -%}
              {%- set on = states(tv.atv) not in ['off', 'standby', 'unavailable', 'unknown'] -%}
              {%- set ns.out = ns.out + [[1 if on else 0, (state_attr(tv.atv, 'app_id') or '') if on else '']] -%}
            {%- endfor -%}
            {{ ns.out | to_json }}
      - action: input_text.set_value
        target:
          entity_id: input_text.star_battle_volumes
        data:
          value: >-
            {%- set ns = namespace(d={}) -%}
            {%- for e in (echos | map(attribute='entity') | list) + (tablets | map(attribute='player') | list) -%}
              {%- set v = state_attr(e, 'volume_level') -%}
              {%- if v is number -%}{%- set ns.d = dict(ns.d, **{e: v | round(2)}) -%}{%- endif -%}
            {%- endfor -%}
            {{ ns.d | to_json }}

      # 2. One absolute clock
      - variables:
          t0: "{{ now().timestamp() + pre_roll }}"
          music_id: >-
            {%- set u = spotify_uri | string | trim -%}
            {%- if 'open.spotify.com/track/' in u -%}spotify:track:{{ u.split('/track/')[1].split('?')[0] }}
            {%- else -%}{{ u }}{%- endif -%}

      # 3. Pre-roll: speakers, music, TVs, tablets, Echos
      - action: media_player.unjoin
        target:
          entity_id: ["{{ sonos_music }}", "{{ sonos_effects }}"]
        continue_on_error: true
      - action: media_player.volume_set
        target:
          entity_id: "{{ sonos_effects }}"
        data:
          volume_level: "{{ (effects_volume | float / 100) | round(2) }}"
        continue_on_error: true
      - if:
          - "{{ music_id | length > 0 }}"
        then:
          - action: media_player.volume_set
            target:
              entity_id: "{{ sonos_music }}"
            data:
              volume_level: "{{ (music_volume | float / 100) | round(2) }}"
            continue_on_error: true
          - action: media_player.play_media
            target:
              entity_id: "{{ sonos_music }}"
            data:
              media_content_id: "{{ music_id }}"
              media_content_type: music
            continue_on_error: true
      - variables:
          tvs_off: "{{ tvs | map(attribute='atv') | select('is_state', 'off') | list }}"
      - if:
          - "{{ tvs_off | count > 0 }}"
        then:
          - action: media_player.turn_on
            target:
              entity_id: "{{ tvs_off }}"
            continue_on_error: true
      - repeat:
          for_each: "{{ tablets }}"
          sequence:
            - action: switch.turn_on
              target:
                entity_id: "switch.{{ repeat.item.prefix }}_screen"
              continue_on_error: true
            - action: switch.turn_off
              target:
                entity_id: "switch.{{ repeat.item.prefix }}_screensaver"
              continue_on_error: true
            - action: number.set_value
              target:
                entity_id: "number.{{ repeat.item.prefix }}_screen_brightness"
              data:
                value: 255
              continue_on_error: true
            - action: media_player.volume_set
              target:
                entity_id: "{{ repeat.item.player }}"
              data:
                volume_level: "{{ (tablet_volume | float / 100) | round(2) }}"
              continue_on_error: true
      - action: media_player.volume_set
        target:
          entity_id: "{{ echos | map(attribute='entity') | list }}"
        data:
          volume_level: "{{ echo_volume }}"
        continue_on_error: true

      # 4. The show: independent tracks on the same t0
      - parallel:
          - sequence:
              - condition: template
                value_template: "{{ music_id | length > 0 and music_seek | float(0) > 0 }}"
              - wait_template: "{{ is_state(sonos_music, 'playing') }}"
                timeout: "00:00:06"
                continue_on_timeout: true
              - action: media_player.media_seek
                target:
                  entity_id: "{{ sonos_music }}"
                data:
                  seek_position: "{{ music_seek }}"
                continue_on_error: true
          # ---- kitchen: main effects (battle + standoff in one file) ----
          - sequence:
              - delay:
                  milliseconds: "{{ [0, ((t0 - audio_lead - now().timestamp()) * 1000) | int] | max }}"
              - action: media_player.play_media
                target:
                  entity_id: "{{ sonos_effects }}"
                data:
                  media_content_id: "{{ base_url }}/battle.mp3?v={{ media_version }}"
                  media_content_type: music
                continue_on_error: true
          # ---- TVs ----
          - sequence:
              - delay:
                  milliseconds: "{{ [0, ((t0 - video_lead - now().timestamp()) * 1000) | int] | max }}"
              - action: media_player.play_media
                target:
                  entity_id: "{{ tvs | map(attribute='cast') | list }}"
                data:
                  media_content_id: "{{ base_url }}/battle.mp4?v={{ media_version }}"
                  media_content_type: video/mp4
                continue_on_error: true
          # ---- tablets: page (clock-synced) + their own side sounds ----
          - sequence:
              - delay:
                  milliseconds: "{{ [0, ((t0 - tablet_lead - now().timestamp()) * 1000) | int] | max }}"
              - repeat:
                  for_each: "{{ tablets }}"
                  sequence:
                    - action: fully_kiosk.load_url
                      target:
                        device_id: "{{ device_id('switch.' ~ repeat.item.prefix ~ '_screen') }}"
                      data:
                        url: "{{ base_url }}/index.html?v={{ media_version }}&t0={{ (t0 * 1000) | int }}"
                      continue_on_error: true
          - sequence:
              - delay:
                  milliseconds: "{{ [0, ((t0 - tablet_audio_lead - now().timestamp()) * 1000) | int] | max }}"
              - action: media_player.play_media
                target:
                  entity_id: "{{ tablets[0].player }}"
                data:
                  media_content_id: "{{ base_url }}/{{ tablets[0].audio }}?v={{ media_version }}"
                  media_content_type: music
                continue_on_error: true
          - sequence:
              - delay:
                  milliseconds: "{{ [0, ((t0 - tablet_audio_lead - now().timestamp()) * 1000) | int] | max }}"
              - action: media_player.play_media
                target:
                  entity_id: "{{ tablets[1].player }}"
                data:
                  media_content_id: "{{ base_url }}/{{ tablets[1].audio }}?v={{ media_version }}"
                  media_content_type: music
                continue_on_error: true
          # ---- Echos: random sci-fi sounds (loose timing) ----
          - repeat:
              for_each: "{{ echo_schedule }}"
              sequence:
                - delay:
                    milliseconds: "{{ [0, ((t0 + repeat.item.t - now().timestamp()) * 1000) | int] | max }}"
                - action: media_player.play_media
                  target:
                    entity_id: "{{ repeat.item.entity }}"
                  data:
                    media_content_id: "{{ echo_sounds | random }}"
                    media_content_type: sound
                  continue_on_error: true
          # ---- light tracks ----
          - sequence:
              - variables:
                  steps: "{{ steps_wiz }}"
              - &star_battle_runner
                repeat:
                  for_each: "{{ steps }}"
                  sequence:
                    - delay:
                        milliseconds: "{{ [0, ((t0 + repeat.item.t - now().timestamp()) * 1000) | int] | max }}"
                    - action: "{{ repeat.item.action | default('light.turn_on') }}"
                      target:
                        entity_id: "{{ repeat.item.entities }}"
                      data: "{{ repeat.item.data | default({}) }}"
                      continue_on_error: true
          - sequence:
              - variables:
                  steps: "{{ steps_white }}"
              - *star_battle_runner
          - sequence:
              - variables:
                  steps: "{{ steps_hue }}"
              - *star_battle_runner
          - sequence:
              - variables:
                  steps: "{{ steps_govee }}"
              - *star_battle_runner

      # 5. Nobody called it → both sides retreat
      - delay:
          milliseconds: "{{ [0, ((t0 + show_end - now().timestamp()) * 1000) | int] | max }}"
      - action: script.turn_on
        target:
          entity_id: script.star_battle_ending
        data:
          variables:
            kind: neutral

  # -------------------------------------------------------------------
  #  ENDING: good / bad / neutral
  # -------------------------------------------------------------------
  star_battle_ending:
    alias: "Star Battle – ending"
    icon: mdi:flag-checkered
    mode: single
    max_exceeded: silent
    fields:
      kind:
        description: "good, bad or neutral"
        example: good
    variables:
