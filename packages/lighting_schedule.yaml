# ═════════════════════════════════════════════════════════════════════════════
#  LIGHTING SCHEDULE                       /config/packages/lighting_schedule.yaml
#  v2.1 · 2026-11-25 · guest mode; the solarium keeps its own fade
# ═════════════════════════════════════════════════════════════════════════════
#
#  WHAT HAPPENS EACH NIGHT
#    Dusk-on       From noon until the evening fade: when a room reads dark and
#                  its lights are off, it comes on at its dusk level. Once per
#                  room per day. "Dark" = the room's own light sensor below its
#                  number, or (no sensor / sensor offline) the outdoor estimate
#                  below its number. After sunset every room still waiting
#                  counts as dark.
#    6:45 pm       Kids' bedtime switches (the Kids Bedtime automation, not here).
#    7:00 pm       Evening fade: every room that's on eases to its night level
#                  over 30 min (Great Room and Foyer & Offices to 15%; Kitchen
#                  and Mudroom to off; the Basement is left alone). The Solarium
#                  fades off at this time every night, whatever else happens.
#    7:30 pm       Bedtime (below), every night, Fri and Sat too.
#    11:00 pm      Final sweep: every light still on — every floor except the
#                  master bedroom and bath — switches off, plus the office fan.
#    Exterior      On at sunset, off at 10:00 pm. Runs on vacation too.
#
#  BEDTIME  (script.bedtime — the Bedtime button, and 7:30 pm by itself)
#    Kids' bedtime switches on · Master Bedtime scene (fan, floor fan, air
#    purifier, master lights off) · bedroom blinds close · Kitchen and Mudroom
#    off · Great Room and Foyer & Offices to 15%. The Solarium, Basement,
#    upstairs hall and upstairs bath are left alone (the Solarium has its own
#    7:00 fade; the rest wait for 11:00 pm).
#    Once a night: if Bedtime already ran (button or Wind Down), the 7:30 pm
#    one skips. The button always runs.
#
#  OTHER BUTTONS
#    Wind Down     the evening fade over 15 min instead of 30, main floor only,
#                  then Bedtime. Pressed while the 7:00 fade is already running,
#                  it lets that fade carry on and brings Bedtime forward.
#    Stop fades    stops every fade (and Wind Down's Bedtime) right now.
#
#  GUESTS  (input_boolean.guests_present — the Guests toggle)
#    Dusk-on as usual, but the main floor doesn't fade at 7:00 and Bedtime
#    doesn't run at 7:30: press Wind Down or Bedtime when the guests leave.
#    The Solarium still fades at 7:00; the 11:00 pm sweep and the outside
#    lights are unchanged. Each morning at 9:00, if guest mode has been on
#    overnight, a phone notification asks whether to turn it off.
#
#  LIGHTS SET BY HAND OR BY A SCENE
#    A room whose lights were changed one by one (Dinner, Cooking, a couple of
#    cans switched on…) has no single level to fade from. When a fade starts,
#    the room is first evened out at its dusk level (or lower, if its brightest
#    light is lower) over 5 seconds, then fades from there. Touching a light
#    while its room is fading stops that room's fade; Bedtime then takes the
#    room to its night level.
#
#  WHEN IT DOESN'T RUN
#    Vacation (input_select.house_mode) — nothing except the exterior lights.
#    Paused (input_boolean.lighting_schedule_paused) — dusk-on, the evening
#    fade, the 7:30 pm Bedtime and the 11:00 pm sweep skip. The buttons and the
#    exterior lights still work.
#
#  WHERE TO LOOK
#    Lighting page (tablet and phone) — every room: level, reading vs. its
#      number, what's next, and the last thing the schedule did. The Tonight
#      card's text comes from sensor.lighting_schedule (attribute `tonight`).
#    input_text.lighting_<room> / lighting_house — that last action, one line
#      each. Every change shows in the Logbook, so the Logbook reads as a diary.
#    input_datetime.lighting_bedtime_ran — when Bedtime last ran.
#    sensor.lighting_schedule — the same status the page shows.
#    Settings → Automations / Scripts → "Lighting – …", Bedtime, Wind Down →
#      Traces — step by step.
#
#  EDITING
#    Change numbers and times in SETTINGS below, then Developer tools → YAML →
#    "All YAML configuration". Nothing else in this file needs to change.
# ═════════════════════════════════════════════════════════════════════════════

template:
  # ═══ SETTINGS ═══════════════════════════════════════════════════════════════
  # Defined once here (&lighting) and reused by every automation and script
  # below (*lighting).
  - variables: &lighting
      rooms:
        # light         the room light (Lightener) the schedule controls
        # floor         the floor it's on
        # sensor        the room's own light sensor, if it has one
        # dark_below    lux on that sensor that counts as dark (lights off)
        # outdoor_below outdoor estimate (sensor.illuminance) that counts as
        #               dark — for rooms without a sensor, or if it's offline
        # dusk_level    % the room comes on at
        # ramp          seconds to ramp up from 1% (0 = straight to the level)
        # night         % the room ends the evening at: 0 = off, null = left
        #               alone (the 11:00 pm sweep switches it off)
        # own_fade      true = the room fades at the evening fade every night on
        #               its own: Wind Down and Bedtime leave it alone, and it
        #               still fades on guest nights
        # fade_step_ms  shortest gap between fade steps (Govee rooms go slow)
        #
        # dark_below / outdoor_below are starting values (2026-11-19): tune
        # them from the readings on the Lighting page after a few days.
        kitchen:
          name: Kitchen
          icon: mdi:food-fork-drink
          light: light.kitchen
          floor: Main Floor
          sensor: sensor.hue_motion_sensor_1_illuminance
          dark_below: 15
          outdoor_below: 10000
          dusk_level: 45
          ramp: 300
          night: 0
        great_room:
          name: Great Room
          icon: mdi:sofa
          light: light.great_room
          floor: Main Floor
          sensor: sensor.hue_motion_sensor_3_illuminance
          dark_below: 40
          outdoor_below: 10000
          dusk_level: 45
          ramp: 300
          night: 15
        mudroom:
          name: Mudroom
          icon: mdi:washing-machine
          light: light.mudroom
          floor: Main Floor
          outdoor_below: 10000
          dusk_level: 45
          ramp: 300
          night: 0
        offices:
          name: Foyer & Offices
          icon: mdi:chandelier
          light: light.offices
          floor: Main Floor
          outdoor_below: 10000
          dusk_level: 45
          ramp: 300
          night: 15
        solarium:
          name: Solarium
          icon: mdi:palm-tree
          light: light.solarium
          floor: Basement Level
          sensor: sensor.hue_motion_sensor_2_illuminance
          dark_below: 250
          outdoor_below: 10000
          dusk_level: 70
          ramp: 0
          night: 0
          own_fade: true
          fade_step_ms: 60000
        basement:
          name: Basement
          icon: mdi:hammer-screwdriver
          light: light.basement
          floor: Basement Level
          outdoor_below: 10000          # no windows: follows the outdoor estimate
          dusk_level: 45
          ramp: 300
          night: null                   # left alone — off at the 11:00 pm sweep
      house:
        outdoor_sensor: sensor.illuminance
        pause: input_boolean.lighting_schedule_paused
        bedtime_ran: input_datetime.lighting_bedtime_ran
        guests: input_boolean.guests_present   # the Guests toggle (Settings and Lighting pages)
        guest_reminder: "09:00"         # morning check: still on? (phone notification)
        guest_notify:                   # phone(s) for that check — Developer tools → Actions → "mobile_app"
          - notify.mobile_app_andrews_phone
        dusk_from: "12:00"              # dusk-on never starts before this
        bedtime: "19:30"                # Bedtime runs by itself at this time
        evening_fade_minutes: 30        # the evening fade starts this long before bedtime
        wind_down_minutes: 15           # the Wind Down button's fade, then Bedtime
        sweep: "23:00"                  # final sweep: everything still on switches off
        fade_step_seconds: 15           # a fade step every this many seconds per room
        bedtime_switches:               # turned on by Bedtime
          - switch.charlotte_bedtime
          - switch.henry_bedtime
        bedtime_scenes:                 # turned on by Bedtime
          - scene.master_bedtime
          - scene.close_blinds_bedroom
        floors: [Basement Level, Main Floor, Upstairs]
        skip_areas: [master_bedroom, master_bathroom_bathroom]
        keep_on:                        # never switched off by the schedule
          - light.great_room_diffuser_nightlight
          - light.front_foyer_diffuser_nightlight
        sweep_extras:                   # non-lights the final sweep turns off
          - switch.office_fan
        exterior_lights:
          - light.exterior_alcove
          - light.exterior_front_door
          - light.exterior_lower_garage
          - light.exterior_upper_garage
        exterior_off: "22:00"
  # ═══ END OF SETTINGS ════════════════════════════════════════════════════════
  # "Tonight" runs from 4:00 am to 4:00 am. Bedtime has "run tonight" when
  # input_datetime.lighting_bedtime_ran is later than the last 4:00 am.

    sensor:
      # Live status for the Lighting page. Read-only: it never changes a light.
      # State: Daytime / Watching for dark / Evening fade / Wind Down / Guests /
      # Bedtime / Lights out / Paused / Vacation.
      # Attributes: rooms (per-room status), dusk_due (rooms the Dusk-on
      # automation should turn on right now), outdoor (lux), last (house line),
      # times (the house times, formatted for the page), tonight (the Tonight
      # card's text).
      - name: Lighting schedule
        unique_id: lighting_schedule
        icon: mdi:lightbulb-auto-outline
        state: >-
          {%- set t = now().strftime('%H:%M') %}
          {%- set fade_start = (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') %}
          {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
          {%- if is_state('input_select.house_mode', 'Vacation') %}Vacation
          {%- elif is_state(house.pause, 'on') %}Paused
          {%- elif t >= house.sweep or t < '04:00' %}Lights out
          {%- elif is_state('script.lighting_wind_down', 'on') %}Wind Down
          {%- elif ran %}Bedtime
          {%- elif is_state(house.guests, 'on') %}Guests
          {%- elif t >= house.bedtime %}Bedtime
          {%- elif t >= fade_start %}Evening fade
          {%- elif t >= house.dusk_from %}Watching for dark
          {%- else %}Daytime{%- endif %}
        attributes:
          outdoor: "{{ states(house.outdoor_sensor) | float(-1) | round(0) | int }}"
          last: >-
            {%- set v = states('input_text.lighting_house') %}
            {%- macro hm(x) %}{{ strptime(x, '%H:%M').strftime('%-I:%M %p') | lower }}{% endmacro %}
            {{ '' if v in ['unknown', 'unavailable', ''] else (hm(v[11:16]) ~ v[16:]) if v.startswith(now().date() | string) else v }}
          times: >-
            {%- macro hm(x) %}{{ strptime(x, '%H:%M').strftime('%-I:%M %p') | lower }}{% endmacro %}
            {%- set ts = state_attr(house.bedtime_ran, 'timestamp') | float(0) %}
            {%- set ran = ts >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
            {%- set fade_start = (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') %}
            {{ {'dusk_from': hm(house.dusk_from), 'fade_start': hm(fade_start),
                'bedtime': hm(house.bedtime), 'sweep': hm(house.sweep),
                'exterior_off': hm(house.exterior_off),
                'evening_fade_minutes': house.evening_fade_minutes,
                'wind_down_minutes': house.wind_down_minutes,
                'bedtime_ran': (ts | timestamp_custom('%-I:%M %p') | lower) if ran else '',
                'guests': is_state(house.guests, 'on'),
                'sweep_extras': house.sweep_extras | map('state_attr', 'friendly_name') | reject('none') | list} }}
          tonight: >-
            {%- macro hm(x) %}{{ strptime(x, '%H:%M').strftime('%-I:%M %p') | lower }}{% endmacro %}
            {%- set ts = state_attr(house.bedtime_ran, 'timestamp') | float(0) %}
            {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
            {%- set guests = is_state(house.guests, 'on') %}
            {%- set fade_start = (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') %}
            {%- set ns = namespace(glow=[], offs=[], own=[]) %}
            {%- for k, r in rooms.items() if r.get('night') is not none %}
              {%- if r.get('own_fade') %}{% set ns.own = ns.own + [r.name | lower] %}
              {%- elif r.night | int > 0 %}{% set ns.glow = ns.glow + [(r.name | lower) ~ ' ' ~ r.night ~ '%'] %}
              {%- else %}{% set ns.offs = ns.offs + [r.name | lower] %}{% endif %}
            {%- endfor %}
            {%- set levels = (ns.glow + ([ns.offs | join(', ') ~ ' off'] if ns.offs else [])) | join(', ') %}
            {%- set extras = house.sweep_extras | map('state_attr', 'friendly_name') | reject('none') | map('lower') | list %}
            {%- set out = states(house.outdoor_sensor) | float(-1) %}
            {%- set v = states('input_text.lighting_house') %}
            {%- set last = '' if v in ['unknown', 'unavailable', ''] else (hm(v[11:16]) ~ v[16:]) if v.startswith(now().date() | string) else v %}
            {%- if guests %}**Guests tonight** · the main floor doesn't fade or go to Bedtime by itself — press Wind Down or Bedtime when they leave<br>{% endif %}
            {%- if guests %}**{{ hm(fade_start) }}** · only the {{ ns.own | join(', ') }} fades (off over {{ house.evening_fade_minutes }} min)
            {%- else %}**{{ hm(fade_start) }}** · evening fade — rooms that are on ease to their night level over {{ house.evening_fade_minutes }} min{% endif %}<br>
            {%- if guests and not ran %}**Bedtime** · when you press it — kids, master bedroom, blinds · {{ levels }}
            {%- else %}**{{ hm(house.bedtime) }}** · Bedtime — kids, master bedroom, blinds · {{ levels }}{{ ' · ran at ' ~ (ts | timestamp_custom('%-I:%M %p') | lower) ~ ' tonight' if ran }}{% endif %}<br>
            **{{ hm(house.sweep) }}** · final sweep — everything still on switches off, every floor except the master bedroom and bath{{ ', plus the ' ~ extras | join(', ') if extras }}<br>
            **Wind Down** · the same fade over {{ house.wind_down_minutes }} min for the main floor, then Bedtime · **Bedtime** · right now<br>
            Dusk-on starts watching at {{ hm(house.dusk_from) }} · outdoor now {{ '{:,}'.format(out | round(0) | int) if out >= 0 else '—' }} lx<br>
            Last: {{ last or 'nothing yet today' }}
          dusk_due: >-
            {%- set t = now().strftime('%H:%M') %}
            {%- set today = now().date() | string %}
            {%- set fade_start = (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') %}
            {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
            {%- set out = states(house.outdoor_sensor) | float(-1) %}
            {%- set held = ran or is_state('input_select.house_mode', 'Vacation') or is_state(house.pause, 'on')
                           or is_state('script.lighting_wind_down', 'on') %}
            {%- set ns = namespace(due=[]) %}
            {%- for k, r in rooms.items() if not held %}
              {%- set lux = states(r.sensor) | float(-1) if r.get('sensor') else -1 %}
              {%- set dark = (lux >= 0 and lux < r.dark_below)
                             or (lux < 0 and out >= 0 and out < r.outdoor_below)
                             or is_state('sun.sun', 'below_horizon') %}
              {%- if house.dusk_from <= t < fade_start and is_state(r.light, 'off') and dark
                     and not states('input_text.lighting_' ~ k).startswith(today) %}
                {%- set ns.due = ns.due + [k] %}
              {%- endif %}
            {%- endfor %}
            {{ ns.due }}
          rooms: >-
            {%- macro hm(x) %}{{ strptime(x, '%H:%M').strftime('%-I:%M %p') | lower }}{% endmacro %}
            {%- set t = now().strftime('%H:%M') %}
            {%- set today = now().date() | string %}
            {%- set fade_start = (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') %}
            {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
            {%- set wd = is_state('script.lighting_wind_down', 'on') %}
            {%- set wd_end = ((state_attr('script.lighting_wind_down', 'last_triggered') or now()) | as_local
                              + timedelta(minutes=house.wind_down_minutes | int)).strftime('%-I:%M %p') | lower %}
            {%- set out = states(house.outdoor_sensor) | float(-1) %}
            {%- set vacation = is_state('input_select.house_mode', 'Vacation') %}
            {%- set paused = is_state(house.pause, 'on') %}
            {%- set night_time = t >= house.sweep or t < '04:00' %}
            {%- set guests = is_state(house.guests, 'on') %}
            {%- set ns = namespace(rooms={}) %}
            {%- for k, r in rooms.items() %}
              {%- set on = is_state(r.light, 'on') %}
              {%- set b = state_attr(r.light, 'brightness') %}
              {%- set level = (b | int(0) / 2.55) | round(0) | int if on and b is not none else none %}
              {%- set lvl = (level ~ '%') if level is not none else 'custom' %}
              {%- set nl = r.get('night') %}
              {%- set nl_text = 'left on' if nl is none else (nl ~ '%') if nl | int > 0 else 'off' %}
              {%- set own = r.get('own_fade', false) %}
              {%- set hold = guests and not ran and not own %}
              {%- set last = states('input_text.lighting_' ~ k) %}
              {%- set lux = states(r.sensor) | float(-1) if r.get('sensor') else -1 %}
              {%- set src = 'room' if lux >= 0 else 'outdoor' %}
              {%- set reading = (lux if lux >= 0 else out) | round(0) | int %}
              {%- set limit = r.dark_below if lux >= 0 else r.outdoor_below %}
              {%- set dark = (reading >= 0 and reading < limit) or is_state('sun.sun', 'below_horizon') %}
              {%- if vacation %}{% set stage, nxt = 'Vacation', 'Lights stay off' %}
              {%- elif paused %}{% set stage, nxt = 'Paused', 'Schedule paused' %}
              {%- elif night_time %}
                {%- set stage = 'On after the ' ~ hm(house.sweep) ~ ' sweep' if on else 'Off for the night' %}
                {%- set nxt = 'watching for dark from ' ~ hm(house.dusk_from) %}
              {%- elif wd and not own %}
                {%- set stage = ('Wind Down · ' ~ lvl) if on else 'Off' %}
                {%- set nxt = ('Bedtime at ' ~ wd_end) if not on else ('stays on, off at ' ~ hm(house.sweep)) if nl is none
                              else (nl_text ~ ' by ' ~ wd_end ~ ', then Bedtime') if nl | int > 0 else 'off by ' ~ wd_end %}
              {%- elif (ran and not own) or (t >= house.bedtime and not hold) %}
                {%- set stage = ('Night · ' ~ lvl) if on else 'Off for the night' %}
                {%- set nxt = ('off at ' ~ hm(house.sweep)) if on else 'stays off tonight' %}
              {%- elif hold and t >= fade_start %}
                {%- set stage = ('Guests · ' ~ lvl) if on else 'Off' %}
                {%- set nxt = '' if not on else ('stays on, off at ' ~ hm(house.sweep)) if nl is none
                              else 'guests tonight — stays on until Bedtime' %}
              {%- elif t >= fade_start %}
                {%- set stage = ('Evening fade · ' ~ lvl) if on else 'Off' %}
                {%- set nxt = '' if not on else ('stays on, off at ' ~ hm(house.sweep)) if nl is none
                              else (nl_text ~ ' by ' ~ hm(house.bedtime)) if nl | int > 0 else 'off by ' ~ hm(house.bedtime) %}
              {%- elif t < house.dusk_from %}
                {%- set stage = ('On · ' ~ lvl) if on else 'Daytime' %}
                {%- set nxt = 'watching for dark from ' ~ hm(house.dusk_from) %}
              {%- elif on %}
                {%- set stage = 'On · ' ~ lvl %}
                {%- set nxt = ('stays on until ' ~ hm(house.sweep)) if nl is none
                              else 'guests tonight — stays on until Bedtime' if hold
                              else ('fades to ' ~ nl_text ~ ' from ' ~ hm(fade_start)) if nl | int > 0
                              else 'fades off from ' ~ hm(fade_start) %}
              {%- elif last.startswith(today) %}
                {%- set stage, nxt = 'Off', 'done for today — stays off' %}
              {%- else %}
                {%- set stage = 'Waiting for dark' %}
                {%- set nxt = 'comes on at ' ~ r.dusk_level ~ '% when it gets dark' %}
              {%- endif %}
              {%- set ns.rooms = dict(ns.rooms, **{k: {
                  'name': r.name, 'icon': r.icon, 'light': r.light, 'on': on, 'level': level,
                  'source': src, 'reading': reading, 'limit': limit, 'dark': dark,
                  'stage': stage, 'next': nxt,
                  'dusk': r.dusk_level ~ '%',
                  'night': nl_text,
                  'own_fade': own,
                  'evening': '' if nl is none else hm(fade_start) ~ ' → ' ~ nl_text,
                  'last': '' if last in ['unknown', 'unavailable', ''] else
                          (hm(last[11:16]) ~ last[16:]) if last.startswith(today) else last}}) %}
            {%- endfor %}
            {{ ns.rooms }}

input_boolean:
  lighting_schedule_paused:
    name: Lighting schedule paused
    icon: mdi:pause-circle-outline

# When Bedtime last ran (button, Wind Down or 7:30 pm). The 7:30 pm Bedtime,
# the evening fade and dusk-on all skip once it has run tonight.
input_datetime:
  lighting_bedtime_ran:
    name: Bedtime last ran
    has_date: true
    has_time: true
    icon: mdi:bed-clock

# One line per room: the last thing the schedule did there. Written by the
# automations and scripts below; every change shows in the Logbook.
input_text:
  lighting_kitchen:
    name: Lighting – Kitchen
    max: 255
    icon: mdi:history
  lighting_great_room:
    name: Lighting – Great Room
    max: 255
    icon: mdi:history
  lighting_mudroom:
    name: Lighting – Mudroom
    max: 255
    icon: mdi:history
  lighting_offices:
    name: Lighting – Foyer & Offices
    max: 255
    icon: mdi:history
  lighting_solarium:
    name: Lighting – Solarium
    max: 255
    icon: mdi:history
  lighting_basement:
    name: Lighting – Basement
    max: 255
    icon: mdi:history
  lighting_house:
    name: Lighting – House
    max: 255
    icon: mdi:history

automation:
  # ── Dusk-on ──────────────────────────────────────────────────────────────────
  # sensor.lighting_schedule works out which rooms are due (dark, off, between
  # dusk_from and the evening fade, Bedtime not run, not done today) and lists
  # them in dusk_due. This turns them on. It re-checks each room just before
  # acting.
  - id: lighting_dusk_on
    alias: Lighting – Dusk-on
    description: Turns rooms on at their dusk level when they read dark. See packages/lighting_schedule.yaml.
    mode: queued
    max: 10
    max_exceeded: silent
    variables: *lighting
    triggers:
      - trigger: state
        entity_id: sensor.lighting_schedule
        attribute: dusk_due
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        value_template: "{{ state_attr('sensor.lighting_schedule', 'dusk_due') | default([], true) | count > 0 }}"
    actions:
      - repeat:
          for_each: "{{ state_attr('sensor.lighting_schedule', 'dusk_due') }}"
          sequence:
            - variables:
                key: "{{ repeat.item }}"
                r: "{{ rooms[repeat.item] }}"
                s: "{{ state_attr('sensor.lighting_schedule', 'rooms')[repeat.item] }}"
            - if:
                - condition: template
                  value_template: "{{ is_state(r.light, 'off') }}"
              then:
                # The line goes first, so "Turned on by hand" (below) sees
                # dusk-on as done and stays quiet.
                - action: input_text.set_value
                  target:
                    entity_id: "input_text.lighting_{{ key }}"
                  data:
                    value: >-
                      {{ now().strftime('%Y-%m-%d %H:%M') }} · Came on at {{ r.dusk_level }}% ·
                      {% if s.reading >= 0 and s.reading < s.limit -%}
                        {%- if s.source == 'outdoor' %}dark enough outside ({{ '{:,}'.format(s.reading) }} lux, comes on below {{ '{:,}'.format(s.limit) }})
                        {%- else %}dark enough in the room ({{ s.reading }} lux, comes on below {{ s.limit }}){% endif %}
                      {%- else %}the sun has set{% endif %}
                - if:
                    - condition: template
                      value_template: "{{ r.ramp | int(0) > 0 }}"
                  then:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ r.light }}"
                      data:
                        brightness_pct: 1
                    - delay:
                        seconds: 2
                    - action: light.turn_on
                      target:
                        entity_id: "{{ r.light }}"
                      data:
                        brightness_pct: "{{ r.dusk_level }}"
                        transition: "{{ r.ramp }}"
                  else:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ r.light }}"
                      data:
                        brightness_pct: "{{ r.dusk_level }}"

  # ── Turned on by hand ────────────────────────────────────────────────────────
  # If someone (or a scene, or Alexa) turns a room on during the dusk window,
  # before dusk-on has run, that counts as today's dusk-on. Otherwise turning
  # the room off again later would just have dusk-on switch it back on.
  - id: lighting_room_turned_on
    alias: Lighting – Turned on by hand
    description: Counts a room turned on by hand during the dusk window as today's dusk-on. See packages/lighting_schedule.yaml.
    mode: queued
    max: 10
    variables: *lighting
    triggers:
      - trigger: state
        entity_id:                      # the room lights in SETTINGS
          - light.kitchen
          - light.great_room
          - light.mudroom
          - light.offices
          - light.solarium
          - light.basement
        from: "off"
        to: "on"
    conditions:
      - condition: template
        value_template: >-
          {%- set key = (rooms.items() | selectattr('1.light', 'eq', trigger.entity_id) | map(attribute='0') | list + [''])[0] %}
          {%- set t = now().strftime('%H:%M') %}
          {%- set fade_start = (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') %}
          {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
          {{ key != '' and house.dusk_from <= t < fade_start and not ran
             and not states('input_text.lighting_' ~ key).startswith(now().date() | string) }}
    actions:
      - action: input_text.set_value
        target:
          entity_id: >-
            input_text.lighting_{{ (rooms.items() | selectattr('1.light', 'eq', trigger.entity_id) | map(attribute='0') | list)[0] }}
        data:
          value: "{{ now().strftime('%Y-%m-%d %H:%M') }} · Turned on outside the schedule (by hand, a scene or Alexa) · it won't switch this room on again today"

  # ── Evening fade ─────────────────────────────────────────────────────────────
  # evening_fade_minutes before bedtime (7:00 pm): every room that's on eases
  # to its night level, finishing at bedtime (script.lighting_fade_rooms).
  # own_fade rooms (Solarium) always fade here. The rest are left alone on
  # guest nights, if Bedtime already ran tonight, or while Wind Down runs.
  # (id kept from v1 "Evening dim", so the entity stays automation.lighting_evening_dim)
  - id: lighting_evening_dim
    alias: Lighting – Evening fade
    description: At 7:00 pm every room that's on eases to its night level by Bedtime at 7:30 pm (on guest nights, after an early Bedtime or during Wind Down, only the Solarium). See packages/lighting_schedule.yaml.
    mode: single
    trigger_variables: *lighting
    triggers:
      - trigger: template
        value_template: >-
          {{ now().strftime('%H:%M') == (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') }}
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Vacation
      - condition: template
        value_template: >-
          {{ is_state(house.pause, 'off') }}
    actions:
      - variables:
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          held: >-
            {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
            {{ 'guests tonight' if is_state(house.guests, 'on') else 'Bedtime already ran' if ran
               else 'Wind Down is running' if is_state('script.lighting_wind_down', 'on') else '' }}
          keys: >-
            {%- set ns = namespace(k=[]) %}
            {%- for k, r in rooms.items() if r.get('night') is not none and is_state(r.light, 'on')
                  and (held == '' or r.get('own_fade', false)) %}
              {%- set ns.k = ns.k + [k] %}
            {%- endfor %}
            {{ ns.k }}
      - action: input_text.set_value
        target:
          entity_id: input_text.lighting_house
        data:
          value: >-
            {%- set ns = namespace(n=[]) %}{% for k in keys %}{% set ns.n = ns.n + [rooms[k].name] %}{% endfor %}{% set names = ns.n %}
            {%- set by = today_at(house.bedtime).strftime('%-I:%M %p') | lower %}
            {{ stamp }} · Evening fade · {{ ('main floor left as it is (' ~ held ~ ') · ') if held }}{{ (names | join(', ') ~ (' easing to their night levels by ' if names | count > 1 else ' easing to its night level by ') ~ by) if names else 'nothing else to fade' if held else 'nothing was on' }}
      - if:
          - condition: template
            value_template: "{{ keys | count > 0 }}"
        then:
          - action: script.lighting_fade_rooms
            data:
              room_keys: "{{ keys }}"
              minutes: "{{ house.evening_fade_minutes }}"
              label: Evening fade

  # ── Bedtime at 7:30 pm ───────────────────────────────────────────────────────
  # Runs script.bedtime every night at bedtime, unless it already ran tonight.
  # On guest nights it only writes a line saying it waited.
  - id: lighting_bedtime
    alias: Lighting – Bedtime
    description: Runs Bedtime at 7:30 pm every night, unless it already ran tonight or guests are over. See packages/lighting_schedule.yaml.
    mode: single
    trigger_variables: *lighting
    triggers:
      - trigger: template
        value_template: "{{ now().strftime('%H:%M') == house.bedtime }}"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Vacation
      - condition: template
        value_template: >-
          {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
          {{ is_state(house.pause, 'off') and not ran }}
    actions:
      - if:
          - condition: template
            value_template: "{{ is_state(house.guests, 'on') }}"
        then:
          - action: input_text.set_value
            target:
              entity_id: input_text.lighting_house
            data:
              value: "{{ now().strftime('%Y-%m-%d %H:%M') }} · Bedtime waited · guests tonight — press Wind Down or Bedtime when they leave"
        else:
          - action: script.turn_on
            target:
              entity_id: script.bedtime
            data:
              variables:
                source: scheduled

  # ── Final sweep at 11:00 pm ──────────────────────────────────────────────────
  # Every light that's on, on the floors in settings, except the skipped areas
  # (master bedroom and bath), the keep_on list, groups and Govee segments.
  # Plus sweep_extras (office fan).
  # (id kept from v1 "Lights out", so the entity stays automation.lighting_lights_out)
  - id: lighting_night_off
    alias: Lighting – Final sweep
    description: Switches off every light still on (except master bed/bath) and the office fan at 11:00 pm. See packages/lighting_schedule.yaml.
    mode: single
    trigger_variables: *lighting
    triggers:
      - trigger: template
        value_template: "{{ now().strftime('%H:%M') == house.sweep }}"
    conditions:
      - condition: not
        conditions:
          - condition: state
            entity_id: input_select.house_mode
            state: Vacation
      - condition: template
        value_template: "{{ is_state(house.pause, 'off') }}"
    actions:
      - variables:
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          lights: >-
            {%- set ns = namespace(l=[]) %}
            {%- for f in house.floors %}
              {%- for a in floor_areas(f) if a not in house.skip_areas %}
                {%- for e in area_entities(a) | select('match', 'light[.]') %}
                  {%- if is_state(e, 'on') and e not in house.keep_on
                        and state_attr(e, 'entity_id') is none
                        and state_attr(e, 'is_hue_group') is none
                        and not e is search('_segment_[0-9]+$') %}
                    {%- set ns.l = ns.l + [e] %}
                  {%- endif %}
                {%- endfor %}
              {%- endfor %}
            {%- endfor %}
            {{ ns.l | unique | list }}
          extras: "{{ house.sweep_extras | select('is_state', 'on') | list }}"
          rooms_on: >-
            {{ rooms.items() | selectattr('1.light', 'is_state', 'on') | map(attribute='0') | list }}
      - action: script.turn_off
        target:
          entity_id:
            - script.lighting_wind_down
            - script.lighting_fade_rooms
            - script.light_fader
      - if:
          - condition: template
            value_template: "{{ lights | count > 0 }}"
        then:
          - action: light.turn_off
            target:
              entity_id: "{{ lights }}"
      - if:
          - condition: template
            value_template: "{{ extras | count > 0 }}"
        then:
          - action: homeassistant.turn_off
            target:
              entity_id: "{{ extras }}"
      - repeat:
          for_each: "{{ rooms_on }}"
          sequence:
            - action: input_text.set_value
              target:
                entity_id: "input_text.lighting_{{ repeat.item }}"
              data:
                value: "{{ stamp }} · Final sweep · switched off"
      - action: input_text.set_value
        target:
          entity_id: input_text.lighting_house
        data:
          value: >-
            {%- set parts = ([(lights | count) ~ ' light' ~ ('s' if lights | count != 1 else '')] if lights | count else [])
                            + (extras | map('state_attr', 'friendly_name') | map('lower') | map('regex_replace', '^', 'the ') | list) %}
            {{ stamp }} · Final sweep · {{ 'switched off ' ~ parts | join(' and ') if parts else 'nothing was on' }}

  # ── Guest mode ───────────────────────────────────────────────────────────────
  # A line in the house log when the Guests toggle changes; each morning at
  # guest_reminder, if guest mode has been on for 8+ hours, a phone
  # notification with "Turn off" / "Keep on"; "Turn off" switches it off.
  # (The toggle's own automation, "House Mode - Update Guest MQTT Tracker",
  # keeps the house in Home while guests are over.)
  - id: lighting_guests
    alias: Lighting – Guest mode
    description: Logs the Guests toggle, and each morning asks whether guest mode should still be on. See packages/lighting_schedule.yaml.
    mode: queued
    trigger_variables: *lighting
    triggers:
      - trigger: state
        entity_id: input_boolean.guests_present   # house.guests in SETTINGS
        to:
          - "on"
          - "off"
        id: toggled
      - trigger: template
        value_template: "{{ now().strftime('%H:%M') == house.guest_reminder }}"
        id: morning
      - trigger: event
        event_type: mobile_app_notification_action
        event_data:
          action: LIGHTING_GUESTS_OFF
        id: answer
    actions:
      - variables:
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          since: "{{ (expand(house.guests) | first).last_changed | as_local }}"
      - choose:
          - conditions:
              - condition: trigger
                id: toggled
            sequence:
              - action: input_text.set_value
                target:
                  entity_id: input_text.lighting_house
                data:
                  value: >-
                    {{ stamp }} · Guests {{ 'on · the main floor waits for Wind Down or Bedtime tonight' if trigger.to_state.state == 'on'
                       else 'off · back to the normal evening' }}
          - conditions:
              - condition: trigger
                id: morning
              - condition: template
                value_template: "{{ is_state(house.guests, 'on') and now() - (since | as_datetime) > timedelta(hours=8) }}"
            sequence:
              - repeat:
                  for_each: "{{ house.guest_notify }}"
                  sequence:
                    - action: "{{ repeat.item }}"
                      data:
                        title: Guest mode is still on
                        message: >-
                          On since {{ (since | as_datetime).strftime('%A') }} {{ (since | as_datetime).strftime('%-I:%M %p') | lower }}. While it's on, the main floor
                          doesn't fade at 7:00 or go to Bedtime at 7:30 by itself.
                        data:
                          tag: lighting-guest-mode
                          actions:
                            - action: LIGHTING_GUESTS_OFF
                              title: Turn off
                            - action: LIGHTING_GUESTS_KEEP
                              title: Keep on
          - conditions:
              - condition: trigger
                id: answer
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: "{{ house.guests }}"

  # ── Exterior ─────────────────────────────────────────────────────────────────
  # On at sunset, off at exterior_off. Runs on vacation and when paused.
  - id: lighting_exterior
    alias: Lighting – Exterior
    description: Exterior lights on at sunset and off at 10:00 pm, every night. See packages/lighting_schedule.yaml.
    mode: single
    trigger_variables: *lighting
    triggers:
      - trigger: sun
        event: sunset
        id: "on"
      - trigger: template
        value_template: "{{ now().strftime('%H:%M') == house.exterior_off }}"
        id: "off"
    actions:
      - action: "light.turn_{{ trigger.id }}"
        target:
          entity_id: "{{ house.exterior_lights }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.lighting_house
        data:
          value: "{{ now().strftime('%Y-%m-%d %H:%M') }} · Outside lights {{ 'on at sunset' if trigger.id == 'on' else 'off' }}"

script:
  # ── Bedtime ──────────────────────────────────────────────────────────────────
  # The Bedtime button, Wind Down's last step, and 7:30 pm by itself.
  # Kids' switches, master bedroom scene and blinds, and every room above its
  # night level goes to it (kitchen and mudroom off, great room and foyer &
  # offices 15%). own_fade rooms (Solarium) are left to their own 7:00 fade.
  # Running fades aren't stopped: a room fading toward its night level stops
  # by itself once Bedtime sets it (Ashley's fader cancels when the light no
  # longer matches), and the Solarium's fade carries on.
  bedtime:
    alias: Bedtime
    description: Kids' bedtime switches, master bedroom and bedroom blinds; kitchen and mudroom off, Great Room and Foyer & Offices to 15%. Runs by itself at 7:30 pm (not on guest nights).
    icon: mdi:bed
    mode: single
    max_exceeded: silent
    fields:
      source:
        description: Who started it, for the log line (button, scheduled, after Wind Down)
        example: button
    variables: *lighting
    sequence:
      - action: input_datetime.set_datetime
        target:
          entity_id: "{{ house.bedtime_ran }}"
        data:
          timestamp: "{{ now().timestamp() }}"
      - action: script.turn_off
        target:
          entity_id: >-
            {{ ['script.lighting_fade_rooms']
               + ([] if source | default('') == 'after Wind Down' else ['script.lighting_wind_down']) }}
      - variables:
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          plan: >-
            {%- set ns = namespace(p=[]) %}
            {%- for k, r in rooms.items() if r.get('night') is not none and not r.get('own_fade', false) and is_state(r.light, 'on') %}
              {%- set b = state_attr(r.light, 'brightness') %}
              {%- set lvl = (b | int / 2.55) | round(0) | int if b is not none else none %}
              {%- if r.night | int == 0 or lvl is none or lvl > r.night | int + 1 %}
                {%- set ns.p = ns.p + [{'key': k, 'do': 'off' if r.night | int == 0 else 'night'}] %}
              {%- endif %}
            {%- endfor %}
            {{ ns.p }}
      - action: switch.turn_on
        target:
          entity_id: "{{ house.bedtime_switches }}"
      - action: scene.turn_on
        target:
          entity_id: "{{ house.bedtime_scenes }}"
      - repeat:
          for_each: "{{ plan }}"
          sequence:
            - variables:
                r: "{{ rooms[repeat.item.key] }}"
            - if:
                - condition: template
                  value_template: "{{ repeat.item.do == 'off' }}"
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ r.light }}"
                  data:
                    transition: 2
              else:
                - action: light.turn_on
                  target:
                    entity_id: "{{ r.light }}"
                  data:
                    brightness_pct: "{{ r.night }}"
                    transition: 2
            - action: input_text.set_value
              target:
                entity_id: "input_text.lighting_{{ repeat.item.key }}"
              data:
                value: "{{ stamp }} · Bedtime · {{ 'switched off' if repeat.item.do == 'off' else 'down to ' ~ r.night ~ '% for the night' }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.lighting_house
        data:
          value: >-
            {%- set ns = namespace(p=[]) %}
            {%- for i in plan %}
              {%- set r = rooms[i.key] %}
              {%- set ns.p = ns.p + [r.name ~ (' off' if i.do == 'off' else ' to ' ~ r.night ~ '%')] %}
            {%- endfor %}
            {{ (stamp ~ ' · Bedtime (' ~ (source | default('button', true)) ~ ') · kids, master bedroom and blinds set for the night · '
               ~ (ns.p | join(', ') if ns.p else 'no other rooms needed changing'))[:255] }}

  # ── Wind Down ────────────────────────────────────────────────────────────────
  # The evening fade, but over wind_down_minutes and without own_fade rooms
  # (Solarium), then Bedtime. If the 7:00 fade is already running (not a guest
  # night), it carries on and Bedtime comes at the end of Wind Down or at
  # bedtime, whichever is sooner. If Bedtime is run while it's fading, Wind
  # Down stops there.
  lighting_wind_down:
    alias: Wind Down
    description: Every main-floor room that's on eases to its night level over 15 minutes, then Bedtime. The Solarium keeps its own 7:00 fade.
    icon: mdi:weather-night
    mode: single
    max_exceeded: silent
    variables: *lighting
    sequence:
      - variables:
          started: "{{ now().timestamp() }}"
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          # the 7:00 evening fade is already fading the main floor
          in_fade: >-
            {%- set t = now().strftime('%H:%M') %}
            {%- set ran = state_attr(house.bedtime_ran, 'timestamp') | float(0) >= (today_at('04:00') - timedelta(days=1 if now() < today_at('04:00') else 0)).timestamp() %}
            {{ (today_at(house.bedtime) - timedelta(minutes=house.evening_fade_minutes | int)).strftime('%H:%M') <= t < house.bedtime and not ran
               and is_state(house.guests, 'off') and is_state(house.pause, 'off') }}
          wait: >-
            {%- set left = ((today_at(house.bedtime) - now()).total_seconds() / 60) | round(1) %}
            {{ [house.wind_down_minutes | float, left] | min if in_fade else house.wind_down_minutes | float }}
          ends: "{{ (now() + timedelta(minutes=wait | float)).strftime('%-I:%M %p') | lower }}"
          keys: >-
            {%- set ns = namespace(k=[]) %}
            {%- for k, r in rooms.items() if r.get('night') is not none and not r.get('own_fade', false)
                  and is_state(r.light, 'on') and not in_fade %}
              {%- set ns.k = ns.k + [k] %}
            {%- endfor %}
            {{ ns.k }}
      - action: input_text.set_value
        target:
          entity_id: input_text.lighting_house
        data:
          value: >-
            {%- set ns = namespace(n=[]) %}{% for k in keys %}{% set ns.n = ns.n + [rooms[k].name] %}{% endfor %}{% set names = ns.n %}
            {{ stamp }} · Wind Down · {{ 'the evening fade is already running, ' if in_fade else (names | join(', ') ~ ' easing to their night levels, ') if names }}Bedtime at {{ ends }}
      - if:
          - condition: template
            value_template: "{{ keys | count > 0 }}"
        then:
          - action: script.lighting_fade_rooms
            data:
              room_keys: "{{ keys }}"
              minutes: "{{ house.wind_down_minutes }}"
              label: Wind Down
      - delay:
          minutes: "{{ wait }}"
      - if:
          - condition: template
            value_template: "{{ state_attr(house.bedtime_ran, 'timestamp') | float(0) < started | float(0) }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.bedtime
            data:
              variables:
                source: after Wind Down

  # ── Fade rooms (used by the evening fade, Wind Down and Bedtime) ─────────────
  # Each room that's on and above its night level fades there over `minutes`
  # with Ashley's fader (script.light_fader, one per room, a step every
  # fade_step_seconds; Hue and Lutron glide between steps). A room whose lights
  # were set one by one (by hand or a scene) is first evened out at
  # min(dusk level, its brightest light) over 5 s so it has a level to fade
  # from. Touching a light in a fading room stops that room's fade.
  lighting_fade_rooms:
    alias: Lighting – Fade rooms
    description: Fades the given rooms to their night level over the given minutes. Used by the evening fade, Wind Down and Bedtime.
    icon: mdi:transition
    mode: parallel
    max: 10
    fields:
      room_keys:
        description: Room keys from SETTINGS
        example: "[great_room, kitchen]"
      minutes:
        description: How long the fade takes
        example: 30
      label:
        description: Name used in the log lines
        example: Evening fade
    variables: *lighting
    sequence:
      - variables:
          stamp: "{{ now().strftime('%Y-%m-%d %H:%M') }}"
          # one entry per room to change: key, start (%), custom (set by hand/scene)
          plan: >-
            {%- set ns = namespace(p=[]) %}
            {%- for k in room_keys if k in rooms and rooms[k].get('night') is not none and is_state(rooms[k].light, 'on') %}
              {%- set r = rooms[k] %}
              {%- set night = r.night | int %}
              {%- set b = state_attr(r.light, 'brightness') %}
              {%- if b is not none %}
                {%- set lvl = (b | int / 2.55) | round(0) | int %}
                {%- if lvl > night + 1 or (night == 0 and lvl > 0) %}
                  {%- set ns.p = ns.p + [{'key': k, 'start': lvl, 'custom': false}] %}
                {%- endif %}
              {%- else %}
                {%- set ms = namespace(top=0) %}
                {%- for m in state_attr(r.light, 'entity_id') | default([], true) if is_state(m, 'on') %}
                  {%- set mb = state_attr(m, 'brightness') %}
                  {%- set ms.top = [ms.top, ((mb | int / 2.55) | round(0) | int) if mb is not none else 100] | max %}
                {%- endfor %}
                {%- set ns.p = ns.p + [{'key': k, 'start': [r.dusk_level | int, ms.top] | min, 'custom': true}] %}
              {%- endif %}
            {%- endfor %}
            {{ ns.p }}
      # Rooms already within 2% of their night level go straight there; the rest fade.
      - variables:
          direct: >-
            {%- set ns = namespace(p=[]) %}
            {%- for i in plan if i.start <= rooms[i.key].night | int + 2 %}{% set ns.p = ns.p + [i] %}{% endfor %}
            {{ ns.p }}
          faded: >-
            {%- set ns = namespace(p=[]) %}
            {%- for i in plan if i.start > rooms[i.key].night | int + 2 %}{% set ns.p = ns.p + [i] %}{% endfor %}
            {{ ns.p }}
      # 1. Rooms within 2% of their night level: straight there.
      - repeat:
          for_each: "{{ direct }}"
          sequence:
            - variables:
                r: "{{ rooms[repeat.item.key] }}"
            - if:
                - condition: template
                  value_template: "{{ r.night | int == 0 }}"
              then:
                - action: light.turn_off
                  target:
                    entity_id: "{{ r.light }}"
                  data:
                    transition: 5
              else:
                - action: light.turn_on
                  target:
                    entity_id: "{{ r.light }}"
                  data:
                    brightness_pct: "{{ r.night }}"
                    transition: 5
            - action: input_text.set_value
              target:
                entity_id: "input_text.lighting_{{ repeat.item.key }}"
              data:
                value: "{{ stamp }} · {{ label }} · {{ 'switched off' if r.night | int == 0 else 'set to ' ~ r.night ~ '%' }} (it was nearly there)"
      # 2. Rooms set by hand or a scene: even them out first.
      - repeat:
          for_each: "{{ faded | selectattr('custom') | list }}"
          sequence:
            - action: light.turn_on
              target:
                entity_id: "{{ rooms[repeat.item.key].light }}"
              data:
                brightness_pct: "{{ repeat.item.start }}"
                transition: 5
      - if:
          - condition: template
            value_template: "{{ faded | selectattr('custom') | list | count > 0 }}"
        then:
          - delay:
              seconds: 6
      # 3. One fader per room.
      - repeat:
          for_each: "{{ faded }}"
          sequence:
            - variables:
                r: "{{ rooms[repeat.item.key] }}"
                ready: "{{ is_state(r.light, 'on') and state_attr(r.light, 'brightness') is not none }}"
                level_now: "{{ ((state_attr(r.light, 'brightness') | int(0)) / 2.55) | round(0) | int }}"
                to_text: "{{ 'off' if r.night | int == 0 else r.night ~ '%' }}"
            - if:
                - condition: template
                  value_template: "{{ ready }}"
              then:
                - action: script.turn_on
                  target:
                    entity_id: script.light_fader
                  data:
                    variables:
                      light: "{{ r.light }}"
                      endBrightnessPercent: "{{ r.night | int }}"
                      transitionTime:
                        hours: 0
                        minutes: "{{ minutes }}"
                        seconds: 0
                      lampBrightnessScale: zeroToTwoFiftyFive
                      easingTypeInput: easeInOutCubic
                      endBrightnessEntityScale: zeroToOneHundred
                      autoCancelThreshold: 10
                      shouldStopIfTheLampIsTurnedOffDuringTheFade: true
                      shouldResetTheStopEntityToOffAtStart: false
                      shouldInvertTheValueOfTheStopEntity: false
                      minimumStepDelayInMilliseconds: "{{ [house.fade_step_seconds | int * 1000, r.fade_step_ms | default(0) | int] | max }}"
                      shouldTryToUseNativeLampTransitionsToo: true
                      isDebugMode: false
                - action: input_text.set_value
                  target:
                    entity_id: "input_text.lighting_{{ repeat.item.key }}"
                  data:
                    value: >-
                      {{ stamp }} · {{ label }} ·
                      {{ ('lights had been set by hand or a scene, evened out at ' ~ level_now ~ '% first, then ') if repeat.item.custom }}{{ 'fading' if repeat.item.custom else 'fading from ' ~ level_now ~ '%' }}
                      to {{ to_text }} over {{ minutes }} minutes
              else:
                # Couldn't be evened out (a light not answering): go straight to the night level.
                - if:
                    - condition: template
                      value_template: "{{ r.night | int == 0 }}"
                  then:
                    - action: light.turn_off
                      target:
                        entity_id: "{{ r.light }}"
                      data:
                        transition: 5
                  else:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ r.light }}"
                      data:
                        brightness_pct: "{{ r.night }}"
                        transition: 5
                - action: input_text.set_value
                  target:
                    entity_id: "input_text.lighting_{{ repeat.item.key }}"
                  data:
                    value: "{{ stamp }} · {{ label }} · lights set by hand or a scene didn't settle, so it went straight to {{ to_text }}"

  # ── Stop fades ───────────────────────────────────────────────────────────────
  # Stops every fade that's running (evening fade, Wind Down and its Bedtime,
  # Bedtime's solarium fade): lights stay where they are right now.
  lighting_stop_fades:
    alias: Stop fades
    description: Stops every light fade that's running, and Wind Down's Bedtime. Lights stay where they are.
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      - action: script.turn_off
        target:
          entity_id:
            - script.lighting_wind_down
            - script.lighting_fade_rooms
            - script.light_fader
      - action: input_text.set_value
        target:
          entity_id: input_text.lighting_house
        data:
          value: "{{ now().strftime('%Y-%m-%d %H:%M') }} · Stop fades · every fade stopped, lights left where they were"