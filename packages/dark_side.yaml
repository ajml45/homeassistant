        - {t: 39.7, entities: [light.back_can_right], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 41.74, entities: [light.middle_can_right], data: {rgb_color: [103, 47, 77], brightness: 58}}
        - {t: 42.04, entities: [light.middle_can_right], data: {rgb_color: [157, 23, 38], brightness: 84}}
        - {t: 42.34, entities: [light.middle_can_right], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 44.58, entities: [light.front_can_right], data: {rgb_color: [103, 47, 77], brightness: 58}}
