# =====================================================================
#  THE DARK SIDE  —  /config/packages/dark_side.yaml          (v1, 2026-11-14)
#  Media in /config/www/dark_side/ (served at /local/dark_side/).
#
#  Slow and ominous — lights fade and breathe; only three moments flash.
#     0:00  STATION      cold grey-blue, console lights, reactor hum
#     0:19  APPROACH     his breathing moves mudroom tablet → kitchen tablet →
#                        kitchen Sonos; one more fixture turns red with every breath
#     0:48  THE ORDER    "What is thy bidding, my master?" / "Wipe them out… all of them."
#     0:56  SUPERWEAPON  green builds for 10 s → one flash
#     1:10  THE DUEL     "You shouldn't have come back." red + blue blades, slow
#                        heavy clashes, "Too easy.", the room breathes red with him
#     1:58  THE EMPEROR  "You are no match…" + Force lightning on the lamps
#     2:10  LACK OF FAITH   the room is squeezed down to dark red
#     2:17  STANDOFF     breath-synced red pulse; screens ask WHO WINS?
#     7:25  nobody called it → he withdraws
#
#  Pico (shared with Star Battle):
#     top = start The Dark Side    middle = start Star Battle    bottom = cancel either
#     up = the heroes win          down = the dark side wins
#  Neither scene starts while the other one is running.
#
#  Sound:  great room Sonos  = Spotify (your Imperial track; swells for the dark ending)
#          kitchen Sonos     = station, Emperor, superweapon, sabers, lightning, close breathing
#          kitchen tablet    = Vader's lines + his breathing as he arrives
#          mudroom tablet    = his breathing in the distance first
#          Echos             = a few Amazon alarms at the superweapon + ending sounds
#  Light timelines below are GENERATED from timeline.py — edit tunables, not steps.
# =====================================================================

input_text:
  dark_side_tvs:
    name: "Dark Side – saved TV state"
    max: 255
    initial: "[]"
  dark_side_volumes:
    name: "Dark Side – saved Echo/tablet volumes"
    max: 255
    initial: "{}"

automation:
  - id: dark_side_pico
    alias: "Dark Side – Pico"
    description: "Top = start, bottom = cancel, up = heroes win, down = the dark side wins"
    mode: queued
    max: 3
    triggers:
      - trigger: event
        event_type: lutron_caseta_button_event
        event_data:
          action: press
    variables:
      pico_device_ids: [cdf7071b0ed38a3d5ce144a3fe3de245]
      pico_slug: office_office_office_lights_pico
      start_button: "on"
      cancel_button: "off"
      good_button: raise
      dark_button: lower
      running: >-
        {{ is_state('script.dark_side_show', 'on') or is_state('script.dark_side_ending', 'on') }}
    conditions:
      - condition: template
        value_template: >-
          {%- set did = trigger.event.data.device_id | default('') | string -%}
          {{ did in pico_device_ids
             or (device_attr(did, 'name_by_user') or device_attr(did, 'name') or '') | slugify == pico_slug
             or device_entities(did) | select('search', pico_slug) | list | count > 0 }}
    actions:
      - choose:
          - conditions:
              - "{{ trigger.event.data.button_type == start_button and not running }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.dark_side_button
          - conditions:
              - "{{ trigger.event.data.button_type == cancel_button and running }}"
            sequence:   # dedicated cancel button: no double-press guard
              - action: script.turn_off
                target:
                  entity_id: [script.dark_side_show, script.dark_side_ending]
              - action: script.turn_on
                target:
                  entity_id: script.dark_side_restore
                data:
                  variables:
                    cancelled: true
          - conditions:
              - "{{ trigger.event.data.button_type in [good_button, dark_button] }}"
            sequence:
              - action: script.turn_on
                target:
                  entity_id: script.dark_side_winner
                data:
                  variables:
                    side: "{{ 'good' if trigger.event.data.button_type == good_button else 'dark' }}"

script:
  # -------------------------------------------------------------------
  #  RESTORE (end of an ending, or cancel). Holds the shared config.
  # -------------------------------------------------------------------
  dark_side_restore:
    alias: "Dark Side – restore"
    icon: mdi:restore
    mode: single
    max_exceeded: silent
    fields:
      cancelled:
        description: "True when called from a cancel"
        example: false
    variables: &dark_side_config
      # ===================== TUNABLES =====================
      pre_roll: 3.5            # s from press to t0 (TV wake-up)
      audio_lead: 0.6          # kitchen Sonos latency — use the value you found with script.dark_side_sync_test
      video_lead: 1.5          # Cast start latency
      tablet_lead: 0.5         # tablet pages are clock-synced; this just loads them early
      tablet_audio_lead: 0.4   # tablet speakers (side sounds, timing is loose)
      show_end: 444.56         # 2:17 show + ~5:08 standoff → he withdraws
      winner_open: 8.0         # Pico up/down ignored for the first few seconds
      end_restore: {good: 12.5, dark: 14.5, neutral: 10.0}
      verify_after: [4, 4]
      cancel_settle: 2.5
      effects_volume: 55       # kitchen Sonos, 0-100
      music_volume: 35         # great room soundbar, 0-100 (Spotify)
      end_music_volume: 50     # great room: fanfare (good) / the Imperial swell (dark)
      tablet_volume: 95        # both tablets, 0-100 (Vader lives here — keep it loud)
      echo_volume: 0.5         # Echos, 0-1
      spotify_uri: "https://open.spotify.com/track/2bw4WgXyXP90hIex7ur58y?si=1e7e3dddca6b49bb"
      music_seek: 0
      media_version: 1
      base_url: "http://192.168.68.21:8123/local/dark_side"
      fader_scripts: []        # e.g. [script.ashleys_light_fader]

      # ===================== DEVICES =====================
      sonos_effects: media_player.sonos_kitchen
      sonos_music: media_player.sonos_great_room_soundbar
      tvs:
        - {cast: media_player.great_room_tv, atv: media_player.google_tv_great_room, remote: remote.google_tv_great_room}
        - {cast: media_player.kitchen_tv, atv: media_player.google_tv_kitchen, remote: remote.google_tv_kitchen}
      tablets:
        - {prefix: kitchen_kitchen_ha_tablet, player: media_player.kitchen_kitchen_ha_tablet, audio: ds_tablet_kitchen.mp3}
        - {prefix: mudroom_mudroom_ha_tablet, player: media_player.mudroom_mudroom_ha_tablet, audio: ds_tablet_mudroom.mp3}
      echos:
        - {entity: media_player.echo_show}            # kitchen
        - {entity: media_player.andrew_s_echo_show}   # great room
      # when each Echo plays which sound (s after t0)
      echo_schedule: [{t: 2.0, entity: media_player.andrew_s_echo_show, sound: amzn_sfx_scifi_engines_on_02}, {t: 57.0, entity: media_player.echo_show, sound: amzn_sfx_scifi_alarm_04}, {t: 59.0, entity: media_player.andrew_s_echo_show, sound: amzn_sfx_scifi_alarm_01}]
      # Amazon sound-library IDs known to work with Alexa Media Player
      echo_end_sounds: {good: amzn_sfx_crowd_applause_01, dark: amzn_sfx_scifi_alarm_04, neutral: amzn_sfx_scifi_engines_on_02}

      neutral_lights:
        - light.back_can_left
        - light.middle_can_left
        - light.front_can_left
        - light.back_can_middle
        - light.middle_can_middle
        - light.front_can_middle
        - light.back_can_right
        - light.middle_can_right
        - light.front_can_right
        - light.right_couch_lamp
        - light.great_room_back_lamp
        - light.left_couch_lamp
        - light.great_room_front_lamp
        - light.soundbar_shelf_light
        - light.under_island
        - light.solarium_path_lights
        - light.slider_path_lights
        - light.stair_path_lights
        - light.solarium_spot_lights
        - light.island_pendant_left
        - light.island_pendant_right
        - light.sink_sconce_left
        - light.sink_sconce_right
        - light.stove_sconce_left
        - light.stove_sconce_right

      snapshot_entities:
        - light.back_can_left
        - light.back_can_middle
        - light.back_can_right
        - light.front_can_left
        - light.front_can_middle
        - light.front_can_right
        - light.great_room_back_lamp
        - light.great_room_bar_cabinet_lights
        - light.great_room_bar_lamp
        - light.great_room_fireplace_can
        - light.great_room_front_lamp
        - light.island_pendant_left
        - light.island_pendant_right
        - light.kitchen_above_cabinet
        - light.kitchen_cans_fridge
        - light.kitchen_cans_sink
        - light.kitchen_under_cabinet
        - light.left_couch_lamp
        - light.middle_can_left
        - light.middle_can_middle
        - light.middle_can_right
        - light.right_couch_lamp
        - light.sink_sconce_left
        - light.sink_sconce_right
        - light.sitting_area_left_1
        - light.sitting_area_left_2
        - light.sitting_area_left_3
        - light.sitting_area_left_4
        - light.sitting_area_right_1
        - light.sitting_area_right_2
        - light.sitting_area_right_3
        - light.sitting_area_right_4
        - light.slider_path_lights
        - light.solarium_couch
        - light.solarium_path_lights
        - light.solarium_sconces
        - light.solarium_spot_lights
        - light.soundbar_shelf_light
        - light.stair_path_lights
        - light.stove_sconce_right
        - light.stove_sconce_left
        - light.under_island
        - switch.kitchen_kitchen_ha_tablet_screen
        - switch.kitchen_kitchen_ha_tablet_screensaver
        - number.kitchen_kitchen_ha_tablet_screen_brightness
        - switch.mudroom_mudroom_ha_tablet_screen
        - switch.mudroom_mudroom_ha_tablet_screensaver
        - number.mudroom_mudroom_ha_tablet_screen_brightness
    sequence:
      - if:
          - "{{ cancelled | default(false) | bool }}"
        then:
          - delay:
              seconds: 1
          - action: light.turn_on
            target:
              entity_id: "{{ neutral_lights }}"
            data:
              color_temp_kelvin: 2700
              brightness: 180
            continue_on_error: true
          - delay:
              seconds: "{{ cancel_settle }}"
      - parallel:
          # ---- lights + tablet screens: restore, then verify twice ----
          - sequence:
              - action: scene.turn_on
                target:
                  entity_id: scene.dark_side_snapshot
                data:
                  transition: 2
                continue_on_error: true
              - repeat:
                  for_each: "{{ verify_after }}"
                  sequence:
                    - delay:
                        seconds: "{{ repeat.item }}"
                    - action: scene.turn_on
                      target:
                        entity_id: scene.dark_side_snapshot
                      continue_on_error: true

          # ---- Sonos: fade the great room out, then put both zones back ----
          - sequence:
              - variables:
                  vol_now: "{{ state_attr(sonos_music, 'volume_level') | float(0) }}"
              - if:
                  - "{{ vol_now > 0 }}"
                then:
                  - repeat:
                      for_each: [0.6, 0.35, 0.15, 0.0]
                      sequence:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ sonos_music }}"
                          data:
                            volume_level: "{{ (vol_now * repeat.item) | round(2) }}"
                          continue_on_error: true
                        - delay:
                            milliseconds: 400
              - action: media_player.media_pause
                target:
                  entity_id: ["{{ sonos_music }}", "{{ sonos_effects }}"]
                continue_on_error: true
              - action: sonos.restore
                data:
                  entity_id: ["{{ sonos_music }}", "{{ sonos_effects }}"]
                  with_group: true
                continue_on_error: true
              - delay:
                  seconds: 3
              - if:
                  - "{{ vol_now > 0 and state_attr(sonos_music, 'volume_level') | float(1) == 0 }}"
                then:
                  - action: media_player.volume_set
                    target:
                      entity_id: "{{ sonos_music }}"
                    data:
                      volume_level: "{{ vol_now | round(2) }}"
                    continue_on_error: true

          # ---- tablets: stop audio, volume back, dashboard back ----
          - sequence:
              - variables:
                  vols: >-
                    {%- set s = states('input_text.dark_side_volumes') -%}
                    {{ s | from_json if s.startswith('{') else {} }}
              - repeat:
                  for_each: "{{ tablets }}"
                  sequence:
                    - action: media_player.media_stop
                      target:
                        entity_id: "{{ repeat.item.player }}"
                      continue_on_error: true
                    - if:
                        - "{{ vols.get(repeat.item.player) is number }}"
                      then:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ repeat.item.player }}"
                          data:
                            volume_level: "{{ vols[repeat.item.player] }}"
                          continue_on_error: true
                    - action: button.press
                      target:
                        entity_id: "button.{{ repeat.item.prefix }}_load_start_url"
                      continue_on_error: true
              # ---- Echos: volume back (after any lagging sound has played) ----
              - delay:
                  seconds: 6
              - repeat:
                  for_each: "{{ echos }}"
                  sequence:
                    - action: media_player.volume_set
                      target:
                        entity_id: "{{ repeat.item.entity }}"
                      data:
                        volume_level: "{{ vols.get(repeat.item.entity, 0.4) if vols.get(repeat.item.entity) is number else 0.4 }}"
                      continue_on_error: true

          # ---- TVs: back to what they were doing ----
          - sequence:
              - variables:
                  saved: >-
                    {%- set s = states('input_text.dark_side_tvs') -%}
                    {{ s | from_json if s.startswith('[') else [] }}
              - repeat:
                  for_each: "{{ range(tvs | count) | list }}"
                  sequence:
                    - variables:
                        tv: "{{ tvs[repeat.item] }}"
                        was: "{{ saved[repeat.item] if saved | count > repeat.item else [1, ''] }}"
                    - choose:
                        - conditions:
                            - "{{ was[0] == 0 }}"
                          sequence:
                            - action: media_player.turn_off
                              target:
                                entity_id: "{{ tv.atv }}"
                              continue_on_error: true
                        - conditions:
                            - "{{ was[1] | length > 0 }}"
                          sequence:
                            - action: remote.turn_on
                              target:
                                entity_id: "{{ tv.remote }}"
                              data:
                                activity: "{{ was[1] }}"
                              continue_on_error: true
                      default:
                        - action: media_player.media_stop
                          target:
                            entity_id: "{{ tv.cast }}"
                          continue_on_error: true

  # -------------------------------------------------------------------
  #  BUTTON (Pico middle): start, or cancel if running
  # -------------------------------------------------------------------
  dark_side_button:
    alias: "Dark Side – start / cancel"
    icon: mdi:death-star-variant
    mode: single
    max_exceeded: silent
    sequence:
      - choose:
          - conditions:
              - "{{ is_state('script.dark_side_show', 'on') or is_state('script.dark_side_ending', 'on') }}"
            sequence:
              - condition: template
                value_template: >-
                  {{ is_state('script.dark_side_ending', 'on') or
                     (now() - states.script.dark_side_show.last_changed).total_seconds() > 3 }}
              - action: script.turn_off
                target:
                  entity_id: [script.dark_side_show, script.dark_side_ending]
              - action: script.turn_on
                target:
                  entity_id: script.dark_side_restore
                data:
                  variables:
                    cancelled: true
          - conditions:
              - "{{ is_state('script.dark_side_restore', 'on') }}"
            sequence:
              - stop: "Restore in progress"
        default:
          - condition: template     # never on top of Star Battle
            value_template: >-
              {{ not (is_state('script.star_battle_show', 'on') or is_state('script.star_battle_ending', 'on')
                      or is_state('script.star_battle_restore', 'on')) }}
          - action: script.turn_on
            target:
              entity_id: script.dark_side_show

  # -------------------------------------------------------------------
  #  WINNER (Pico up / down): call the ending while the battle is running
  # -------------------------------------------------------------------
  dark_side_winner:
    alias: "Dark Side – call the ending"
    icon: mdi:trophy
    mode: single
    max_exceeded: silent
    fields:
      side:
        description: "good or dark"
        example: dark
    variables:
      pre_roll: 3.5          # keep in sync with the tunables above
      winner_open: 8.0
    sequence:
      - condition: template
        value_template: >-
          {{ side in ['good', 'dark'] and is_state('script.dark_side_show', 'on') and
             (now() - states.script.dark_side_show.last_changed).total_seconds() > pre_roll + winner_open }}
      - action: script.turn_off
        target:
          entity_id: script.dark_side_show
      - action: script.turn_on
        target:
          entity_id: script.dark_side_ending
        data:
          variables:
            kind: "{{ side }}"

  # -------------------------------------------------------------------
  #  SHOW: 2:00 battle + up to 5:00 standoff
  # -------------------------------------------------------------------
  dark_side_show:
    alias: "Dark Side – show"
    icon: mdi:death-star-variant
    mode: single
    max_exceeded: silent
    variables:
      <<: *dark_side_config
      # ===================== LIGHT TIMELINE (generated) =====================
      # t = seconds after t0 (0-137 show, 137+ standoff). action defaults to light.turn_on.
      # WiZ RGB cans
      steps_wiz:
        - {t: 0.0, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [50, 70, 115], brightness: 15}}
        - {t: 0.4, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [50, 70, 115], brightness: 18}}
        - {t: 0.8, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [50, 70, 115], brightness: 22}}
        - {t: 1.2, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [50, 70, 115], brightness: 25}}
        - {t: 1.6, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [50, 70, 115], brightness: 29}}
        - {t: 2.0, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 4.0, entities: [light.back_can_right], data: {rgb_color: [0, 120, 40], brightness: 28}}
        - {t: 5.25, entities: [light.front_can_middle], data: {rgb_color: [140, 0, 0], brightness: 26}}
        - {t: 6.5, entities: [light.back_can_right], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 7.75, entities: [light.front_can_middle], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 9.0, entities: [light.back_can_right], data: {rgb_color: [0, 120, 40], brightness: 28}}
        - {t: 10.25, entities: [light.front_can_middle], data: {rgb_color: [140, 0, 0], brightness: 26}}
        - {t: 11.5, entities: [light.back_can_right], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 12.75, entities: [light.front_can_middle], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 14.0, entities: [light.back_can_right], data: {rgb_color: [0, 120, 40], brightness: 28}}
        - {t: 15.25, entities: [light.front_can_middle], data: {rgb_color: [140, 0, 0], brightness: 26}}
        - {t: 16.5, entities: [light.back_can_right], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 17.75, entities: [light.front_can_middle], data: {rgb_color: [50, 70, 115], brightness: 32}}
        - {t: 19.0, entities: [light.back_can_right], data: {rgb_color: [0, 120, 40], brightness: 28}}
        - {t: 20.25, entities: [light.front_can_middle], data: {rgb_color: [140, 0, 0], brightness: 26}}
        - {t: 22.18, entities: [light.back_can_left], data: {rgb_color: [103, 47, 77], brightness: 58}}
        - {t: 22.48, entities: [light.back_can_left], data: {rgb_color: [157, 23, 38], brightness: 84}}
        - {t: 22.78, entities: [light.back_can_left], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 25.1, entities: [light.middle_can_left], data: {rgb_color: [103, 47, 77], brightness: 58}}
        - {t: 25.4, entities: [light.middle_can_left], data: {rgb_color: [157, 23, 38], brightness: 84}}
        - {t: 25.7, entities: [light.middle_can_left], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 27.88, entities: [light.front_can_left], data: {rgb_color: [103, 47, 77], brightness: 58}}
        - {t: 28.18, entities: [light.front_can_left], data: {rgb_color: [157, 23, 38], brightness: 84}}
        - {t: 28.48, entities: [light.front_can_left], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 30.56, entities: [light.back_can_middle], data: {rgb_color: [103, 47, 77], brightness: 58}}
        - {t: 30.86, entities: [light.back_can_middle], data: {rgb_color: [157, 23, 38], brightness: 84}}
        - {t: 31.16, entities: [light.back_can_middle], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 33.36, entities: [light.middle_can_middle], data: {rgb_color: [103, 47, 77], brightness: 58}}
