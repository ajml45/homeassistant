        - {t: 36.22, entities: [light.front_can_middle], data: {rgb_color: [103, 47, 77], brightness: 58}}
        - {t: 36.52, entities: [light.front_can_middle], data: {rgb_color: [157, 23, 38], brightness: 84}}
        - {t: 36.82, entities: [light.front_can_middle], data: {rgb_color: [210, 0, 0], brightness: 110}}
        - {t: 39.1, entities: [light.back_can_right], data: {rgb_color: [103, 47, 77], brightness: 58}}
