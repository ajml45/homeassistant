          - {t: 1.2, entities: [light.back_can_left, light.middle_can_left, light.front_can_left, light.back_can_middle, light.middle_can_middle, light.front_can_middle, light.back_can_right, light.middle_can_right, light.front_can_right], data: {rgb_color: [255, 110, 0], brightness: 230}}
