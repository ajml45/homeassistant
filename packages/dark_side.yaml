              entity_id: "{{ sonos_effects }}"
            data:
              media_content_id: "{{ base_url }}/ds_end_{{ k }}_fx.mp3?v={{ media_version }}"
              media_content_type: music
            continue_on_error: true
          # ---- great room: good = fanfare replaces the music; dark = the Imperial track swells ----
          - choose:
              - conditions:
                  - "{{ k == 'good' }}"
                sequence:
                  - action: media_player.volume_set
                    target:
                      entity_id: "{{ sonos_music }}"
                    data:
                      volume_level: "{{ (end_music_volume | float / 100) | round(2) }}"
                    continue_on_error: true
                  - action: media_player.play_media
                    target:
                      entity_id: "{{ sonos_music }}"
                    data:
                      media_content_id: "{{ base_url }}/ds_end_good_music.mp3?v={{ media_version }}"
                      media_content_type: music
                    continue_on_error: true
              - conditions:
                  - "{{ k == 'dark' }}"
                sequence:
                  - repeat:
                      for_each: [0.25, 0.5, 0.75, 1.0]
                      sequence:
                        - action: media_player.volume_set
                          target:
                            entity_id: "{{ sonos_music }}"
                          data:
                            volume_level: "{{ ((music_volume + (end_music_volume - music_volume) * repeat.item) | float / 100) | round(2) }}"
                          continue_on_error: true
                        - delay:
                            milliseconds: 500
          # ---- screens ----
          - action: media_player.play_media
            target:
              entity_id: "{{ tvs | map(attribute='cast') | list }}"
            data:
              media_content_id: "{{ base_url }}/ds_end_{{ k }}.mp4?v={{ media_version }}"
              media_content_type: video/mp4
            continue_on_error: true
          - repeat:
              for_each: "{{ tablets }}"
              sequence:
                - action: media_player.media_stop
                  target:
                    entity_id: "{{ repeat.item.player }}"
                  continue_on_error: true
                - if:   # dark: "Yes, master." on the kitchen tablet / neutral: his breathing walks away on the mudroom tablet
                    - "{{ (k == 'dark' and repeat.index == 1) or (k == 'neutral' and repeat.index == 2) }}"
                  then:
                    - action: media_player.play_media
                      target:
                        entity_id: "{{ repeat.item.player }}"
                      data:
                        media_content_id: "{{ base_url }}/ds_end_{{ k }}_tablet.mp3?v={{ media_version }}"
                        media_content_type: music
                      continue_on_error: true
                - action: fully_kiosk.load_url
                  target:
                    device_id: "{{ device_id('switch.' ~ repeat.item.prefix ~ '_screen') }}"
                  data:
                    url: "{{ base_url }}/ds_index.html?v={{ media_version }}&end={{ k }}&t0={{ (t0 * 1000) | int }}"
                  continue_on_error: true
          # ---- Echos: applause / red alert / engines ----
          - action: media_player.play_media
            target:
              entity_id: "{{ echos | map(attribute='entity') | list }}"
            data:
              media_content_id: "{{ echo_end_sounds[k] }}"
              media_content_type: sound
            continue_on_error: true
          # ---- lights ----
          - sequence:
              - variables:
                  steps: "{{ v.wiz }}"
              - *dark_side_runner
          - sequence:
              - variables:
                  steps: "{{ v.white }}"
              - *dark_side_runner
          - sequence:
              - variables:
                  steps: "{{ v.hue }}"
              - *dark_side_runner
          - sequence:
              - variables:
                  steps: "{{ v.govee }}"
              - *dark_side_runner
      - delay:
          milliseconds: "{{ [0, ((t0 + end_restore[k] - now().timestamp()) * 1000) | int] | max }}"
      - action: script.turn_on
        target:
          entity_id: script.dark_side_restore
        data:
          variables:
            cancelled: false
