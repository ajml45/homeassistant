# =====================================================================
#  POOL GUARD  —  /config/packages/pool_guard.yaml
#  v2 · 2026-11-26 · solarium-only loop, kitchen tablet warning
#
#  Keeps the kids away from the pool door. Arm it with the Pool Guard
#  toggle (input_boolean.pool_guard — the shield chip on the Solarium
#  room card). The solarium motion sensor
#  (binary_sensor.hue_motion_sensor_2_motion) is pointed at the door.
#
#  WHAT HAPPENS (all sound stays in the solarium)
#    Motion at the door → the very polite pool starts talking: a chime,
#      then one of warn_lines ("…please rethink what you are doing").
#    Still there after the warning (or back again) → the ALARM:
#      · solarium strips pulse red; pool + sitting-area bulbs drop to a dim
#        warm glow (they can't do red) so the pool is never dark
#      · lines switch to alarm_lines: still polite, but now the pool also
#        yells for Mom and Dad (who can't actually hear it), with a siren
#        on the first one and every siren_every-th line after
#      · the kitchen tablet shows a silent "Someone's at the pool door"
#        screen with a timer
#      · phone push to notify_targets
#    The pool keeps going, a different line every few seconds, for as long
#    as the sensor sees motion (up to max_minutes).
#    Door quiet for clear_after s → lights go back, the tablet shows
#      "All clear" for a few seconds then its dashboard, and the pool says
#      a thanks_lines line ("Thank you for making the correct choice!…").
#    Hit max_minutes → it goes quiet, puts everything back, pushes the
#      phones, and waits for the door to go quiet before re-arming.
#
#  Kitchen / great room speakers stay silent. To have the pool tattle there
#  once when the alarm starts, list them in parents_speakers.
#
#  ALSO
#    · Phone push if Pool Guard is on and the motion sensor is offline
#      (for 5 min, or already offline when you turn Pool Guard on).
#    · Turning Pool Guard off stops it and puts everything back.
#    · An alarm during the solarium's 7:00 pm fade stops that fade (same as
#      touching a light by hand); the lights still go back afterwards.
#
#  TEST from Settings → Automations & scenes → Scripts (these work even
#  when Pool Guard is off):
#    script.pool_guard_sample  one of each voice + siren + thank-you
#    script.pool_guard_run     the real thing, driven by the real sensor:
#                              run it, then wave at the door (or don't)
#    script.pool_guard_alarm   just the lights + tablet + push (runs until
#                              max_minutes) → script.pool_guard_stop to end
#  Each voice line is made the first time it plays, then cached.
#  If a line doesn't play, its voice name is the likely culprit: check the
#  voice list under Media → Text-to-speech → Home Assistant Cloud, or set
#  voice_pool / voice_yell to "" for the default voice.
#
#  Media lives in /config/www/pool_guard/ (served at /local/pool_guard/):
#    chime.mp3, thanks.mp3, siren.mp3, alert.mp3, tablet.html
# =====================================================================

input_boolean:
  pool_guard:
    name: Pool Guard
    icon: mdi:shield-lock

script:
  # -------------------------------------------------------------------
  #  RUN: warn → (alarm) → keep talking while there's motion → thanks.
  #  Started by the motion automation; ignores new motion while it runs.
  # -------------------------------------------------------------------
  pool_guard_run:
    alias: "Pool Guard – run"
    icon: mdi:shield-lock
    mode: single
    max_exceeded: silent
    variables: &pool_guard_config
      # ===================== TUNABLES =====================
      motion: binary_sensor.hue_motion_sensor_2_motion   # also named in the automations' triggers below
      clear_after: 8          # s the sensor must read "clear" before they count as gone. The Hue sensor
                              # holds "motion" ~10 s after movement stops, so that's ~18 s of nobody.
      warnings_before_alarm: 1   # polite warnings before the alarm, if they're still there (or come back)
      gap: [3, 6]             # s pause between lines (random in this range)
      siren_every: 3          # during the alarm: siren before the first line and every 3rd after
      max_minutes: 3          # stop talking after this long, push the phones, wait for quiet
      cooldown: 20            # s after a thank-you before motion can start it again

      notify_targets:
        - notify.mobile_app_andrews_phone
        # - notify.mobile_app_christina_s_iphone
      push_level: time-sensitive   # passive | active | time-sensitive | critical (critical rings through silent mode)

      # ---- audio ----
      sonos_pool: [media_player.sonos_solarium]   # add media_player.sonos_basement to hear it there too
      parents_speakers: []    # e.g. [media_player.sonos_kitchen]: the pool tattles there once when the alarm starts
      volume_day:   {pool: 45, alarm: 55, parents: 40}   # Sonos 0–100
      volume_night: {pool: 30, alarm: 40, parents: 30}   # 20:00–07:00
      tts_engine: tts.home_assistant_cloud
      tts_language: en-US
      voice_pool: "JennyNeural||customerservice"   # the very polite pool
      voice_yell: "JennyNeural||shouting"          # the same pool, yelling for the grown-ups
      wps: 2.5                # words per second the voices speak (sets the wait before the next clip)
      tts_lead: 1.0           # s for a voice line to be made and start on Sonos
      clip_lead: 0.6          # s for an mp3 to start on Sonos
      base_url: "http://192.168.68.21:8123/local/pool_guard"
      media_version: 2        # bump after replacing the mp3s or tablet.html (cache-buster)

      # ---- kitchen tablet (Fully Kiosk prefixes) ----
      tablets: [kitchen_kitchen_ha_tablet]   # add mudroom_mudroom_ha_tablet for the mudroom too
      tablet_clear_secs: 12   # how long "All clear" shows before the dashboard comes back

      # ---- what gets said (voice: pool = polite, yell = polite but loud) ----
      chime_clip: {file: chime.mp3, secs: 1.75}
      siren_clip: {file: siren.mp3, secs: 3.85}
      warn_lines:
        - {voice: pool, say: "Hi there! This is the pool. I'm closed right now. Please rethink what you are doing. Thank you!"}
        - {voice: pool, say: "Hello! The pool is currently closed. Swimming hours are whenever a grown-up says so."}
        - {voice: pool, say: "Your visit is important to us. Unfortunately, the pool is closed. Please step away from the door."}
        - {voice: pool, say: "Thank you for visiting the pool. The pool is not accepting visitors at this time."}
        - {voice: pool, say: "Please hold. A grown-up will be with you shortly. Just kidding. Please step away from the door."}
        - {voice: pool, say: "Hi! It's me again, the pool. Still closed. Still watching."}
        - {voice: pool, say: "The pool is resting right now. Please let the pool rest."}
        - {voice: pool, say: "Fun fact! The pool is only open when a grown-up is with you. Isn't that fun?"}
        - {voice: pool, say: "This door is for grown-ups only. You are many wonderful things, but you are not a grown-up."}
        - {voice: pool, say: "I appreciate your interest in swimming. Please take your interest somewhere else."}
        - {voice: pool, say: "Please rethink what you are doing. Take your time. I'll wait."}
        - {voice: pool, say: "The pool is closed for cleaning. And for napping. And because you're not allowed."}
      alarm_lines:
        - {voice: yell, say: "Mom! Dad! There's someone at the pool door!"}
        - {voice: pool, say: "Okay. You did not rethink it. That's okay. I'm telling."}
        - {voice: yell, say: "Excuse me! Grown-ups! Pool door! Pool door!"}
        - {voice: pool, say: "This is your final, final, final warning. The pool is closed."}
        - {voice: yell, say: "Hello? Can anyone hear me? There is a small human at my door!"}
        - {voice: pool, say: "Unauthorized activity detected. Please remain calm. And dry."}
        - {voice: pool, say: "I'm not mad. I'm just disappointed. And closed."}
        - {voice: yell, say: "Parental units! Please report to the solarium!"}
        - {voice: pool, say: "The lifeguard is on break. The lifeguard is also Dad. I just texted him."}
        - {voice: pool, say: "I have alerted the grown-ups. Please enjoy this complimentary red lighting while you wait."}
        - {voice: yell, say: "Code blue! Code pool! Somebody get a grown-up!"}
        - {voice: pool, say: "Please step away from the door. The door would also like you to step away from the door."}
      thanks_lines:
        - {voice: pool, say: "Thank you for making the correct choice! The pool appreciates you. Have a dry day!"}
        - {voice: pool, say: "Thank you for making the correct choice. Excellent work. Very dry of you."}
        - {voice: pool, say: "Thanks for making the correct choice! The pool will remember this kindness."}
      parents_clips:          # only if parents_speakers is set
        - {file: alert.mp3, secs: 1.65}
        - {voice: pool, say: "Hi, grown-ups! It's the pool. Someone is at my door. I won't say who... but it's who you think."}

      # ---- alarm lights: solarium only, individual lights (never Lightener rooms or groups) ----
      d_red_hi: {rgb_color: [255, 0, 0], brightness: 255}
      d_red_lo: {rgb_color: [255, 0, 0], brightness: 30}
      d_end: {color_temp_kelvin: 2700, brightness: 180}   # warm white: what lights that were off remember
      d_white_dim: {color_temp_kelvin: 2200, brightness: 20}   # pool + sitting-area bulbs during the alarm
      pulse_period: 1.5       # s between red swaps (Govee strips need ≥0.9 s per strip)
      strips_a: [light.solarium_path_lights, light.stair_path_lights, light.solarium_couch]
      strips_b: [light.slider_path_lights, light.solarium_spot_lights]
      white_bulbs:
        [light.pool_area_left_1, light.pool_area_left_2, light.pool_area_left_3, light.pool_area_left_4,
         light.pool_area_right_1, light.pool_area_right_2, light.pool_area_right_3, light.pool_area_right_4,
         light.sitting_area_left_1, light.sitting_area_left_2, light.sitting_area_left_3, light.sitting_area_left_4,
         light.sitting_area_right_1, light.sitting_area_right_2, light.sitting_area_right_3, light.sitting_area_right_4]
      alarm_lights: "{{ strips_a + strips_b + white_bulbs }}"
      tablet_entities: >-
        {%- set ns = namespace(e=[]) -%}
        {%- for t in tablets -%}
          {%- set ns.e = ns.e + ['switch.' ~ t ~ '_screen', 'switch.' ~ t ~ '_screensaver', 'number.' ~ t ~ '_screen_brightness'] -%}
        {%- endfor -%}
        {{ ns.e }}
      # ============================================================

    sequence:
      - variables:
          t_start: "{{ now().timestamp() }}"
          off_w: "{{ range(warn_lines | count) | random }}"    # random starting point in each list,
          off_a: "{{ range(alarm_lines | count) | random }}"   # then step through it (no repeats in a row)

      - repeat:
          sequence:
            - variables:
                alarm_on: "{{ is_state('script.pool_guard_alarm', 'on') }}"
                start_alarm: "{{ repeat.index == warnings_before_alarm + 1 and not alarm_on }}"
                alarmed: "{{ alarm_on or start_alarm }}"
                siren: "{{ alarmed and (repeat.index - warnings_before_alarm - 1) % siren_every == 0 }}"
                line: >-
                  {{ alarm_lines[(off_a + repeat.index) % (alarm_lines | count)] if alarmed
                     else warn_lines[(off_w + repeat.index) % (warn_lines | count)] }}
                clips: >-
                  {{ ([chime_clip] if repeat.index == 1 else [])
                     + ([siren_clip] if siren else []) + [line] }}
                vol: "{{ volume_night if (now().hour >= 20 or now().hour < 7) else volume_day }}"

            - if:
                - "{{ start_alarm }}"
              then:
                - action: script.turn_on
                  target:
                    entity_id: script.pool_guard_alarm
                - if:
                    - "{{ parents_speakers | count > 0 }}"
                  then:
                    - action: script.turn_on
                      target:
                        entity_id: script.pool_guard_say
                      data:
                        variables:
                          speakers: "{{ parents_speakers }}"
                          clips: "{{ parents_clips }}"
                          level: "{{ vol.parents }}"

            - action: script.pool_guard_say
              data:
                speakers: "{{ sonos_pool }}"
                clips: "{{ clips }}"
                level: "{{ vol.alarm if alarmed else vol.pool }}"

            - delay:
                seconds: "{{ range(gap[0], gap[1] + 1) | random }}"

            # Door quiet right now? Wait out the rest of clear_after for it to come back.
            - if:
                - "{{ not is_state(motion, 'on') }}"
              then:
                - wait_template: "{{ is_state(motion, 'on') }}"
                  timeout:
                    seconds: "{{ [0, clear_after - (now() - states[motion].last_changed).total_seconds()] | max }}"
                  continue_on_timeout: true
          until:
            - >-
              {{ (not is_state(motion, 'on')
                  and (now() - states[motion].last_changed).total_seconds() >= clear_after - 0.5)
                 or (now().timestamp() - t_start) >= max_minutes * 60 }}

      # ---- wrap up ----
      - variables:
          timed_out: "{{ (now().timestamp() - t_start) >= max_minutes * 60 }}"
          alarm_was_on: "{{ is_state('script.pool_guard_alarm', 'on') }}"
      - if:
          - "{{ alarm_was_on }}"
        then:
          - action: script.turn_off
            target:
              entity_id: script.pool_guard_alarm
          - action: script.turn_on
            target:
              entity_id: script.pool_guard_restore
            data:
              variables:
                cancelled: true
                clear: "{{ not timed_out }}"
      - if:
          - "{{ timed_out }}"
        then:
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "Pool Guard ⚠️"
                    message: >-
                      Still motion at the pool door after {{ max_minutes }} minutes, so the pool went quiet.
                      Is someone still there, or is the sensor stuck?
                    data:
                      push:
                        interruption-level: time-sensitive
                  continue_on_error: true
          - wait_template: "{{ not is_state(motion, 'on') }}"
            timeout:
              minutes: 30
          - stop: "Timed out"
      - action: script.pool_guard_say
        data:
          speakers: "{{ sonos_pool }}"
          clips: "{{ [{'file': 'thanks.mp3', 'secs': 1.55}, thanks_lines | random] }}"
          level: "{{ (volume_night if (now().hour >= 20 or now().hour < 7) else volume_day).pool }}"
      - delay:
          seconds: "{{ cooldown }}"

  # -------------------------------------------------------------------
  #  ALARM: red solarium, kitchen tablet warning, phone push. Runs until
  #  pool_guard_run (or pool_guard_stop) turns it off, max_minutes + 1 min
  #  at most, then puts everything back itself.
  # -------------------------------------------------------------------
  pool_guard_alarm:
    alias: "Pool Guard – alarm"
    icon: mdi:alarm-light
    mode: single
    max_exceeded: silent
    variables: *pool_guard_config
    sequence:
      - action: scene.create
        data:
          scene_id: pool_guard_lights
          snapshot_entities: "{{ alarm_lights }}"
      - action: scene.create
        data:
          scene_id: pool_guard_tablets
          snapshot_entities: "{{ tablet_entities }}"
      - variables:
          t0: "{{ now().timestamp() }}"

      - parallel:
          # ---- phone ----
          - repeat:
              for_each: "{{ notify_targets }}"
              sequence:
                - action: "{{ repeat.item }}"
                  data:
                    title: "Pool Guard 🚨"
                    message: "Someone's still at the pool door after the warning. The pool is handling it, politely."
                    data: >-
                      {{ {'push': {'sound': {'name': 'default', 'critical': 1, 'volume': 1.0}}}
                         if push_level == 'critical'
                         else {'push': {'interruption-level': push_level}} }}
                  continue_on_error: true

          # ---- tablets: wake up, warning page ----
          - repeat:
              for_each: "{{ tablets }}"
              sequence:
                - action: switch.turn_on
                  target:
                    entity_id: "switch.{{ repeat.item }}_screen"
                  continue_on_error: true
                - action: switch.turn_off
                  target:
                    entity_id: "switch.{{ repeat.item }}_screensaver"
                  continue_on_error: true
                - action: number.set_value
                  target:
                    entity_id: "number.{{ repeat.item }}_screen_brightness"
                  data:
                    value: 255
                  continue_on_error: true
                - action: fully_kiosk.load_url
                  target:
                    device_id: "{{ device_id('switch.' ~ repeat.item ~ '_screen') }}"
                  data:
                    url: "{{ base_url }}/tablet.html?v={{ media_version }}&state=alert&t0={{ (t0 * 1000) | int }}"
                  continue_on_error: true

          # ---- pool + sitting-area bulbs: dim warm glow ----
          - action: light.turn_on
            target:
              entity_id: "{{ white_bulbs }}"
            data: "{{ d_white_dim }}"
            continue_on_error: true

          # ---- strips: red, two sets swapping (absolute clock, no drift) ----
          - repeat:
              for_each: "{{ range(((max_minutes * 60 + 60) / pulse_period) | int) | list }}"
              sequence:
                - delay:
                    milliseconds: "{{ [0, ((t0 + repeat.item * pulse_period - now().timestamp()) * 1000) | int] | max }}"
                - parallel:
                    - action: light.turn_on
                      target:
                        entity_id: "{{ strips_a }}"
                      data: "{{ d_red_hi if repeat.item is even else d_red_lo }}"
                      continue_on_error: true
                    - action: light.turn_on
                      target:
                        entity_id: "{{ strips_b }}"
                      data: "{{ d_red_lo if repeat.item is even else d_red_hi }}"
                      continue_on_error: true

      # Only reached if nobody turned the alarm off in time
      - action: script.turn_on
        target:
          entity_id: script.pool_guard_restore
        data:
          variables:
            cancelled: true
            clear: false

  # -------------------------------------------------------------------
  #  RESTORE: lights back the way they were, tablets back to the dashboard
  #  (via the "All clear" page when clear is true)
  # -------------------------------------------------------------------
  pool_guard_restore:
    alias: "Pool Guard – restore"
    icon: mdi:restore
    mode: single
    max_exceeded: silent
    fields:
      cancelled:
        description: "True when the red pulse was cut off mid-way (lights get warm white first)"
        example: true
      clear:
        description: "Show the All clear page on the tablets before their dashboard"
        example: true
    variables: *pool_guard_config
    sequence:
      - parallel:
          # ---- lights: (neutral), snapshot, then two verify passes ----
          - sequence:
              - if:
                  - "{{ cancelled | default(true) | bool }}"
                then:
                  - delay:
                      seconds: 1     # let an in-flight Govee command land
                  - action: light.turn_on
                    target:
                      entity_id: "{{ alarm_lights }}"
                    data: "{{ d_end }}"
                    continue_on_error: true
                  - delay:
                      seconds: 2.5   # Govee budget
              - action: scene.turn_on
                target:
                  entity_id: scene.pool_guard_lights
                data:
                  transition: 1
                continue_on_error: true
              - repeat:
                  for_each: [4, 4]
                  sequence:
                    - delay:
                        seconds: "{{ repeat.item }}"
                    - action: scene.turn_on
                      target:
                        entity_id: scene.pool_guard_lights
                      continue_on_error: true

          # ---- tablets ----
          - sequence:
              - if:
                  - "{{ clear | default(false) | bool }}"
                then:
                  - repeat:
                      for_each: "{{ tablets }}"
                      sequence:
                        - action: fully_kiosk.load_url
                          target:
                            device_id: "{{ device_id('switch.' ~ repeat.item ~ '_screen') }}"
                          data:
                            url: "{{ base_url }}/tablet.html?v={{ media_version }}&state=clear"
                          continue_on_error: true
                  - delay:
                      seconds: "{{ tablet_clear_secs }}"
              - repeat:
                  for_each: "{{ tablets }}"
                  sequence:
                    - action: button.press
                      target:
                        entity_id: "button.{{ repeat.item }}_load_start_url"
                      continue_on_error: true
              - action: scene.turn_on
                target:
                  entity_id: scene.pool_guard_tablets
                continue_on_error: true

  # -------------------------------------------------------------------
  #  STOP: end everything now and put it all back (Pool Guard turned off,
  #  or by hand after a test)
  # -------------------------------------------------------------------
  pool_guard_stop:
    alias: "Pool Guard – stop"
    icon: mdi:stop-circle-outline
    mode: single
    sequence:
      - variables:
          alarm_was_on: "{{ is_state('script.pool_guard_alarm', 'on') }}"
      - action: script.turn_off
        target:
          entity_id:
            - script.pool_guard_run
            - script.pool_guard_alarm
            - script.pool_guard_say
            - script.pool_guard_sample
      - if:
          - "{{ alarm_was_on }}"
        then:
          - action: script.turn_on
            target:
              entity_id: script.pool_guard_restore
            data:
              variables:
                cancelled: true
                clear: false

  # -------------------------------------------------------------------
  #  SAMPLE: hear both voices and the sounds (also caches those lines)
  # -------------------------------------------------------------------
  pool_guard_sample:
    alias: "Pool Guard – sample the voices"
    icon: mdi:account-voice
    mode: single
    max_exceeded: silent
    variables: *pool_guard_config
    sequence:
      - action: script.pool_guard_say
        data:
          speakers: "{{ sonos_pool }}"
          clips: >-
            {{ [chime_clip, warn_lines | random, siren_clip,
                alarm_lines | selectattr('voice', 'eq', 'yell') | list | random,
                {'file': 'thanks.mp3', 'secs': 1.55}, thanks_lines | random] }}
          level: "{{ (volume_night if (now().hour >= 20 or now().hour < 7) else volume_day).pool }}"

  # -------------------------------------------------------------------
  #  SAY: play clips in order on some Sonos speakers (announce: plays over
  #  whatever's on, then the music carries on at its own volume)
  # -------------------------------------------------------------------
  pool_guard_say:
    alias: "Pool Guard – say"
    icon: mdi:bullhorn
    mode: parallel
    max: 10
    fields:
      speakers:
        description: "Sonos media players"
      clips:
        description: "List of {file, secs} or {say, voice}"
      level:
        description: "Sonos volume 0–100"
    variables: *pool_guard_config
    sequence:
      - repeat:
          for_each: "{{ clips }}"
          sequence:
            - variables:
                clip: "{{ repeat.item }}"
                started: "{{ now().timestamp() }}"
                voice: "{{ {'pool': voice_pool, 'yell': voice_yell}.get(clip.voice | default(''), '') }}"
                url: >-
                  {%- if clip.file is defined -%}
                    {{ base_url }}/{{ clip.file }}?v={{ media_version }}
                  {%- else -%}
                    media-source://tts/{{ tts_engine }}?message={{ clip.say | urlencode }}&language={{ tts_language }}&cache=true
                    {%- if voice %}&voice={{ voice | urlencode }}{% endif -%}
                  {%- endif -%}
                secs: >-
                  {{ (clip.secs + clip_lead) if clip.file is defined
                     else ((clip.say.split() | count) / wps + tts_lead) }}
            - action: media_player.play_media
              target:
                entity_id: "{{ speakers }}"
              data:
                media_content_id: "{{ url }}"
                media_content_type: music
                announce: true
                extra:
                  volume: "{{ level | int }}"
              continue_on_error: true
            - delay:
                milliseconds: "{{ [0, ((started + secs - now().timestamp()) * 1000) | int] | max }}"

automation:
  # Motion at the pool door while Pool Guard is on → start
  - id: pool_guard_motion
    alias: "Pool Guard – motion at the pool door"
    description: "Starts the polite pool. See packages/pool_guard.yaml."
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        from: "off"
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.pool_guard
        state: "on"
    actions:
      - action: script.turn_on
        target:
          entity_id: script.pool_guard_run

  # Turned off → stop everything and put it back
  - id: pool_guard_off
    alias: "Pool Guard – turned off"
    description: "Stops Pool Guard and restores the lights and tablet. See packages/pool_guard.yaml."
    mode: single
    triggers:
      - trigger: state
        entity_id: input_boolean.pool_guard
        from: "on"
        to: "off"
    actions:
      - action: script.pool_guard_stop

  # On, but the sensor can't see the door → tell the phones
  - id: pool_guard_sensor_offline
    alias: "Pool Guard – motion sensor offline"
    description: "Phone push when Pool Guard is on and the solarium motion sensor is offline. See packages/pool_guard.yaml."
    mode: single
    variables: *pool_guard_config
    triggers:
      - trigger: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        to: ["unavailable", "unknown"]
        for:
          minutes: 5
      - trigger: state
        entity_id: input_boolean.pool_guard
        to: "on"
    conditions:
      - condition: state
        entity_id: input_boolean.pool_guard
        state: "on"
      - condition: state
        entity_id: binary_sensor.hue_motion_sensor_2_motion
        state: ["unavailable", "unknown"]
    actions:
      - repeat:
          for_each: "{{ notify_targets }}"
          sequence:
            - action: "{{ repeat.item }}"
              data:
