# Live copy of the "Tablet" dashboard (/isaac-lucas),
# exported nightly by git-backup.sh. Edit the dashboard in Home Assistant;
# changes made here are overwritten.
title: Home
kiosk_mode:
  hide_sidebar: true
sidebar:
  date: true
  dateFormat: dddd, MMMM Do
  clock: false
  digitalClock: true
  twelveHourVersion: true
  period: true
  hideTopMenu: true
  showTopMenuOnMobile: true
  width:
    mobile: 0
    tablet: 25
    desktop: 18.5
  breakpoints:
    mobile: 768
    tablet: 1024
  style: |
    h2.date {
       font-size: 16px !important;
     }
    h1.digitalClock {
       font-size: 40px !important;
       line-height: 40px !important;
     }
     :host {
        --face-color: #EFEEE5;
        --face-border-color: #EFEEE5;
        --clock-hands-color: #221B15;
        --clock-seconds-hand-color: var(--error-color);
        --clock-middle-background: #EFEEE5;
        --clock-middle-border: #221B15;
      }
    .bottom > * {
       flex: 1 1 auto !important;
       min-width: 0;
     }
  sidebarMenu:
    - action: navigate
      navigation_path: /isaac-lucas/home
      name: Home
      active: true
      icon: mdi:home
    - action: navigate
      navigation_path: /isaac-lucas/music
      name: Music
      active: true
      icon: mdi:music-note-outline
    - action: navigate
      navigation_path: /isaac-lucas/main-floor
      name: Living Areas
      active: true
      icon: mdi:lamps-outline
    - action: navigate
      navigation_path: /isaac-lucas/lighting
      name: Lighting
      active: true
      icon: mdi:lightbulb-auto-outline
    - action: navigate
      navigation_path: /isaac-lucas/cleaning
      name: Cleaning
      active: true
      icon: mdi:broom
    - action: navigate
      navigation_path: /isaac-lucas/weather
      name: Weather
      active: true
      icon: mdi:sun-angle-outline
    - action: navigate
      navigation_path: /isaac-lucas/meals
      name: Meals
      active: true
      icon: mdi:silverware-fork-knife
    - action: navigate
      navigation_path: /isaac-lucas/settings
      name: Settings
      active: true
      icon: mdi:cog-outline
  bottomCard:
    type: vertical-stack
    cardOptions:
      cards:
        - type: custom:bubble-card
          card_type: separator
          card_layout: large
          styles: |-
            .bubble-line {
                background: var(--primary-text-color);
                opacity: 0 !important;
            }
        - type: custom:mushroom-legacy-template-card
          primary: |
            {% set exclude = [
              "light.great_room",
              "light.kitchen",
              "light.mudroom",
              "light.office",
              "light.white_room",
              "light.great_room_diffuser_nightlight",
              "light.front_foyer_diffuser_nightlight"
            ] %}
            {{ states.light
              | rejectattr('entity_id', 'in', exclude)
              | rejectattr('entity_id', 'search', 'segment_\d+$')
              | selectattr('attributes.is_hue_group', 'undefined')
              | selectattr('attributes.entity_id', 'undefined')
              | selectattr('state', 'eq', 'on')
              | list
              | count
            }} Lights On
          icon: ''
          entity: light.all_lights
          layout: vertical
          tap_action:
            action: more-info
          hold_action:
            action: more-info
          icon_color: ''
          card_mod:
            style: |
              ha-card {
                --card-primary-font-size: 18px;
                --card-secondary-font-size: 14px;
                background: rgba(239, 238, 229, 0.10);
                border: 1px solid rgba(239, 238, 229, 0.28);
                border-radius: 12px;
                color: #EFEEE5;
                --paper-item-icon-color: #EFEEE5;
                --card-height: 46px;
                --chip-font-size: 14px;
              }
        - type: custom:bubble-card
          card_type: separator
          styles: |-
            .bubble-line {
                background: var(--primary-text-color);
                opacity: 0;
            }
        - show_name: true
          show_icon: true
          name: All off
          icon_height: 28px
          type: button
          entity: scene.off
          tap_action:
            action: call-service
            service: scene.turn_on
            service_data:
              entity_id: scene.off
          card_mod:
            style: |
              ha-card {
                background: rgba(239, 238, 229, 0.10);
                border: 1px solid rgba(239, 238, 229, 0.28);
                border-radius: 12px;
                color: #EFEEE5;
                --paper-item-icon-color: #EFEEE5;
                --state-icon-color: #EFEEE5;
                font-weight: 500;
              }
button_card_templates:
  music_base:
    show_icon: false
    show_name: false
    show_state: false
    show_label: false
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    styles:
      card:
        - background: none
        - box-shadow: none
        - border: none
        - border-radius: 0
        - padding: 0
        - overflow: visible
        - font-family: var(--ha-font-family-body)
  music_icon_button:
    template: music_base
    show_icon: true
    size: 26px
    styles:
      card:
        - width: 44px
        - height: 44px
        - border-radius: 50%
      icon:
        - color: var(--primary-text-color)
  music_now:
    template: music_base
    entity: media_player.now_playing
    triggers_update:
      - sensor.music_now_playing
    custom_fields:
      art: |
        [[[
          const p = entity?.attributes?.entity_picture;
          const bg = p ? `url('${p}') center / cover no-repeat` : 'var(--secondary-background-color)';
          const icon = p ? '' : '<ha-icon icon="mdi:music" style="--mdc-icon-size: 22px; color: var(--secondary-text-color)"></ha-icon>';
          return `<div style="width: 56px; height: 56px; border-radius: 8px; background: ${bg}; display: flex; align-items: center; justify-content: center">${icon}</div>`;
        ]]]
      title: '[[[ return entity?.attributes?.media_title || "" ]]]'
      sub: |
        [[[
          const a = entity?.attributes || {};
          return a.media_artist || a.media_channel || a.media_album_name || '';
        ]]]
      rooms:
        card:
          type: custom:button-card
          template: music_base
          entity: sensor.music_now_playing
          show_name: true
          name: |
            [[[
              const a = entity?.attributes || {};
              const more = (a.members || []).length > 1;
              return `${a.group_name || ''}${more ? '<ha-icon icon="mdi:chevron-down" style="--mdc-icon-size: 16px; margin-left: 2px"></ha-icon>' : ''}`;
            ]]]
          tap_action:
            action: '[[[ return (entity?.attributes?.members || []).length > 1 ? "navigate" : "none" ]]]'
            navigation_path: '#music_rooms'
          styles:
            card:
              - width: auto
            name:
              - font-size: 12px
              - font-weight: 500
              - color: var(--primary-color)
              - display: flex
              - align-items: center
              - justify-self: start
      pp:
        card:
          type: custom:button-card
          template: music_icon_button
          entity: media_player.now_playing
          icon: '[[[ return entity?.state === "playing" ? "mdi:pause" : "mdi:play" ]]]'
          tap_action:
            action: perform-action
            perform_action: media_player.media_play_pause
            target:
              entity_id: media_player.now_playing
      nx:
        card:
          type: custom:button-card
          template: music_icon_button
          entity: media_player.now_playing
          icon: mdi:skip-next
          tap_action:
            action: perform-action
            perform_action: media_player.media_next_track
            target:
              entity_id: media_player.now_playing
    styles:
      card:
        - padding: 12px 12px 4px
      grid:
        - grid-template-areas: '"art title pp nx" "art sub pp nx" "art rooms pp nx"'
        - grid-template-columns: 56px minmax(0, 1fr) 44px 44px
        - grid-template-rows: auto auto auto
        - column-gap: 12px
        - align-items: center
      custom_fields:
        title:
          - justify-self: start
          - max-width: 100%
          - overflow: hidden
          - text-overflow: ellipsis
          - white-space: nowrap
          - font-size: 14px
          - font-weight: 500
          - color: var(--primary-text-color)
        sub:
          - justify-self: start
          - max-width: 100%
          - overflow: hidden
          - text-overflow: ellipsis
          - white-space: nowrap
          - font-size: 12px
          - color: var(--secondary-text-color)
        rooms:
          - justify-self: start
  music_empty:
    template: music_base
    entity: sensor.music_now_playing
    custom_fields:
      art: |
        [[[ return '<div style="width: 56px; height: 56px; border-radius: 8px; background: var(--secondary-background-color); display: flex; align-items: center; justify-content: center"><ha-icon icon="mdi:music" style="--mdc-icon-size: 22px; color: var(--secondary-text-color)"></ha-icon></div>'; ]]]
      title: Nothing playing
      sub: Pick a favorite to start
    styles:
      card:
        - padding: 12px 12px 4px
      grid:
        - grid-template-areas: '"art title" "art sub"'
        - grid-template-columns: 56px minmax(0, 1fr)
        - column-gap: 12px
        - align-items: center
      custom_fields:
        title:
          - justify-self: start
          - align-self: end
          - font-size: 14px
          - font-weight: 500
          - color: var(--primary-text-color)
        sub:
          - justify-self: start
          - align-self: start
          - font-size: 12px
          - color: var(--secondary-text-color)
  music_hint:
    template: music_base
    entity: sensor.music_now_playing
    variables:
      path: ''
    show_name: true
    name: |
      [[[
        const o = entity?.attributes?.others || [];
        if (!o.length) return '';
        const t = o.length === 1 ? `${o[0]} is playing something else` : `${o.length} other rooms are playing`;
        return variables.path ? `${t}<ha-icon icon="mdi:chevron-right" style="--mdc-icon-size: 16px"></ha-icon>` : t;
      ]]]
    tap_action:
      action: '[[[ return variables.path ? "navigate" : "none" ]]]'
      navigation_path: '[[[ return variables.path ]]]'
    styles:
      card:
        - display: '[[[ return (entity?.attributes?.others || []).length ? "block" : "none" ]]]'
        - padding: 0 12px 4px
      name:
        - font-size: 12px
        - color: var(--secondary-text-color)
        - display: flex
        - align-items: center
        - justify-self: start
  music_fav_head:
    template: music_base
    entity: sensor.music_now_playing
    triggers_update:
      - sensor.sonos_favorites
    custom_fields:
      l: Favorites
      r: '[[[ return `Plays on ${entity?.attributes?.target_name || "Kitchen"}` ]]]'
    styles:
      card:
        - display: '[[[ return Object.keys(states["sensor.sonos_favorites"]?.attributes?.items || {}).length ? "block" : "none" ]]]'
        - padding: 12px 12px 8px
      grid:
        - grid-template-areas: '"l r"'
        - grid-template-columns: auto minmax(0, 1fr)
        - column-gap: 8px
      custom_fields:
        l:
          - justify-self: start
          - font-size: 12px
          - color: var(--secondary-text-color)
        r:
          - justify-self: end
          - max-width: 100%
          - overflow: hidden
          - text-overflow: ellipsis
          - white-space: nowrap
          - font-size: 12px
          - color: var(--secondary-text-color)
  music_fav:
    template: music_base
    entity: sensor.sonos_favorites
    triggers_update:
      - sensor.music_now_playing
    variables:
      i: 0
      tint: var(--cyan-color)
    custom_fields:
      tile: |
        [[[ return `<div style="aspect-ratio: 1 / 1; width: 100%; border-radius: 8px; background: ${variables.tint}; display: flex; align-items: center; justify-content: center"><ha-icon icon="mdi:playlist-music" style="--mdc-icon-size: 22px; color: var(--text-primary-color)"></ha-icon></div>`; ]]]
      nm: |
        [[[
          const it = Object.entries(entity?.attributes?.items || {});
          return it[variables.i] ? it[variables.i][1] : '';
        ]]]
    tap_action:
      action: perform-action
      perform_action: media_player.play_media
      target:
        entity_id: '[[[ return states["sensor.music_now_playing"]?.attributes?.target || "media_player.sonos_kitchen"; ]]]'
      data:
        media_content_type: favorite_item_id
        media_content_id: |
          [[[
            const it = Object.entries(entity?.attributes?.items || {});
            return it[variables.i] ? it[variables.i][0] : '';
          ]]]
    styles:
      card:
        - display: '[[[ return Object.keys(entity?.attributes?.items || {}).length > variables.i ? "block" : "none" ]]]'
      grid:
        - grid-template-areas: '"tile" "nm"'
        - grid-template-columns: minmax(0, 1fr)
        - row-gap: 4px
      custom_fields:
        tile:
          - width: 100%
        nm:
          - justify-self: start
          - max-width: 100%
          - overflow: hidden
          - text-overflow: ellipsis
          - white-space: nowrap
          - font-size: 12px
          - color: var(--primary-text-color)
views:
  - path: home
    title: Home
    type: custom:grid-layout
    layout:
      grid-template-columns: 32% 35% 33%
      grid-template-rows: auto
      grid-template-areas: |
        "weather lights lights"
        "weather sonos calendar"
      mediaquery:
        '(max-width: 1200px)':
          grid-template-columns: 100%
          grid-template-rows: auto auto auto auto
          grid-template-areas: |
            "lights"
            "weather"
            "sonos"
            "calendar"
    icon: mdi:home
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:weather-cloudy
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Weather
          - type: custom:clock-weather-card
            entity: weather.openweathermap
            tap_action:
              action: navigate
              navigation_path: /isaac-lucas/weather
            sections:
              header:
                weather_icon_size: 8rem
                rows:
                  - font_size: 4rem
                    segments:
                      - type: weather
                        attribute: temperature
                        unit: °
                    alignment: center
                  - font_size: 1.2rem
                    segments:
                      - type: weather
                      - type: spacer
                      - type: icon
                        icon: mdi:weather-windy
                      - type: template
                        template: '{{ state_attr(''weather.openweathermap'',''wind_speed'') | round(0) | int }} mph'
                  - font_size: 1.1rem
                    segments:
                      - type: icon
                        icon: mdi:water-percent
                      - type: weather
                        attribute: humidity
                      - type: spacer
                      - type: icon
                        icon: mdi:leaf
                      - type: template
                        template: '{{ states(''sensor.u_s_air_pollution_level'') | replace(''_'','' '') | title }} ({{ states(''sensor.u_s_air_quality_index'') }})'
                weather_icon_type: fill
              forecast_strip:
                weather_entity: weather.kpsm
                time_pattern: h a
                weather_icon_type: fill
                count: 5
              forecast_list:
                weather_entity: weather.kpsm
                row_height: 32px
                weather_icon_type: fill
            weather_icon_type: fill
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:hockey-sticks
            name: Andrew
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
          - type: glance
            show_name: false
            show_icon: true
            show_state: true
            entities:
              - entity: person.andrew
                tap_action:
                  action: navigate
                  navigation_path: '#phone_locator'
              - entity: sensor.andrews_phone_battery_level
              - entity: sensor.andrews_phone_steps
            columns: 3
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 12px;
                } 
                .entities.no-header {
                  padding-top: 0px !important;
                }
                .entity div {
                  font-size: 14px;
                  font-weight: 500;
                }
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:horse-human
            name: Christina
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
          - show_name: false
            show_icon: true
            show_state: true
            type: glance
            entities:
              - entity: person.christina
                tap_action:
                  action: navigate
                  navigation_path: '#phone_locator'
              - entity: sensor.christina_s_iphone_battery_level
              - entity: sensor.christina_s_iphone_steps
            columns: 3
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 12px;
                } 
                .entities.no-header {
                  padding-top: 0px !important;
                }
                .entity div {
                  font-size: 14px;
                  font-weight: 500;
                }
        view_layout:
          grid-area: weather
      - type: vertical-stack
        view_layout:
          grid-area: calendar
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:calendar
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Calendar
          - type: custom:atomic-calendar-revive
            name: Upcoming Schedule
            enableModeChange: true
            entities:
              - calendar.family
              - calendar.andrew
              - calendar.henry
              - calendar.charlotte
              - calendar.christina
              - calendar.location
              - calendar.holidays_in_united_states
            firstDayOfWeek: 1
            maxDaysToShow: 3
            refreshInterval: 60
            calShowDescription: true
            showLastCalendarWeek: false
            showNoEventsForToday: true
            showCurrentEventLine: false
            showMonth: true
            showWeekDay: true
            showEventIcon: true
            showCalendarName: true
            showEventDate: true
            showDescription: false
            disableLocationLink: false
            showFullDayProgress: false
            showWeekNumber: false
            showDatePerEvent: false
            showProgressBar: true
            disableEventLink: false
            showTimeRemaining: false
            sortByStartTime: true
            showDate: false
            noEventText: No activities today!
            showRelativeTime: false
            showMultiDay: false
            card_mod:
              style: |
                ha-card {
                  font-size: 14px;
                  border: 1px solid var(--divider-color);
                  border-radius: 12px;
                  background: var(--ha-card-background);
                }
                .event-title {
                  font-weight: 500;
                }
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:palette-outline
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Scenes
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: script.morning
                name: Wake Up
                icon: mdi:weather-sunset-up
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.morning
                show_state: false
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: scene.normal
                name: Normal
                icon: mdi:home-outline
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.normal
                show_state: false
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: scene.cooking
                name: Cooking
                icon: mdi:chef-hat
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.cooking
                show_state: false
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: scene.dinner
                name: Dinner
                icon: mdi:food
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.dinner
                show_state: false
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: scene.relax
                name: Relax
                icon: mdi:sofa
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.relax
                show_state: false
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: script.lighting_wind_down
                name: Wind Down
                icon: mdi:weather-night
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.lighting_wind_down
                show_state: false
              - type: custom:bubble-card
                card_type: button
                styles: |
                  .bubble-name {
                    font-size: 14px;
                    font-weight: 500;
                  }
                button_type: custom
                entity: script.bedtime
                name: Bedtime
                icon: mdi:bed
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.bedtime
                show_state: false
              - type: custom:bubble-card
                card_type: empty-column
        view_layout:
          grid-area: lights
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:music-note-outline
            name: Music
            styles: |
              ha-card {
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
          - type: custom:stack-in-card
            cards:
              - type: conditional
                conditions:
                  - condition: state
                    entity: sensor.music_now_playing
                    state_not: none
                card:
