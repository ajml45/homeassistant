title: Home
kiosk_mode:
  hide_sidebar: true
sidebar:
  date: true
  dateFormat: dddd, MMMM Do
  clock: false
  digitalClock: true
  twelveHourVersion: true
  period: true
  hideTopMenu: true
  showTopMenuOnMobile: true
  width:
    mobile: 0
    tablet: 25
    desktop: 18.5
  breakpoints:
    mobile: 768
    tablet: 1024
  style: |
    h2.date {
       font-size: 16px !important;
     }
    h1.digitalClock {
       font-size: 40px !important;
       line-height: 40px !important;
     }
     :host {
        --face-color: #EFEEE5;
        --face-border-color: #EFEEE5;
        --clock-hands-color: #221B15;
        --clock-seconds-hand-color: var(--error-color);
        --clock-middle-background: #EFEEE5;
        --clock-middle-border: #221B15;
      }
  sidebarMenu:
    - action: navigate
      navigation_path: /isaac-lucas/home
      name: Home
      active: true
      icon: mdi:home
    - action: navigate
      navigation_path: /isaac-lucas/music
      name: Music
      active: true
      icon: mdi:music-note-outline
    - action: navigate
      navigation_path: /isaac-lucas/main-floor
      name: Living Areas
      active: true
      icon: mdi:lamps-outline
    - action: navigate
      navigation_path: /isaac-lucas/bob-squad-hq
      name: Cameras
      active: true
      icon: mdi:cctv
    - action: navigate
      navigation_path: /isaac-lucas/weather
      name: Weather
      active: true
      icon: mdi:sun-angle-outline
    - action: navigate
      navigation_path: /isaac-lucas/meals
      name: Meals
      active: true
      icon: mdi:silverware-fork-knife
    - action: navigate
      navigation_path: /isaac-lucas/settings
      name: Settings
      active: true
      icon: mdi:cog-outline
  bottomCard:
    type: vertical-stack
    cardOptions:
      cards:
        - type: custom:bubble-card
          card_type: separator
          card_layout: large
          styles: |-
            .bubble-line {
                background: var(--primary-text-color);
                opacity: 0 !important;
            }
        - type: custom:mushroom-legacy-template-card
          primary: |
            {% set exclude = [
              "light.great_room",
              "light.kitchen",
              "light.mudroom",
              "light.office",
              "light.white_room",
              "light.first_floor_lights"
            ] %}
            {{ states.light
              | rejectattr('entity_id', 'in', exclude)
              | rejectattr('entity_id', 'search', 'segment_\d+$')
              | selectattr('attributes.is_hue_group', 'undefined')
              | selectattr('attributes.entity_id', 'undefined')
              | selectattr('state', 'eq', 'on')
              | list
              | count
            }} Lights On
          icon: ''
          entity: light.first_floor_lights
          layout: vertical
          tap_action:
            action: more-info
          hold_action:
            action: more-info
          icon_color: ''
          card_mod:
            style: |
              ha-card {
                --card-primary-font-size: 18px;
                --card-secondary-font-size: 14px;
                background: rgba(239, 238, 229, 0.10);
                border: 1px solid rgba(239, 238, 229, 0.28);
                border-radius: 12px;
                color: #EFEEE5;
                --paper-item-icon-color: #EFEEE5;
                --card-height: 46px;
                --chip-font-size: 14px;
              }
        - type: custom:bubble-card
          card_type: separator
          styles: |-
            .bubble-line {
                background: var(--primary-text-color);
                opacity: 0;
            }
        - show_name: false
          show_icon: true
          type: button
          entity: scene.off
          tap_action:
            action: call-service
            service: scene.turn_on
            service_data:
              entity_id: scene.off
          card_mod:
            style: |
              ha-card {
                background: rgba(239, 238, 229, 0.10);
                border: 1px solid rgba(239, 238, 229, 0.28);
                border-radius: 12px;
                color: #EFEEE5;
                --paper-item-icon-color: #EFEEE5;
              }
views:
  - path: home
    title: Home
    type: custom:grid-layout
    layout:
      grid-template-columns: 32% 35% 33%
      grid-template-rows: auto
      grid-template-areas: |
        "weather lights lights"
        "weather sonos calendar"
        "family sonos calendar"
      mediaquery:
        '(max-width: 1200px)':
          grid-template-columns: 100%
          grid-template-rows: auto auto auto auto auto
          grid-template-areas: |
            "lights"
            "weather"
            "family"
            "sonos"
            "calendar"
    icon: mdi:home
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:weather-cloudy
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Weather
          - type: custom:clock-weather-card
            entity: weather.openweathermap
            sun_entity: sun.sun
            temperature_sensor: sensor.outdoor_temp
            weather_icon_type: line
            animated_icon: true
            forecast_rows: 4
            locale: en-US
            time_format: 12
            date_pattern: DDDD
            hide_today_section: false
            hide_forecast_section: false
            hide_clock: true
            hide_date: true
            hourly_forecast: false
            show_humidity: true
            style: |
              ha-card {
                border: 1px solid var(--divider-color);
                border-radius: 12px;
                color: var(--primary-text-color) !important;
                background: var(--ha-card-background);
                --secondary-background-color: var(--divider-color);
              } 
        view_layout:
          grid-area: weather
      - type: vertical-stack
        view_layout:
          grid-area: calendar
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:calendar
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Calendar
          - type: custom:atomic-calendar-revive
            name: Upcoming Schedule
            enableModeChange: true
            entities:
              - calendar.family
              - calendar.andrew
              - calendar.henry
              - calendar.charlotte
              - calendar.christina
              - calendar.location
              - calendar.holidays_in_united_states
            firstDayOfWeek: 1
            maxDaysToShow: 7
            refreshInterval: 60
            calShowDescription: true
            showLastCalendarWeek: false
            showNoEventsForToday: true
            showCurrentEventLine: false
            showMonth: true
            showWeekDay: true
            showEventIcon: true
            showCalendarName: true
            showEventDate: true
            showDescription: false
            disableLocationLink: false
            showFullDayProgress: false
            showWeekNumber: false
            showDatePerEvent: false
            showProgressBar: true
            disableEventLink: false
            showTimeRemaining: false
            sortByStartTime: true
            showDate: false
            noEventText: No activities today!
            showRelativeTime: false
            showMultiDay: false
            cardHeight: 570px
            style: |
              ha-card {
                border: 1px solid var(--divider-color);
                border-radius: 12px;
                background: var(--ha-card-background);
              } 
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:palette-outline
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Scenes
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: script.morning
                name: Wake Up
                icon: mdi:weather-sunset-up
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.morning
                show_state: false
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: scene.normal
                name: Normal
                icon: mdi:home-outline
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.normal
                show_state: false
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: scene.cooking
                name: Cooking
                icon: mdi:chef-hat
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.cooking
                show_state: false
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: scene.dinner
                name: Dinner
                icon: mdi:food
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.dinner
                show_state: false
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: scene.relax
                name: Relax
                icon: mdi:sofa
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.relax
                show_state: false
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: script.bedtime
                name: Bedtime
                icon: mdi:bed
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: script.turn_on
                  service_data:
                    entity_id: script.bedtime
                show_state: false
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: scene.master_bedtime
                name: Master Bedtime
                icon: mdi:bed-king
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.master_bedtime
                show_state: false
              - type: custom:bubble-card
                card_type: button
                button_type: custom
                entity: scene.party
                name: Party
                icon: mdi:party-popper
                button_tap_action: false
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  service_data:
                    entity_id: scene.party
                show_state: false
        view_layout:
          grid-area: lights
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:music-note-outline
            name: Music
            styles: |
              ha-card {
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
          - type: custom:sonos-card
            sections:
              - player
              - grouping
              - volumes
            entities:
              - media_player.sonos_great_room_soundbar
              - media_player.sonos_kitchen
              - media_player.sonos_office
              - media_player.sonos_solarium
              - media_player.sonos_basement
              - media_player.sonos_workshop
              - media_player.sonos_garage
            entityNameRegexToReplace: '^Sonos '
            entityNameReplacement: ''
            storePlayerInSessionStorage: true
            fontFamily: '''Libre Franklin'', system-ui, sans-serif'
            baseFontSize: 1.1
            heightPercentage: auto
            dynamicVolumeSlider: true
            footerHeight: 5
            sectionButtonIcons:
              player: mdi:play-circle-outline
            player:
              artworkAsBackgroundBlur: 5
              controlsAndHeaderBackgroundOpacity: 0.7
              artworkBorderRadius: 12
              controlsLargeIcons: true
              showVolumeUpAndDownButtons: true
              hideControlRepeatButton: true
              hideControlShuffleButton: true
              hidePlaylist: true
              fastForwardAndRewindStepSizeSeconds: 30
              showChannel: true
              headerSongFontSize: 1.35
              fallbackArtwork: /local/images/other/tv.jpg
              mediaArtworkOverrides:
                - mediaTitleEquals: TV
                  imageUrl: /local/images/other/tv.jpg
                - sourceRegexp: HDMI.*
                  imageUrl: /local/images/other/tv.jpg
                - ifMissing: true
                  imageUrl: /local/images/other/tv.jpg
            grouping:
              compact: true
              skipApplyButton: true
              hideVolumes: true
              hideUngroupAllButtons: true
              buttonIcons:
                predefinedGroup: mdi:home-sound-in-outline
            predefinedGroups:
              - name: Everywhere
                volume: 15
                unmuteWhenGrouped: true
                entities:
                  - media_player.sonos_great_room_soundbar
                  - media_player.sonos_kitchen
                  - media_player.sonos_office
                  - media_player.sonos_solarium
                  - media_player.sonos_basement
                  - media_player.sonos_workshop
                  - media_player.sonos_garage
              - name: 1st Floor
                volume: 15
                unmuteWhenGrouped: true
                entities:
                  - media_player.sonos_great_room_soundbar
                  - media_player.sonos_kitchen
                  - media_player.sonos_office
              - name: Downstairs
                unmuteWhenGrouped: true
                entities:
                  - player: media_player.sonos_basement
                    volume: 15
                  - player: media_player.sonos_solarium
                    volume: 12
                  - player: media_player.sonos_workshop
                    volume: 25
          - type: horizontal-stack
            cards:
              - show_name: true
                show_icon: true
                type: button
                name: Music Controls
                icon: mdi:tune-vertical
                tap_action:
                  action: navigate
                  navigation_path: /isaac-lucas/music
              - type: button
                show_name: true
                show_icon: true
                name: Find Music
                icon: mdi:magnify
                tap_action:
                  action: navigate
                  navigation_path: '#music_browse'
        view_layout:
          grid-area: sonos
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:hockey-sticks
            name: Andrew
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
          - type: glance
            show_name: false
            show_icon: true
            show_state: true
            entities:
              - entity: person.andrew
                tap_action:
                  action: navigate
                  navigation_path: '#phone_locator'
              - entity: sensor.andrews_phone_battery_level_2
              - entity: sensor.andrews_phone_distance_2
              - entity: sensor.andrews_phone_steps_2
              - entity: sensor.andrew_from_home
                image: local/images/other/frontdoor.jpg
              - entity: sensor.andrew_to_berwick
                image: local/images/other/berwick.jpg
              - entity: sensor.andrew_to_misspattys
                image: local/images/other/miss_pattys.JPG
              - entity: sensor.andrew_to_work
                image: local/images/other/borthwick.jpg
            columns: 4
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 12px;
                } 
                .entities.no-header {
                  padding-top: 0px !important;
                }
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:horse-human
            name: Christina
            styles: |
              ha-card { 
                  color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              h4 {
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
          - show_name: false
            show_icon: true
            show_state: true
            type: glance
            entities:
              - entity: person.christina
                tap_action:
                  action: navigate
                  navigation_path: '#phone_locator'
              - entity: sensor.christina_s_iphone_battery_level
              - entity: sensor.christina_s_iphone_distance
              - entity: sensor.christina_s_iphone_steps
              - entity: sensor.christina_to_home
                image: local/images/other/frontdoor.jpg
              - entity: sensor.christina_to_berwick
                image: local/images/other/berwick.jpg
              - entity: sensor.christina_to_miss_pattys
                image: local/images/other/miss_pattys.JPG
              - entity: sensor.christina_to_boston
                image: local/images/other/liberty_boston.jpg
            columns: 4
            card_mod:
              style: |
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 12px;
                } 
                .entities.no-header {
                  padding-top: 0px !important;
                }
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#music_browse'
        name: Find music
        icon: mdi:magnify
        is_sidebar_hidden: false
        margin_top_mobile: 0px
        margin: 0px
        back_open: true
        margin_top_desktop: -44px
        width_desktop: 1000px
        bg_opacity: 85
        bg_blur: 100
        styles: |
          bubble-card::after {
            display: none !important;
          }
        cards:
          - type: custom:sonos-card
            sections:
              - media browser
              - search
            entities:
              - media_player.sonos_great_room_soundbar
              - media_player.sonos_kitchen
              - media_player.sonos_office
              - media_player.sonos_solarium
              - media_player.sonos_basement
              - media_player.sonos_workshop
              - media_player.sonos_garage
            entityNameRegexToReplace: '^Sonos '
            entityNameReplacement: ''
            storePlayerInSessionStorage: true
            fontFamily: var(--ha-font-family-body)
            baseFontSize: 1.15
            listItemHeight: 3.25
            footerHeight: 3.5
            widthPercentage: 100
            heightPercentage: 100
            sectionButtonIcons:
              mediaBrowser: mdi:bookshelf
            mediaBrowser:
              itemsPerRow: 4
              hideActivePlayerName: false
              hideItems:
                - My media
                - Radio Browser
                - AI Generated Images
                - Frigate
                - Nest
              favorites:
                title: Favorites
                sortByType: true
                hideTitleForThumbnailIcons: true
                iconBorder: 1px solid var(--ha-card-border-color)
                iconPadding: 0.5
            search:
              defaultMediaType: track
              searchLimit: 40
              autoSearchMinChars: 3
              hideActivePlayerName: false
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#mail'
        name: Today's Mail
        icon: mdi:mail
        hide_backdrop: true
        is_sidebar_hidden: false
        margin_top_mobile: 0px
        margin: 0px
        back_open: true
        margin_top_desktop: -44px
        width_desktop: 1000px
        auto_close: '120000'
        bg_opacity: 85
        bg_blur: 100
        styles: |
          bubble-card::after {
            display: none !important;
            }
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mail-and-packages-card
                name: Today's Mail
                details: true
                image: false
                gif_sensor: gif
                updated: sensor.mail_updated
                usps_mail: sensor.mail_usps_mail
                camera: true
                camera_entity: camera.mail_usps_camera
              - type: custom:mail-and-packages-card
                name: Today's Packages
                details: true
                image: false
                camera_entity: camera.mail_amazon_delivery_camera
                amazon_packages: sensor.mail_amazon_packages
                usps_packages: sensor.mail_usps_packages
                ups_packages: sensor.mail_ups_packages
                fedex_packages: sensor.mail_fedex_packages
                updated: sensor.mail_updated
                packages_in_transit: sensor.mail_usps_delivering
                packages_delivered: sensor.mail_amazon_packages_delivered
                deliveries_message: camera.mail_amazon_delivery_camera
      - type: custom:bubble-card
        card_type: pop-up
        hash: '#phone_locator'
        name: Phone Locator
        icon: mdi:format-list-checks
        is_sidebar_hidden: false
        margin_top_mobile: 0px
        margin: 0px
        back_open: true
        margin_top_desktop: -44px
        width_desktop: 1000px
        auto_close: '120000'
        bg_opacity: 85
        bg_blur: 100
        styles: |
          bubble-card::after {
            display: none !important;
            }
        cards:
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Andrew
                styles: |
                  h4 {
                  }

                  ha-card div div div:nth-child(2) {
                        height: 5px!important;
                  }
                icon: mdi:hockey-sticks
              - type: custom:bubble-card
                card_type: button
                entity: script.find_phone_alert_andrew
                icon: phu:apple-iphone
              - type: custom:bubble-card
                card_type: button
                button_type: name
          - type: vertical-stack
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: Christina
                styles: |
                  h4 {
                  }

                  ha-card div div div:nth-child(2) {
                        height: 5px!important;
                  }
                icon: mdi:horse
              - type: custom:bubble-card
                card_type: button
                entity: script.find_iphone_alert_christina
                icon: phu:apple-iphone
              - type: custom:bubble-card
                card_type: button
                button_type: name
  - title: Music
    path: music
    icon: mdi:music-note-outline
    badges: []
    type: custom:grid-layout
    layout:
      grid-template-columns: 30% 40% 30%
      grid-template-rows: auto
      grid-template-areas: |
        "grouping player browse"
      mediaquery:
        '(max-width: 1100px)':
          grid-template-columns: 100%
          grid-template-rows: auto
          grid-template-areas: |
            "player"
            "grouping"
            "browse"
    cards:
      - type: custom:sonos-card
        sections:
          - volumes
          - groups
          - grouping
        entities:
          - media_player.sonos_great_room_soundbar
          - media_player.sonos_kitchen
          - media_player.sonos_office
          - media_player.sonos_solarium
          - media_player.sonos_basement
          - media_player.sonos_workshop
          - media_player.sonos_garage
        entityNameRegexToReplace: '^Sonos '
        entityNameReplacement: ''
        storePlayerInSessionStorage: true
        fontFamily: '''Libre Franklin'', system-ui, sans-serif'
        baseFontSize: 1.15
        listItemHeight: 3.25
        widthPercentage: 100
        dynamicVolumeSlider: true
        heightPercentage: 140
        view_layout:
          grid-area: grouping
        volumes:
          hideCogwheel: true
          labelForAllSlider: All rooms
          hideActivePlayerName: true
        groups:
          compact: true
          hideCurrentTrack: true
        sectionButtonIcons:
          volumes: mdi:tune-vertical
          groups: mdi:speaker-multiple
        grouping:
          skipApplyButton: true
          disableMainSpeakers: true
          buttonFontSize: 1.05
          buttonIcons:
            predefinedGroup: mdi:home-sound-in-outline
            joinAll: mdi:speaker-multiple
            unJoinAll: mdi:speaker-off
        predefinedGroups:
          - name: Everywhere
            volume: 15
            unmuteWhenGrouped: true
            entities:
              - media_player.sonos_great_room_soundbar
              - media_player.sonos_kitchen
              - media_player.sonos_office
              - media_player.sonos_solarium
              - media_player.sonos_basement
              - media_player.sonos_workshop
              - media_player.sonos_garage
          - name: 1st Floor
            volume: 15
            unmuteWhenGrouped: true
            entities:
              - media_player.sonos_great_room_soundbar
              - media_player.sonos_kitchen
