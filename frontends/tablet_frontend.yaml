  - path: weather
    title: Weather
    type: custom:grid-layout
    layout:
      grid-template-columns: 1fr 1.3fr 1fr
      grid-template-rows: auto auto 1fr
      grid-template-areas: |
        "alert alert alert"
        "now   chart chart"
        "now   radar sea"
      grid-gap: 12px
      mediaquery:
        '(max-width: 900px)':
          grid-template-columns: 100%
          grid-template-rows: auto
          grid-template-areas: |
            "alert"
            "now"
            "chart"
            "sea"
            "radar"
    cards:
      - type: conditional
        view_layout:
          grid-area: alert
        conditions:
          - condition: numeric_state
            entity: sensor.nws_alerts
            above: 0
        card:
          type: custom:weather-alerts-card
          entity: sensor.nws_alerts
      - type: custom:clock-weather-card
        entity: weather.openweathermap
        weather_icon_type: fill
        tap_action:
          action: none
        sections:
          header:
            weather_icon_size: 5.5rem
            rows:
              - font_size: 4.5rem
                segments:
                  - type: weather
                    attribute: temperature
                    unit: °
              - font_size: 1.25rem
                segments:
                  - type: weather
              - font_size: 1rem
                segments:
                  - type: text
                    text: Feels
                  - type: weather
                    attribute: apparent_temperature
                    unit: °
              - font_size: 1rem
                segments:
                  - type: icon
                    icon: mdi:weather-windy
                  - type: template
                    template: '{% set w = ''weather.openweathermap'' %}{% set b = state_attr(w,''wind_bearing'') | float(0) %}{% set s = state_attr(w,''wind_speed'') | float(0) | round(0) | int %}{% set g = state_attr(w,''wind_gust_speed'') | float(0) | round(0) | int %}{{ [''N'',''NE'',''E'',''SE'',''S'',''SW'',''W'',''NW''][((b / 45) | round(0) | int) % 8] }} {{ s }}{{ ''–'' ~ g if g > s else '''' }} mph'
              - font_size: 1rem
                segments:
                  - type: icon
                    icon: mdi:water-percent
                  - type: weather
                    attribute: humidity
                  - type: template
                    template: '{% set u = state_attr(''weather.openweathermap'',''uv_index'') %}{% if u is not number %}{% set u = states(''sensor.openweathermap_uv_index'') | float(none) %}{% endif %}{{ ''· UV '' ~ (u | round(0) | int) if u is number else '''' }}'
              - font_size: 1rem
                segments:
                  - type: icon
                    icon: mdi:leaf
                  - type: template
                    template: '{{ states(''sensor.u_s_air_pollution_level'') | replace(''_'','' '') | title }} ({{ states(''sensor.u_s_air_quality_index'') }})'
            weather_icon_type: fill
          forecast_strip:
            hide: true
          forecast_list:
            weather_entity: weather.kpsm
            count: 7
            row_height: 46px
            weather_icon_type: fill
        view_layout:
          grid-area: now
      - type: custom:apexcharts-card
        view_layout:
          grid-area: chart
        graph_span: 48h
        span:
          start: hour
        now:
          show: true
          color: var(--secondary-text-color)
        header:
          show: true
          title: Next 48 hours
          show_states: false
        yaxis:
          - id: temp
            decimals: 0
            min: '|-3|'
            max: '|+3|'
            apex_config:
              tickAmount: 4
          - id: pop
            show: false
            min: 0
            max: 100
        apex_config:
          chart:
            height: 220
          legend:
            show: false
          grid:
            borderColor: rgba(138,141,130,0.35)
            strokeDashArray: 3
          plotOptions:
            bar:
              columnWidth: 70%
              borderRadius: 2
          xaxis:
            labels:
              datetimeFormatter:
                hour: h tt
                day: ddd
          tooltip:
            enabledOnSeries:
              - 1
              - 2
            x:
              format: ddd h tt
        series:
          - entity: sensor.weather_hourly_48h
            name: Night
            type: area
            yaxis_id: pop
            color: var(--primary-text-color)
            opacity: 0.06
            stroke_width: 0
            curve: stepline
            extend_to: false
            show:
              in_header: false
              legend_value: false
            data_generator: |
              return (entity.attributes.forecast || []).map(f => {
                const d = new Date(f.t);
                const night = (f.day === null || f.day === undefined)
                  ? (d.getHours() < 7 || d.getHours() >= 18)
                  : !f.day;
                return [d.getTime(), night ? 100 : null];
              });
          - entity: sensor.weather_hourly_48h
            name: Rain chance
            type: column
            yaxis_id: pop
            color: var(--light-blue-color)
            opacity: 0.6
            unit: '%'
            extend_to: false
            data_generator: |
              return (entity.attributes.forecast || [])
                .map(f => [new Date(f.t).getTime(), f.pop || 0]);
          - entity: sensor.weather_hourly_48h
            name: Temperature
            type: line
            yaxis_id: temp
            color: var(--deep-orange-color)
            stroke_width: 3
            curve: smooth
            unit: °
            extend_to: false
            data_generator: |
              return (entity.attributes.forecast || [])
                .map(f => [new Date(f.t).getTime(), f.temp]);
      - type: custom:weather-radar-card
        map_style: Auto
        zoom_level: 8
        square_map: true
        static_map: false
        show_marker: true
        show_playback: true
        show_scale: false
        show_zoom: false
        show_range: false
        show_recenter: false
        extra_labels: false
        markers:
          - entity: zone.home
        view_layout:
          grid-area: radar
      - type: vertical-stack
        view_layout:
          grid-area: sea
        cards:
          - type: tile
            entity: sensor.tide
            name: Tides
            icon: mdi:waves
            state_content:
              - station
              - state
              - summary
            tap_action:
              action: perform-action
              perform_action: input_select.select_next
              target:
                entity_id: input_select.weather_tide_station
            icon_tap_action:
              action: perform-action
              perform_action: input_select.select_next
              target:
                entity_id: input_select.weather_tide_station
          - type: custom:apexcharts-card
            graph_span: 30h
            span:
              start: hour
              offset: -6h
            now:
              show: true
              color: var(--secondary-text-color)
            header:
              show: false
            yaxis:
              - decimals: 0
                apex_config:
                  tickAmount: 3
            apex_config:
              chart:
                height: 190
              legend:
                show: false
              grid:
                borderColor: rgba(138,141,130,0.35)
                strokeDashArray: 3
              xaxis:
                labels:
                  datetimeFormatter:
                    hour: h tt
                    day: ddd
              tooltip:
                x:
                  format: ddd h:mm tt
            series:
              - entity: sensor.tide
                name: Tide
                type: area
                color: var(--light-blue-color)
                opacity: 0.25
                stroke_width: 2.5
                unit: ' ft'
                extend_to: false
                show:
                  in_header: false
                data_generator: |
                  // smooth cosine curve between NOAA high/low points
                  const p = entity.attributes.chart || [];
                  const out = [];
                  for (let i = 0; i < p.length - 1; i++) {
                    const a = p[i], b = p[i + 1];
                    for (let s = 0; s < 12; s++) {
                      const f = s / 12;
                      out.push([
                        (a.ts + (b.ts - a.ts) * f) * 1000,
                        a.v + (b.v - a.v) * (1 - Math.cos(Math.PI * f)) / 2
                      ]);
                    }
                  }
                  if (p.length) out.push([p[p.length - 1].ts * 1000, p[p.length - 1].v]);
                  return out;
          - type: markdown
            content: '{% set ph = states(''sensor.moon_phase'') %} <ha-icon icon="mdi:weather-sunset-up"></ha-icon> {{ as_timestamp(state_attr(''sun.sun'',''next_rising'')) | timestamp_custom(''%-I:%M %p'') }} &nbsp;&nbsp;&nbsp; <ha-icon icon="mdi:weather-sunset-down"></ha-icon> {{ as_timestamp(state_attr(''sun.sun'',''next_setting'')) | timestamp_custom(''%-I:%M %p'') }} &nbsp;&nbsp;&nbsp; <ha-icon icon="mdi:moon-{{ ph | replace(''_moon'','''') | replace(''_'',''-'') }}"></ha-icon> {{ ph | replace(''_'','' '') | capitalize }}'
