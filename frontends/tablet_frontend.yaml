              ha-card {
                color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                height: 5px!important;
              }
          - type: custom:mushroom-legacy-template-card
            entity: sensor.hue_motion_sensor_1_battery
            icon: mdi:battery-heart-variant
            layout: horizontal
            tap_action:
              action: navigate
              navigation_path: '#batteries'
            primary: |
              {% set ns = namespace(n=0) %}
              {% for s in states.sensor
                   | selectattr('attributes.device_class','defined')
                   | selectattr('attributes.device_class','eq','battery')
                   | rejectattr('entity_id','search','phone|macbook|internal_battery|ha_tablet|dusty_jr|cleanopatra') %}
                {% if s.state | float(101) < 20 %}{% set ns.n = ns.n + 1 %}{% endif %}
              {% endfor %}
              {% set ns.n = ns.n + (states.binary_sensor
                   | selectattr('attributes.device_class','defined')
                   | selectattr('attributes.device_class','eq','battery')
                   | selectattr('state','eq','on') | list | count) %}
              {{ 'All batteries OK' if ns.n == 0
                 else ns.n ~ (' device needs' if ns.n == 1 else ' devices need') ~ ' a new cell' }}
            secondary: Tap for the full list
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              show_header_toggle: false
              card_mod:
                style: |
                  ha-card {
                    background-color: var(--ha-card-background) !important;
                  }
            filter:
              include:
                - domain: sensor
                  attributes:
                    device_class: battery
                  state: < 20
                - domain: binary_sensor
                  attributes:
                    device_class: battery
                  state: 'on'
              exclude:
                - entity_id: '*phone*'
                - entity_id: '*internal_battery*'
                - entity_id: '*ha_tablet*'
                - entity_id: sensor.dusty_jr_battery
                - entity_id: sensor.cleanopatra_battery
            sort:
              method: state
              numeric: true
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:package-up
            name: Updates
            styles: |
              ha-card {
                color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                height: 5px!important;
              }
          - type: custom:mushroom-legacy-template-card
            icon: mdi:package-variant-closed-check
            layout: horizontal
            tap_action:
              action: none
            primary: >
              {% set n = states.update | selectattr('state', 'eq', 'on') | list
              | count %}

              {{ 'Everything up to date' if n == 0
                 else n ~ ' update' ~ ('' if n == 1 else 's') ~ ' available' }}
            secondary: |
              {{ states.update | list | count }} components tracked
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              show_header_toggle: false
              card_mod:
                style: |
                  ha-card {
                    background-color: var(--ha-card-background) !important;
                  }
            filter:
              include:
                - domain: update
                  state: 'on'
            sort:
              method: friendly_name
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:battery-off-outline
            name: Not Reporting
            styles: |
              ha-card {
                color: var(--primary-text-color) !important;
              }
              .separator-container div:last-child {
                background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                height: 5px!important;
              }
          - type: markdown
            content: |
              {% set dead = states.sensor
                   | selectattr('attributes.device_class', 'defined')
                   | selectattr('attributes.device_class', 'eq', 'battery')
                   | selectattr('state', 'eq', 'unavailable')
                   | rejectattr('entity_id', 'search', 'phone|internal_battery|ha_tablet')
                   | list %}
              {% if dead | count == 0 %}
              Everything reporting.
              {% else %}
              {% for s in dead | sort(attribute='name') %}
              **{{ s.name | replace(' Battery', '') | replace(' battery', '')
                          | replace(' Level', '') | replace(' level', '') | trim }}**
              &nbsp;· out {{ relative_time(s.last_changed) }}
              {% endfor %}
              {% endif %}
            card_mod:
