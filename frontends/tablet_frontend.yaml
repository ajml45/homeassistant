                  icon_color: accent
                  content: Matic{{ ' · ' ~ states('sensor.matic_current_area') if has_value('sensor.matic_current_area') }}
                  tap_action:
                    action: more-info
                    entity: vacuum.matic
              - type: conditional
                conditions:
                  - condition: state
                    entity: vacuum.dusty_jr
                    state: cleaning
                chip:
                  type: template
                  icon: mdi:robot-vacuum
                  icon_color: accent
                  content: Dusty Jr cleaning
                  tap_action:
                    action: more-info
                    entity: vacuum.dusty_jr
              - type: conditional
                conditions:
                  - condition: state
                    entity: vacuum.jar_jar
                    state: cleaning
                chip:
                  type: template
                  icon: mdi:robot-vacuum-variant
                  icon_color: accent
                  content: Jar Jar cleaning upstairs
