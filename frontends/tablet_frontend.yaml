          - type: custom:mushroom-legacy-template-card
            entity: sensor.backup_last_successful_automatic_backup
            icon: mdi:cloud-check-variant-outline
            layout: horizontal
            primary: |
              {% set att = states('sensor.backup_last_attempted_automatic_backup') %}
              {% set ok  = states('sensor.backup_last_successful_automatic_backup') %}
              {% if att in ['unknown','unavailable'] or ok in ['unknown','unavailable'] %}
                Backup state unknown
              {% elif as_datetime(att) > as_datetime(ok) %}
                Backup FAILED — last good {{ relative_time(as_datetime(ok)) }} ago
              {% else %}
                Backed up {{ relative_time(as_datetime(ok)) }} ago
              {% endif %}
            secondary: |
              {% set nxt = states('sensor.backup_next_scheduled_automatic_backup') %}
              {% if nxt not in ['unknown','unavailable'] %}
                Next {{ as_timestamp(nxt) | timestamp_custom('%a %-I:%M %p') }}
              {% endif %}
            icon_color: |
              {% set att = states('sensor.backup_last_attempted_automatic_backup') %}
              {% set ok  = states('sensor.backup_last_successful_automatic_backup') %}
              {% if att not in ['unknown','unavailable'] and ok not in ['unknown','unavailable']
                    and as_datetime(att) > as_datetime(ok) %}red{% else %}green{% endif %}
