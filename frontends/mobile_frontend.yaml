                                  content: '{{ states(''sensor.washer_time_display'') }}'
                                  tap_action:
                                    action: navigate
                                    navigation_path: /mobile-rooms/cleaning
                              - type: conditional
                                conditions:
                                  - entity: binary_sensor.dryer_running
                                    state: 'on'
                                chip:
                                  type: template
                                  icon: mdi:tumble-dryer
                                  icon_color: accent
                                  content: '{{ states(''sensor.dryer_time_display'') }}'
                                  tap_action:
                                    action: navigate
                                    navigation_path: /mobile-rooms/cleaning
                              - type: conditional
                                conditions:
