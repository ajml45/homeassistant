# Live copy of the "Mobile" dashboard (/mobile-rooms),
# exported nightly by git-backup.sh. Edit the dashboard in Home Assistant;
# changes made here are overwritten.
kiosk_mode:
  hide_header: true
views:
  - title: Home
    cards:
      - type: vertical-stack
        cards:
          - type: custom:bubble-card
            card_type: separator
            icon: mdi:lamps-outline
            styles: |
              h4 {
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            name: Scenes
          - type: horizontal-stack
            cards:
              - name: All Off
                type: button
                entity: scene.off
                show_name: false
                show_icon: true
                icon: mdi:lightbulb-group-off
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.off
                card_mod:
                  style: |
                    ha-card {
                        height: 60px !important;
                        width: 60px;
                    }
              - name: Wake-Up
                type: button
                entity: script.morning
                show_name: false
                show_icon: true
                icon: mdi:weather-sunset-up
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.morning
                card_mod:
                  style: |
                    ha-card {
                        height: 60px !important;
                        width: 60px;
                    }
              - name: Normal
                type: button
                entity: scene.normal
                show_name: false
                show_icon: true
                icon: mdi:lightbulb-on-50
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.normal
                card_mod:
                  style: |
                    ha-card {
                        height: 60px !important;
                        width: 60px;
                    }
              - name: Relax
                type: button
                entity: scene.relax
                show_name: false
                show_icon: true
                icon: mdi:sofa
                tap_action:
                  action: perform-action
                  perform_action: scene.turn_on
                  target:
                    entity_id: scene.relax
                card_mod:
                  style: |
                    ha-card {
                        height: 60px !important;
                        width: 60px;
                    }
              - name: Bedtime
                type: button
                entity: script.bedtime
                show_name: false
                show_icon: true
                icon: mdi:bed-clock
                tap_action:
                  action: perform-action
                  perform_action: script.turn_on
                  target:
                    entity_id: script.bedtime
                card_mod:
                  style: |
                    ha-card {
                        height: 60px !important;
                        width: 60px;
                    }
          - type: custom:bubble-card
            card_type: separator
            name: Individual Room Controls
            styles: |
              h4 {
              }
              .separator-container div:last-child {
                  background-color: var(--divider-color) !important;
              }
              ha-card div div div:nth-child(2) {
                    height: 5px!important;
              }
            icon: mdi:sofa-single-outline
          - type: horizontal-stack
            cards:
              - type: custom:stack-in-card
                cards:
                  - type: custom:mushroom-legacy-template-card
                    primary: Great Room
                    secondary: |-
                      {{ states('sensor.kitchen_temperature') | round(0) }}°F | {{
                            states('sensor.kitchen_humidity') | round(0) }}%
                    icon: mdi:sofa
                    entity: light.great_room
                    tap_action:
                      action: navigate
                      navigation_path: '#great_room'
                    double_tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                    icon_color: '{{ ''accent'' if is_state(entity, ''on'') }}'
                    fill_container: true
                    layout: horizontal
                    multiline_secondary: false
                    card_mod:
                      style: |
                        :host {
                          --mush-icon-size: 63px;
                          --mush-spacing: 5px;
                          height: 55px;
                          position: relative;
                          left: -11px;
                          top: -8px;
                        }
                  - type: custom:mushroom-chips-card
                    chips:
                      - type: conditional
                        conditions:
                          - entity: sensor.great_room_lights_on
                            state_not: '0'
                        chip:
                          type: template
                          icon: mdi:lightbulb
                          content: '{{ states("sensor.great_room_lights_on") }}'
                          tap_action:
                            action: more-info
                          entity: sensor.great_room_lights_on
                          icon_color: accent
                          card_mod:
                            style: |
                              ha-card {
                                position: absolute;
                                left: 0px;
                              } 
                      - type: conditional
                        conditions:
                          - entity: media_player.sonos_great_room_soundbar
                            state: playing
                        chip:
                          type: template
                          icon_color: disabled
                          icon: |-
                            {% if state_attr('media_player.sonos_great_room_soundbar', 'source') == 'TV'  %}
                              mdi:television-classic
                            {% else %}
                              mdi:music  
                            {% endif %}
                      - type: conditional
                        conditions:
                          - entity: vacuum.matic
                            state: cleaning
                        chip:
                          type: template
                          icon_color: accent
                          icon: mdi:robot-vacuum
                      - type: conditional
                        conditions:
                          - entity: vacuum.dusty_jr
                            state: cleaning
                        chip:
                          type: template
                          icon_color: accent
                          icon: mdi:robot-vacuum
                      - type: conditional
                        conditions:
                          - entity: climate.kitchen
                            state_not: 'off'
                        chip:
                          type: template
                          entity: climate.kitchen
                          icon: |-
                            {% if state_attr(entity, 'hvac_action') == 'cooling' %}
                              mdi:air-conditioner 
                            {% elif state_attr(entity, 'hvac_action') == 'heating'  %}
                              mdi:fire
                            {% elif state_attr(entity, 'fan_mode') == 'on' %}
                              mdi:fan
                            {% elif state_attr(entity, 'hvac_action') == 'idle' and state_attr(entity, 'preset_mode') == 'eco' %}
                              mdi:leaf
                            {% else %}
                              none
                            {% endif %}
                          icon_color: |-
                            {% if state_attr(entity, 'hvac_action') == 'cooling' %}
                              blue 
                            {% elif state_attr(entity, 'hvac_action') == 'heating'  %}
                              orange
                            {% elif state_attr(entity, 'fan_mode') == 'on' %}
                              light-blue
                            {% elif state_attr(entity, 'hvac_action') == 'idle' and state_attr(entity, 'preset_mode') == 'eco' %}
                              green
                            {% else %}
                              none
                            {% endif %} 
                          card_mod:
                            style: |
                              @keyframes rotation {
                                0% {
                                  transform: rotate(0deg);
                                }
                                100% {
                                  transform: rotate(360deg);
                                }
                              }
                              ha-card {
                                {% if is_state('climate.kitchen', 'fan_only') %}
                                  animation: rotation 2s linear infinite;
                                {% endif %}
                              }
                    alignment: end
                    card_mod:
                      style: |
                        ha-card {
                          --chip-box-shadow: none;
                          --chip-background: none;
                          --chip-border-width: 0;
                          --chip-spacing: 2px;
                          position: relative;
                          top: -20px;
                        } 
                card_mod:
                  style: |
                    ha-card {
                      height: 90px;
                      border: 1px solid var(--divider-color);
                      --ha-card-border-width: 0;
                      --mush-card-primary-font-size: 12px;
                      --mush-card-secondary-font-size: 12px;
                    }
              - type: custom:stack-in-card
                cards:
                  - type: custom:mushroom-legacy-template-card
                    primary: Kitchen
                    secondary: |-
                      {{ states('sensor.kitchen_temperature') | round(0) }}°F | {{
                            states('sensor.kitchen_humidity') | round(0) }}%
                    icon: mdi:food-fork-drink
                    entity: light.kitchen
                    tap_action:
                      action: navigate
                      navigation_path: '#kitchen'
                    double_tap_action:
                      action: more-info
                    hold_action:
                      action: toggle
                    icon_color: '{{ ''accent'' if is_state(entity, ''on'') else ''disabled'' }}'
                    fill_container: true
                    layout: horizontal
                    multiline_secondary: false
                    card_mod:
                      style: |
                        :host([dark-mode]) {
                          background: rgba(var(--rgb-primary-text-color), 0.025);
                        } 
                         :host {
                          background: rgba(var(--rgb-primary-text-color), 0.025);
                          --mush-icon-size: 63px;
                          --mush-spacing: 5px;
                          height: 55px;
                          position: relative;
                          left: -11px;
                          top: -8px;
                        }
                  - type: custom:mushroom-chips-card
                    chips:
                      - type: conditional
                        conditions:
                          - entity: sensor.kitchen_lights_on
                            state_not: '0'
                        chip:
                          type: template
                          icon: mdi:lightbulb
                          content: '{{ states("sensor.kitchen_lights_on") }}'
                          tap_action:
                            action: more-info
                          entity: sensor.kitchen_lights_on
                          icon_color: accent
                          card_mod:
                            style: |
                              ha-card {
                                position: absolute;
                                left: 0px;
                              }
                      - type: conditional
                        conditions:
                          - entity: binary_sensor.hue_motion_sensor_1_motion
                            state: 'on'
                        chip:
                          type: template
                          icon_color: disabled
                          icon: mdi:motion-sensor
                          card_mod:
                            style:
                              mushroom-shape-icon$: |
                                ha-icon {
                                  --icon-animation: clip 2s linear infinite;
                                }
                                @keyframes clip {
                                  50% { clip-path: polygon(0 0, 55% 0, 100% 100%, 0 100%); }
                                }
                                .shape {
                                  --shape-animation: motion 2s linear infinite;
                                }
                                @keyframes motion {
                                  0%, 100% { --shape-color: rgba(var(--rgb-blue-color), 0.3); }
                                  50% { --shape-color: rgba(var(--rgb-blue-color), 0.2); }
                                }
                      - type: conditional
                        conditions:
                          - entity: media_player.sonos_kitchen
                            state: playing
                        chip:
                          type: template
                          icon_color: disabled
                          icon: mdi:music
                      - type: conditional
