                            {% elif state_attr(entity, 'hvac_action') == 'heating'  %}
                              orange
                            {% elif state_attr(entity, 'fan_mode') == 'on' %}
                              light-blue
                            {% elif state_attr(entity, 'hvac_action') == 'idle' and state_attr(entity, 'preset_mode') == 'eco' %}
                              green
                            {% else %}
                              none
                            {% endif %} 
                          card_mod:
                            style: |
                              @keyframes rotation {
                                0% {
                                  transform: rotate(0deg);
                                }
                                100% {
                                  transform: rotate(360deg);
                                }
                              }
                              ha-card {
                                {% if is_state('climate.kitchen', 'fan_only') %}
