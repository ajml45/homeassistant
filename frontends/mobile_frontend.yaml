  - title: Music
    path: music
    icon: mdi:music-note
    subview: true
    badges: []
    cards:
      - type: vertical-stack
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:bubble-card
                card_type: empty-column
              - type: custom:bubble-card
                card_type: empty-column
              - type: custom:bubble-card
                card_type: empty-column
              - show_name: true
                show_icon: false
                name: Back
                type: button
                tap_action:
                  action: navigate
                  navigation_path: /mobile-rooms/
                hold_action:
                  action: navigate
                  navigation_path: /mobile-rooms/
                card_mod:
                  style: |
                    :host {
                      --mdc-icon-size: 24px !important;
                      height: 40px;
                    }
                    ha-card {
                      font-size: 14px;
                      font-weight: 600;
                    }
          - type: custom:sonos-card
            sections:
              - player
              - volumes
              - groups
              - grouping
              - media browser
              - queue
            entities:
              - media_player.sonos_great_room_soundbar
              - media_player.sonos_kitchen
              - media_player.sonos_office
              - media_player.sonos_solarium
              - media_player.sonos_basement
              - media_player.sonos_workshop
              - media_player.sonos_garage
            entityNameRegexToReplace: '^Sonos '
            entityNameReplacement: ''
            heightPercentage: 115
            dynamicVolumeSlider: true
            storePlayerInSessionStorage: true
            predefinedGroups:
              - name: All
                volume: 15
                unmuteWhenGrouped: true
                entities:
                  - media_player.sonos_basement
                  - media_player.sonos_great_room_soundbar
                  - media_player.sonos_kitchen
                  - media_player.sonos_office
                  - media_player.sonos_solarium
                  - media_player.sonos_garage
                  - media_player.sonos_workshop
              - name: 1st Floor
                volume: 15
                unmuteWhenGrouped: true
                entities:
                  - media_player.sonos_great_room_soundbar
                  - media_player.sonos_kitchen
                  - media_player.sonos_office
              - name: Basement
                unmuteWhenGrouped: true
                entities:
                  - player: media_player.sonos_basement
                    volume: 15
                  - player: media_player.sonos_solarium
                    volume: 12
                  - player: media_player.sonos_workshop
                    volume: 25
            player:
              showVolumeUpAndDownButtons: true
              artworkAsBackgroundBlur: 10
              controlsAndHeaderBackgroundOpacity: 0.7
              artworkBorderRadius: 12
              showChannel: true
              showAudioInputFormat: true
            grouping:
              skipApplyButton: true
            mediaBrowser:
              itemsPerRow: 3
              hideItems:
                - My media
                - Radio Browser
                - AI Generated Images
                - Frigate
                - Nest
              favorites:
                sortByType: true
