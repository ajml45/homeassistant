- id: '40001'
  alias: Lego Combo Moments
  description: Bonus beat when certain characters are scanned back to back
  mode: restart
  triggers:
  - trigger: state
    entity_id: input_text.lego_active_character
  conditions:
  - '{{ trigger.from_state is not none and trigger.from_state.state not in [''none'',
    ''unknown'', ''''] }}'
  actions:
  - variables:
      prev: '{{ trigger.from_state.state | lower }}'
      curr: '{{ trigger.to_state.state | lower }}'
      jedi:
      - yoda
      - luke
      - beach luke
      - obi wan
      - anakin
      - ahsoka
      - rey
      - ki-adi mundi
  - choose:
    - alias: 'Vader then Luke: lightsaber duel'
      conditions:
      - '{{ prev == ''vader'' and curr in [''luke'', ''beach luke''] }}'
      sequence:
      - delay:
          milliseconds: 4000
      - action: mqtt.publish
        data:
          topic: lego/pi/play
          payload: RANDOM:combat
      - repeat:
          count: 2
          sequence:
          - action: light.turn_on
            target:
              entity_id: light.solarium_rope_light
            data:
              rgb_color:
              - 255
              - 0
              - 0
              brightness_pct: 100
          - delay:
              milliseconds: 400
          - action: light.turn_on
            target:
              entity_id: light.solarium_rope_light
            data:
              rgb_color:
              - 0
              - 255
              - 60
              brightness_pct: 100
          - delay:
              milliseconds: 400
    - alias: 'Obi-Wan and Anakin: master and apprentice'
      conditions:
      - '{{ (prev == ''obi wan'' and curr == ''anakin'') or (prev == ''anakin'' and
        curr == ''obi wan'') }}'
      sequence:
      - delay:
          milliseconds: 4000
      - action: light.turn_on
        target:
          entity_id: light.solarium_rope_light
        data:
          rgb_color:
          - 0
          - 160
          - 255
          brightness_pct: 100
      - delay:
          milliseconds: 600
      - action: light.turn_on
        target:
          entity_id: light.solarium_rope_light
        data:
          rgb_color:
          - 0
          - 80
          - 255
          brightness_pct: 100
      - delay:
          milliseconds: 600
      - action: light.turn_on
        target:
          entity_id: light.solarium_rope_light
        data:
          rgb_color:
          - 0
          - 160
          - 255
          brightness_pct: 90
          transition: 1
    - alias: 'Emperor then a Jedi: Force lightning'
      conditions:
      - '{{ prev == ''emperor'' and curr in jedi }}'
      sequence:
      - delay:
          milliseconds: 4000
      - action: mqtt.publish
        data:
          topic: lego/pi/play
          payload: RANDOM:combat
      - action: light.turn_on
        target:
          entity_id: light.solarium_rope_light
        data:
          effect: Lightning
