    - action: light.turn_on
      target:
        entity_id: light.solarium_rope_light
      data:
        rgb_color: [70, 110, 160]
        brightness_pct: 70
        transition: 2
    # Bonus: Obi-Wan came first, so they fight on rainy Kamino
    - if: "{{ after_obiwan }}"
      then:
        - delay:
            milliseconds: 2500
        - action: mqtt.publish
          data:
            topic: lego/pi/play
            payload: RANDOM:combat
        - action: light.turn_on
          target:
            entity_id: light.solarium_rope_light
          data:
            effect: Downpour
    - action: script.turn_on
      target:
        entity_id: script.lego_return_to_idle

