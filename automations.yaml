      after_ahsoka: '{{ is_state(''input_text.lego_active_character'', ''Ahsoka'')
        }}'
      rival_rgb: '{{ [0, 160, 255] if after_obiwan else [235, 240, 255] }}'
  - action: input_text.set_value
    target:
      entity_id: input_text.lego_active_character
    data:
      value: Darth Maul
  - action: mqtt.publish
    data:
      topic: lego/pi/play
      payload: lightsaber/lightsaber_maul_ignite.wav
  - action: script.turn_on
    target:
      entity_id: script.lego_sonos_swell
    data:
      variables:
        media: '{{ ''spotify:track:6Lr2bN5bhrrqeSC1OOj6sZ'' if after_ahsoka else ''spotify:track:4oZwvVtLqXMdZLJnlQDlt1''
          }}'
        volume: 0.45
  - action: light.turn_on
    target:
      entity_id: light.solarium_rope_light
    data:
      rgb_color:
      - 255
      - 0
      - 0
      brightness_pct: 60
  - delay:
      milliseconds: 1600
  - action: light.turn_on
    target:
      entity_id: light.solarium_rope_light
    data:
      rgb_color:
      - 255
      - 20
      - 0
      brightness_pct: 100
  - delay:
      milliseconds: 600
  - action: light.turn_on
    target:
      entity_id: light.solarium_rope_light
    data:
      rgb_color:
      - 200
      - 0
      - 0
      brightness_pct: 80
      transition: 1
  - if: '{{ after_obiwan or after_ahsoka }}'
    then:
    - delay:
        milliseconds: 1500
    - action: mqtt.publish
      data:
        topic: lego/pi/play
        payload: RANDOM:combat
    - repeat:
        count: 2
        sequence:
        - action: light.turn_on
          target:
            entity_id: light.solarium_rope_light
          data:
            rgb_color:
            - 255
            - 0
            - 0
            brightness_pct: 100
        - delay:
            milliseconds: 400
        - action: light.turn_on
          target:
            entity_id: light.solarium_rope_light
          data:
            rgb_color: '{{ rival_rgb }}'
            brightness_pct: 100
        - delay:
            milliseconds: 400
  - action: script.turn_on
    target:
      entity_id: script.lego_return_to_idle
