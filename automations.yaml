- id: '00013'
  alias: NFC Cassian Andor
  description: Rebel spy. Says "K!" if K-2SO was the last figure scanned, otherwise "Rebellions are built on hope."
  mode: single
  triggers:
    - trigger: mqtt
      topic: lego/bracelet/scanned
      payload: 04-87-65-7F-8F-61-80
  conditions: []
  actions:
    # Check who was on the pad BEFORE Cassian takes over
    - variables:
        after_k2so: "{{ is_state('input_text.lego_active_character', 'K2SO') }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.lego_active_character
      data:
        value: Cassian
    # Pebble line depends on who came before
    - action: mqtt.publish
      data:
        topic: lego/pi/play
        payload: "{{ 'voices/voices_cassian_k.wav' if after_k2so else 'voices/voices_cassian_hope.wav' }}"
    # Andor main title, swelled in
    - action: script.turn_on
      target:
        entity_id: script.lego_sonos_swell
      data:
        variables:
          media: spotify:track:3DsfQmoME4Fe6d4L7H2FJi
          volume: 0.25
    # Ferrix: smoky rust-amber glow
    - action: light.turn_on
      target:
        entity_id: light.solarium_rope_light
      data:
        rgb_color: [200, 80, 20]
        brightness_pct: 40
    - delay:
        milliseconds: 1200
    # Two strikes of the Ferrix time-bell anvil
    - repeat:
        count: 2
        sequence:
          - action: light.turn_on
            target:
              entity_id: light.solarium_rope_light
            data:
              rgb_color: [255, 180, 90]
              brightness_pct: 100
          - delay:
              milliseconds: 200
          - action: light.turn_on
            target:
              entity_id: light.solarium_rope_light
            data:
              rgb_color: [200, 80, 20]
              brightness_pct: 50
              transition: 0.6
          - delay:
              milliseconds: 900
    # Bonus: if K-2SO came first, his icy-blue eyes join the scene
    - if: "{{ after_k2so }}"
      then:
        - action: light.turn_on
          target:
            entity_id: light.solarium_rope_light
          data:
            rgb_color: [170, 210, 255]
            brightness_pct: 70
            transition: 1.5
    - action: script.turn_on
      target:
        entity_id: script.lego_return_to_idle
- id: '00014'
  alias: NFC Jango Fett
  description: Seismic charge detonation. Bonus Kamino rainstorm duel if Obi-Wan was scanned just before.
  mode: single
  triggers:
    - trigger: mqtt
      topic: lego/bracelet/scanned
      payload: 04-01-93-01-4F-61-81
  conditions: []
  actions:
    # Check who was on the pad BEFORE Jango takes over
    - variables:
        after_obiwan: "{{ is_state('input_text.lego_active_character', 'Obi Wan') }}"
    - action: input_text.set_value
      target:
        entity_id: input_text.lego_active_character
      data:
        value: Jango
    # Seismic charge blast
    - action: mqtt.publish
      data:
        topic: lego/pi/play
        payload: combat/combat_seismic_charge_01.wav
    - action: script.turn_on
      target:
        entity_id: script.lego_sonos_swell
      data:
        variables:
          media: spotify:track:20dCnqTMdALhfI81B3avG8
