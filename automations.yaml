    # Lights timed to the charge: blinding white blast on impact, shockwave blue, settle to armor blue
    - action: light.turn_on
      target:
        entity_id: light.solarium_rope_light
      data:
        color_temp_kelvin: 9000
        brightness_pct: 100
    - delay:
        milliseconds: 300
    - action: light.turn_on
      target:
        entity_id: light.solarium_rope_light
      data:
        rgb_color: [0, 120, 255]
        brightness_pct: 100
        transition: 0.4
    - delay:
