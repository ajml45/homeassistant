      # ── Tables and badges ──
      table-row-background-color: "#2C241D"
      table-row-alternative-background-color: "#372D24"
      label-badge-background-color: "#2C241D"
      label-badge-text-color: "#E8E4DA"
      label-badge-red: "#D0736A"
      label-badge-blue: "#8AAECE"
      label-badge-green: "#85A683"
      label-badge-yellow: "#D9B15E"
      label-badge-grey: "#9A9C92"

      # ── Energy dashboard ──
      energy-grid-consumption-color: "#7FA6C4"
      energy-grid-return-color: "#85A683"
      energy-solar-color: "#D9B15E"
      energy-non-fossil-color: "#A9C0D4"
      energy-battery-in-color: "#A394B5"
      energy-battery-out-color: "#C8A87A"
      energy-gas-color: "#D0736A"
      energy-water-color: "#A9C0D4"

      # ── Graphs ──
      history-unknown-color: "#6E7268"
      history-unavailable-color: "#372D24"
      graph-line-color: "#8AAECE"
      accent-medium-color: "#C8A87A"

      # ── Room tints ──
      # Each room card is that room's own wall, rendered at a value shared by
      # every other room card. Hue and chroma carry the room; value carries
      # nothing, so the ink and the brass behave identically on all of them.
      # Light: one step BELOW the page — the marble utility cards stay above it,
      # so a white card is a function and a tinted card is a place.
      # Dark:  one step ABOVE the page — the same hue, the lightness reversed.
      # Chroma is each room's own, capped: the main floor really is a neutral,
      # and pretending otherwise would put olive on two-thirds of the screen.
      # Where two rooms share a wall colour, the hairline carries the second
      # one — the office card is both offices, the upstairs card is both kids.
      mobile-room-greatroom: "#453432"        # brick #9E4034 — the fireplace and the tartan
      mobile-room-greatroom-line: "rgba(158, 64, 52, 0.40)"
      mobile-room-kitchen: "#383834"          # gray-horse #B9BBB1 — the walls, near-neutral on purpose
      mobile-room-kitchen-line: "rgba(185, 187, 177, 0.40)"
      mobile-room-mudroom: "#303942"          # check-blue #7E93A6 — the fern-stripe wallpaper
      mobile-room-mudroom-line: "rgba(126, 147, 166, 0.40)"
      mobile-room-office: "#3A3833"           # measured greige; hairline is hale, for the other office
      mobile-room-office-line: "rgba(67, 75, 86, 0.40)"
      mobile-room-master: "#323A3C"           # soft blue, mist family — CONFIRM the paint
      mobile-room-master-line: "rgba(164, 185, 191, 0.40)"
      mobile-room-upstairs: "#423537"         # marshmallow bunny #FDE2E6; hairline beacon gray #CDD7DE
      mobile-room-upstairs-line: "rgba(205, 215, 222, 0.40)"
      mobile-room-basement: "#3C382D"         # manchester-tan #DBD2BC — walls, trim and paneling, all one colour
      mobile-room-basement-line: "rgba(219, 210, 188, 0.40)"
      mobile-room-solarium: "#393835"         # stacked-stone #ABA79C; hairline copper #B87352
      mobile-room-solarium-line: "rgba(184, 115, 82, 0.40)"
      mobile-room-exterior: "#2D3C2B"         # sage #5F7A5C — boxwood and foliage
      mobile-room-exterior-line: "rgba(95, 122, 92, 0.40)"

      # Shared by every room card. The tinted surface sits low enough that
      # the same tokens resolve to the dark-mode steps.
      mobile-room-ink-2: "#B9BBB1"          # gray-horse, 6.0:1 on every tint
      mobile-room-active: "#C4A052"         # brass-light — 4.7:1 on every tint
      mobile-room-active-rgb: "196, 160, 82"
      mobile-room-idle: "#8A8D82"           # off icons
      mobile-room-idle-rgb: "138, 141, 130"

# ─────────────────────────────────────────────────────────────────────────────
# Dashboard side — one card_mod block per room card
#
# Goes on the custom:stack-in-card wrapper, replacing the existing block. The
# only thing that changes between rooms is the token name.
#
#   card_mod:
#     style: |
#       ha-card {
#         height: 90px;
#         background: var(--mobile-room-kitchen);
#         border: 1px solid var(--mobile-room-kitchen-line);
#         --ha-card-background: var(--mobile-room-kitchen);
#         --ha-card-border-width: 0;
#         --secondary-text-color: var(--mobile-room-ink-2);
#         --mush-card-primary-font-size: 12px;
#         --mush-card-secondary-font-size: 10px;
#       }
#
# And on the mushroom-legacy-template-card inside it, so the icon follows the
# mode instead of a baked-in literal. card_mod styles are Jinja-templated, so
# the state test happens in Jinja and the colour choice happens in CSS:
#
#   card_mod:
#     style: |
#       mushroom-shape-icon {
#       {% if is_state(config.entity, 'on') %}
#         --icon-color: var(--mobile-room-active) !important;
#         --shape-color: rgba(var(--mobile-room-active-rgb), 0.20) !important;
#       {% else %}
#         --icon-color: var(--mobile-room-idle) !important;
#         --shape-color: rgba(var(--mobile-room-idle-rgb), 0.15) !important;
#       {% endif %}
#       }
#
# With that in place, `icon_color:` on the card can go away entirely — which
# also retires the Great Room template that has no else clause.
#
# Tuning knobs
#   Tints too strong          raise every room value one step toward #E2E2D9
#   Tints invisible in sun    swap page to "#D7D7CE" and lift the tints instead
#   Room cards too heavy      drop the hairline alpha from 0.55 to 0.35
#   Want the tablet dusk      copy the dark surfaces from kitchen_tablet.yaml
# ─────────────────────────────────────────────────────────────────────────────
