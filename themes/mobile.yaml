    # DARK — walnut ground, room cards one step above. The tints invert.
    # ═══════════════════════════════════════════════════════════════════════
    dark:

      # ── Identity ──
      primary-color: "#8AAECE"              # navy-light
      dark-primary-color: "#3E5F91"
      light-primary-color: "#A9C0D4"
      accent-color: "#C4A052"               # brass-light
      rgb-primary-color: "138, 174, 206"
      rgb-accent-color: "196, 160, 82"

      # ── Surfaces ──
      # Walnut, not dusk. The tablets run dusk because they are lit objects in
      # a lit room at 7pm; a phone in dark mode is usually the only lit thing
      # in the room, which is the case walnut-dark was chosen for.
      primary-background-color: "#221B15"   # walnut-dark
      card-background-color: "#2C241D"      # 1.11:1 above the page
      ha-card-background: "#2C241D"
      secondary-background-color: "#372D24" # sunk
      app-header-background-color: "#2C241D" # hidden by kiosk_mode; set for the popups
      app-header-text-color: "#EFEEE5"
      app-header-edit-background-color: "#372D24"
      markdown-code-background-color: "#372D24"
      code-editor-background-color: "#372D24"
      mdc-theme-surface: "#2C241D"
      more-info-header-background: "#2C241D"

      # ── Text ──
