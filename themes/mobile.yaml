      state-icon-active-color: "#C4A052"
      state-active-color: "#C4A052"
      bubble-house-accent: "#8AAECE"   # navy-light — Bubble fills
      state-inactive-color: "#8A8D82"
      state-unavailable-color: "#6E7268"
      paper-item-icon-color: "#B9BBB1"
      paper-item-icon-active-color: "#C4A052"

      # ── Base colour ramp, lifted for dark ──
      red-color: "#D0736A"
      pink-color: "#D08A83"
      purple-color: "#A394B5"
      deep-purple-color: "#8E82A8"
      indigo-color: "#6F8CB8"
      blue-color: "#8AAECE"
      light-blue-color: "#7FA6C4"
      cyan-color: "#A9C0D4"
      teal-color: "#8AB0A6"
      green-color: "#85A683"
      light-green-color: "#A3BE9C"
      lime-color: "#B7C08A"
      yellow-color: "#D9C07E"
      amber-color: "#D9B15E"
      orange-color: "#C8A87A"       # rattan
      deep-orange-color: "#C98A5C"
      brown-color: "#8A6A4E"
      light-grey-color: "#C6C8BE"
      grey-color: "#9A9C92"
      dark-grey-color: "#6E7268"
      blue-grey-color: "#93A3AC"
      black-color: "#221B15"
      white-color: "#EFEEE5"
      disabled-color: "#6E7268"

      rgb-red-color: "208, 115, 106"
      rgb-pink-color: "208, 138, 131"
      rgb-purple-color: "163, 148, 181"
      rgb-deep-purple-color: "142, 130, 168"
      rgb-indigo-color: "111, 140, 184"
      rgb-blue-color: "138, 174, 206"
      rgb-light-blue-color: "127, 166, 196"
      rgb-cyan-color: "169, 192, 212"
      rgb-teal-color: "138, 176, 166"
      rgb-green-color: "133, 166, 131"
      rgb-light-green-color: "163, 190, 156"
      rgb-lime-color: "183, 192, 138"
      rgb-yellow-color: "217, 192, 126"
      rgb-amber-color: "217, 177, 94"
      rgb-orange-color: "200, 168, 122"
      rgb-deep-orange-color: "201, 138, 92"
      rgb-brown-color: "138, 106, 78"
      rgb-light-grey-color: "198, 200, 190"
      rgb-grey-color: "154, 156, 146"
      rgb-dark-grey-color: "110, 114, 104"
      rgb-blue-grey-color: "147, 163, 172"
      rgb-black-color: "34, 27, 21"
      rgb-white-color: "239, 238, 229"
      rgb-disabled-color: "110, 114, 104"
      rgb-state-default-color: "196, 160, 82"

      # ── Semantic ──
      error-color: "#D0736A"
      warning-color: "#D9B15E"
      success-color: "#85A683"
      info-color: "#7FA6C4"

      # ── Sidebar ──
      sidebar-background-color: "#59635B"   # gray-horse-deep, lifted
      sidebar-text-color: "#EFEEE5"
      sidebar-icon-color: "#C6C8BE"
      sidebar-selected-background-color: "rgba(196, 160, 82, 0.20)"
      sidebar-selected-text-color: "#EFEEE5"
      sidebar-selected-icon-color: "#D9B15E"
      paper-listbox-background-color: "#59635B"

      # ── Controls ──
      mdc-theme-primary: "#C4A052"
      mdc-theme-on-primary: "#221B15"
      switch-checked-color: "#C4A052"
      switch-checked-button-color: "#C4A052"
      switch-checked-track-color: "#8A6A2E"
      switch-unchecked-color: "#B9BBB1"
      switch-unchecked-button-color: "#B9BBB1"
      switch-unchecked-track-color: "#4A3F35"
      ha-switch-checked-background-color: "#C4A052"
      ha-switch-checked-thumb-background-color: "#2C241D"
      ha-switch-checked-border-color: "#C4A052"
      ha-switch-checked-thumb-border-color: "#C4A052"
      ha-switch-checked-background-color-hover: "#D9B15E"
      ha-switch-background-color: "#4A3F35"
      ha-switch-thumb-background-color: "#B9BBB1"
