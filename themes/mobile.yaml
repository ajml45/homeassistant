      secondary-text-color: "#B9BBB1"       # gray-horse, 9.1:1 on the walnut card
      text-primary-color: "#221B15"         # text on the light primary/accent fills
      text-light-primary-color: "#E8E4DA"
      disabled-text-color: "#7C7F76"
      ha-card-header-color: "#E8E4DA"

