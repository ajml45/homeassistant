# ─────────────────────────────────────────────────────────────────────────────
# Tuning knobs — one-line swaps, in the order you're most likely to want them
#
#   Sidebar too heavy in light mode      light: sidebar-background-color: "#6E7367"
#   Sidebar too light in dark mode       dark:  sidebar-background-color: "#2C241D"
#   Dark header too blue                 dark:  app-header-background-color: "#2C241D"
#   Cards not separating from the page   light: card-background-color: "#F8F7F3"
#   Want visible card edges              raise the two rgba border alphas to 0.7 / 0.28
#   Want shadows back                    ha-card-box-shadow: "0 1px 3px rgba(43,46,41,0.10)"
#
# Known rough edge: some Material 3 dropdown surfaces (automation editor
# selectors) ignore the theme and render on their own tokens. If you hit white
# boxes in dark mode, add these to the dark block:
#   md-sys-color-surface: "#2C241D"
#   md-sys-color-surface-container: "#372D24"
#   md-sys-color-surface-container-high: "#42362B"
#   md-sys-color-on-surface: "#E8E4DA"
# ─────────────────────────────────────────────────────────────────────────────
